<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stark Battle Simulator</title>

<style>
:root{
    --bg:#05080d;
    --panel:#0a1119;
    --panel2:#0d1720;
    --line:#29404d;
    --cyan:#42d9ff;
    --gold:#ffc857;
    --red:#ff4d5a;
    --green:#5cff9d;
    --text:#eaf7ff;
    --muted:#78909f;
}

*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -10%,#163b50 0%,transparent 38%),
        linear-gradient(#05080d,#020406);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.07;
    background:
        linear-gradient(#fff 1px,transparent 1px),
        linear-gradient(90deg,#fff 1px,transparent 1px);
    background-size:45px 45px;
}

header{
    padding:22px 35px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#071019e8;
    border-bottom:1px solid var(--line);
    box-shadow:0 0 30px #000;
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:5px;
}

.logo span{
    color:var(--cyan);
}

.status{
    color:var(--green);
    font-size:11px;
    letter-spacing:2px;
}

.status-dot{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 12px var(--green);
    margin-right:8px;
}

main{
    width:min(1450px,94%);
    margin:auto;
    padding:25px 0 50px;
}

/* CONTROL PANEL */

.control-panel{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    padding:18px;
    background:linear-gradient(145deg,#0d1720,#070c11);
    border:1px solid var(--line);
    box-shadow:0 15px 40px #0009;
}

.control label{
    display:block;
    color:var(--muted);
    font-size:10px;
    letter-spacing:2px;
    margin-bottom:7px;
}

select{
    width:100%;
    padding:12px;
    color:white;
    background:#0a1118;
    border:1px solid #35505f;
    border-radius:3px;
    outline:none;
}

.action-bar{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:12px;
    margin:14px 0;
}

button{
    padding:13px 18px;
    color:white;
    background:#0c1720;
    border:1px solid #35505f;
    border-radius:3px;
    font-weight:bold;
    letter-spacing:1px;
    cursor:pointer;
    transition:.15s;
}

button:hover{
    border-color:var(--cyan);
    box-shadow:0 0 18px #42d9ff33;
    transform:translateY(-1px);
}

.primary{
    background:linear-gradient(90deg,#104052,#11627c);
    border-color:#40c8eb;
}

.danger{
    border-color:#71353b;
}

/* POOL */

.panel{
    background:linear-gradient(145deg,#0c151e,#070b10);
    border:1px solid var(--line);
    box-shadow:0 15px 40px #0008;
}

.pool-panel{
    padding:18px;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:13px;
}

.panel-title{
    font-size:12px;
    letter-spacing:3px;
    font-weight:bold;
}

.panel-status{
    color:var(--gold);
    font-size:11px;
}

.pool{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:9px;
}

.character-card{
    position:relative;
    padding:13px;
    background:#0b131b;
    border:1px solid #263b48;
    cursor:pointer;
    overflow:hidden;
    transition:.15s;
}

.character-card:hover{
    border-color:var(--accent);
    box-shadow:0 0 18px color-mix(in srgb,var(--accent),transparent 65%);
    transform:translateY(-2px);
}

.character-card.selected{
    opacity:.25;
    cursor:not-allowed;
}

.character-name{
    font-weight:bold;
    font-size:13px;
}

.character-info{
    margin-top:5px;
    font-size:9px;
    color:var(--muted);
}

.pick-label{
    position:absolute;
    right:7px;
    top:7px;
    color:var(--gold);
    font-size:8px;
}

/* TEAMS */

.teams{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:15px;
}

.team{
    padding:18px;
    background:linear-gradient(145deg,#0c151e,#070b10);
    border:1px solid var(--line);
}

.team.alpha{
    box-shadow:inset 0 0 40px #1689b312;
}

.team.omega{
    box-shadow:inset 0 0 40px #ff304012;
}

.team-title{
    font-size:14px;
    letter-spacing:3px;
    margin-bottom:15px;
}

.alpha-title{
    color:#55cfff;
}

.omega-title{
    color:#ff6974;
}

.slots{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.slot{
    min-height:100px;
    padding:9px;
    text-align:center;
    background:#080e14;
    border:1px dashed #2a3d49;
}

.slot.filled{
    border-style:solid;
}

.avatar{
    width:40px;
    height:40px;
    margin:auto;
    margin-bottom:7px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:var(--accent);
    border:2px solid #ffffff77;
    font-size:11px;
    font-weight:bold;
}

.slot-name{
    font-size:10px;
}

/* BATTLE */

.battle{
    margin-top:16px;
    padding:20px;
}

.battle-header{
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:12px;
}

.battle-feed{
    max-height:720px;
    overflow:auto;
    padding:5px 3px;
}

.round-card{
    margin:15px 0;
    padding:18px;
    background:#091119;
    border-left:3px solid var(--cyan);
    line-height:1.7;
    color:#cbd9e1;
}

.round-heading{
    color:var(--gold);
    font-size:12px;
    letter-spacing:2px;
    margin-bottom:9px;
    font-weight:bold;
}

.move{
    color:var(--cyan);
    font-weight:bold;
}

.impact{
    color:#fff;
    font-weight:bold;
}

.eliminated{
    color:#ff6974;
    font-weight:bold;
}

.winner{
    margin:20px 0;
    padding:25px;
    text-align:center;
    border:1px solid var(--gold);
    background:#211b09;
    box-shadow:0 0 30px #ffc85722;
}

.winner-title{
    color:var(--gold);
    font-size:27px;
    font-weight:900;
    letter-spacing:3px;
}

.health-panel{
    margin-top:15px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.health-team{
    padding:12px;
    background:#070d13;
    border:1px solid var(--line);
}

.health-name{
    font-size:11px;
    margin-bottom:8px;
}

.health-row{
    margin:8px 0;
}

.health-label{
    display:flex;
    justify-content:space-between;
    font-size:9px;
    color:#a9bbc5;
}

.health-bar{
    height:6px;
    background:#1c2932;
    margin-top:4px;
}

.health-fill{
    height:100%;
    background:var(--green);
    transition:.5s;
}

.health-fill.low{
    background:#ff9b61;
}

.health-fill.dead{
    background:#ff4654;
}

/* WHEEL */

#wheelModal{
    position:fixed;
    inset:0;
    background:#020509ee;
    display:none;
    place-items:center;
    z-index:20;
}

.wheel-box{
    width:min(540px,92vw);
    padding:25px;
    text-align:center;
    background:#091119;
    border:1px solid #416170;
    box-shadow:0 0 50px #000;
}

.wheel{
    width:300px;
    height:300px;
    margin:20px auto;
    border-radius:50%;
    border:8px solid #1c2d37;
    background:conic-gradient(
        #d84b55 0deg 60deg,
        #c99a3a 60deg 120deg,
        #347f9d 120deg 180deg,
        #8a4d9e 180deg 240deg,
        #3f9d70 240deg 300deg,
        #8b6943 300deg 360deg
    );
    box-shadow:0 0 40px #42d9ff22;
    transition:transform 2.6s cubic-bezier(.1,.8,.15,1);
}

.pointer{
    color:var(--gold);
    font-size:30px;
}

#wheelResult{
    color:var(--gold);
    min-height:20px;
}

/* RESPONSIVE */

@media(max-width:900px){
    .control-panel{
        grid-template-columns:repeat(2,1fr);
    }

    .pool{
        grid-template-columns:repeat(2,1fr);
    }

    .teams{
        grid-template-columns:1fr;
    }

    .slots{
        grid-template-columns:repeat(2,1fr);
    }

    .action-bar{
        grid-template-columns:1fr;
    }
}
</style>
</head>

            <option value="2">2v2</option>
            <option value="3">3v3</option>
            <option value="4">4v4</option>
            <option value="5">5v5</option>
        </select>
    </div>

    <div class="control">
        <label>CHARACTER POOL</label>
        <select id="universe">
            <option>Marvel + DC</option>
            <option>Marvel</option>
            <option>DC</option>
        </select>
    </div>

    <div class="control">
        <label>POWER MODE</label>
        <select id="powerMode">
            <option>Standard</option>
            <option>Amped</option>
            <option>Mixed</option>
        </select>
    </div>

    <div class="control">
        <label>BATTLEFIELD</label>
        <select id="battlefield">
            <option>Abandoned City</option>
            <option>Stark Tower</option>
            <option>Gotham Rooftops</option>
            <option>Savage Land</option>
            <option>Cosmic Arena</option>
        </select>
    </div>

    <div class="control">
        <label>STORY DEPTH</label>
        <select id="storyDepth">
            <option value="brief">Brief</option>
            <option value="detailed" selected>Detailed</option>
            <option value="cinematic">Cinematic</option>
        </select>
    </div>

</section>

<div class="action-bar">

    <button class="primary" onclick="generatePool()">
        ⚡ GENERATE 10 // OPEN DRAFT
    </button>

    <button onclick="openWheel()">
        ◉ SPINNING WHEEL
    </button>

    <button class="danger" onclick="resetSystem()">
        RESET SYSTEM
    </button>

</div>

<!-- CHARACTER BOARD -->

<section class="panel pool-panel">

    <div class="panel-header">

        <div class="panel-title">
            AVAILABLE COMBATANTS
        </div>

        <div class="panel-status" id="draftStatus">
            GENERATE 10 TO BEGIN
        </div>

    </div>

    <div id="pool" class="pool"></div>

</section>

<!-- TEAMS -->

<section class="teams">

    <div class="team alpha">

            ◉ TEAM ALPHA

        <div id="team1" class="slots"></div>

    </div>

    <div class="team omega">

        <div class="team-title omega-title">
            ◉ TEAM OMEGA

        <div id="team2" class="slots"></div>

    </div>

</section>

<!-- BATTLE -->

<section class="panel battle">

    <div class="battle-header">

        <div class="panel-title">
            TACTICAL BATTLE FEED
        </div>

        <div class="panel-status" id="battleStatus">
            SYSTEM STANDBY
        </div>

    </div>

    <div class="health-panel" id="healthPanel"></div>

    <div id="battleFeed" class="battle-feed">

        <div class="round-card">
            Awaiting two complete teams. Generate a pool, draft your combatants,
            and initiate the simulation.
        </div>

    </div>

</section>

<button
    class="primary"
    style="margin-top:15px;width:100%;font-size:16px"
    onclick="startBattle()">

    ⚔ INITIATE FULL BATTLE SIMULATION

</button>

</main>

<!-- WHEEL -->

<div id="wheelModal">

    <div class="wheel-box">

        <div class="pointer">▼</div>

        <div id="wheel" class="wheel"></div>

        <button class="primary" onclick="spinWheel()">
            SPIN // SELECT COMBATANT
        </button>

        <button onclick="closeWheel()">
            CLOSE
        </button>

        <div id="wheelResult"></div>

    </div>

</div>

/* =========================================================
   GAME STATE
   ========================================================= */

let pool=[];
let team1=[];
let team2=[];
let draftTurn=1;
let spinning=false;
let battleRunning=false;


/* =========================================================
   HELPERS
   ========================================================= */

function random(array){
    return array[Math.floor(Math.random()*array.length)];
}

function findCharacter(name){
    return characters.find(c=>c.name===name);
}

function initials(name){
    return name
        .split(" ")
        .map(word=>word[0])
        .join("")
        .slice(0,2);
}


/* =========================================================
   GENERATE 10
   ========================================================= */

function generatePool(){

    const universe=document.getElementById("universe").value;

    let available=characters.filter(c=>{
        if(universe==="Marvel + DC") return true;
        return c.universe===universe;
    });

    pool=available
        .sort(()=>Math.random()-.5)
        .slice(0,10);

    team1=[];
    team2=[];
    draftTurn=1;

    renderTeams();
    renderPool();

    document.getElementById("battleFeed").innerHTML=`
        <div class="round-card">
            <div class="round-heading">DRAFT INITIALIZED</div>
            Ten combatants have entered the selection pool.
            <strong>Team Alpha selects first.</strong>
            Teams will alternate picks until the board is empty.
        </div>
    `;

    document.getElementById("battleStatus").textContent="DRAFT PHASE";
}


/* =========================================================
   RENDER POOL
   ========================================================= */

function renderPool(){

    const poolElement=document.getElementById("pool");

    poolElement.innerHTML=pool.map((c,index)=>{

        const selected=
            team1.includes(c.name) ||
            team2.includes(c.name);

        let owner="";

        if(team1.includes(c.name)) owner="ALPHA";
        if(team2.includes(c.name)) owner="OMEGA";

        return `
            <div
                class="character-card ${selected?"selected":""}"
                style="--accent:${c.color}"
                onclick="draftCharacter(${index})">

                <div class="character-name">
                    ${c.name}
                </div>

                <div class="character-info">
                    ${c.universe} // POWER ${c.power}
                </div>

                <div class="pick-label">
                    ${owner}
                </div>

            </div>
        `;

    }).join("");

    document.getElementById("draftStatus").textContent=
        pool.length?
        `NEXT PICK: TEAM ${draftTurn===1?"ALPHA":"OMEGA"}`:
        "BOARD EMPTY";
}


/* =========================================================
   DRAFT
   ========================================================= */

function draftCharacter(index){

    if(battleRunning)return;

    const character=pool[index];

    if(!character)return;

    const size=Number(
        document.getElementById("teamSize").value
    );

    const target=
        draftTurn===1?
        team1:
        team2;

    if(target.length>=size){

        alert(
            `Team ${draftTurn===1?"Alpha":"Omega"} is already full.`
        );

        return;
    }

    target.push(character.name);

    pool.splice(index,1);

    draftTurn=draftTurn===1?2:1;

    renderPool();
    renderTeams();
}


/* =========================================================
   RENDER TEAMS
   ========================================================= */

function renderTeams(){

    const size=Number(
        document.getElementById("teamSize").value
    );

    for(let team=1;team<=2;team++){

        const list=team===1?team1:team2;

        const element=document.getElementById(
            team===1?"team1":"team2"
        );

        element.innerHTML="";

        for(let i=0;i<size;i++){

            const name=list[i];

            if(!name){

                element.innerHTML+=`
                    <div class="slot">
                        <div style="color:#506572;margin-top:25px">
                            EMPTY
                        </div>
                    </div>
                `;

                continue;
            }

            const c=findCharacter(name);

            element.innerHTML+=`
                <div
                    class="slot filled"
                    style="--accent:${c.color}">

                    <div
                        class="avatar"
                        style="--accent:${c.color}">

                        ${initials(c.name)}

                    </div>

                    <div class="slot-name">
                        ${c.name}
                    </div>

                </div>
            `;
        }
    }
}


/* =========================================================
   SPINNING WHEEL
   ========================================================= */

function openWheel(){

    document.getElementById("wheelModal").style.display="grid";
    document.getElementById("wheelResult").textContent="";
}

function closeWheel(){

    document.getElementById("wheelModal").style.display="none";
}

function spinWheel(){

    if(spinning)return;

    if(pool.length===0){

        document.getElementById("wheelResult").textContent=
            "GENERATE 10 FIRST.";

        return;
    }

    spinning=true;

    const wheel=document.getElementById("wheel");

    wheel.style.transform=
        `rotate(${1440+Math.random()*720}deg)`;

    setTimeout(()=>{

        const character=random(pool);

        document.getElementById("wheelResult").textContent=
            `SELECTED: ${character.name}`;

        const index=pool.findIndex(
            c=>c.name===character.name
        );

        setTimeout(()=>{

            draftCharacter(index);

            spinning=false;

            closeWheel();

        },900);

    },2600);
}


/* =========================================================
   BATTLE UNIT
   ========================================================= */

function createUnit(name,team){

    const c=findCharacter(name);

    let hp=100;

    const mode=
        document.getElementById("powerMode").value;

    let power=c.power;
    let defense=c.defense;

    if(mode==="Amped"){

        power*=1.2;
        defense*=1.15;

    }

    if(mode==="Mixed"){

        if(Math.random()<.5){

            power*=1.2;

        }else{

            defense*=1.15;

        }
    }

    return{

        name:c.name,
        team,
        hp,
        maxHp:100,
        power,
        defense,
        speed:c.speed,
        intelligence:c.intelligence,
        moves:c.moves,
        traits:c.traits,
        eliminated:false,
        lastMove:null
    };
}


/* =========================================================
   BATTLE START
   ========================================================= */

function startBattle(){

    const size=Number(
        document.getElementById("teamSize").value
    );

    if(team1.length!==size || team2.length!==size){

        alert(
            "Both teams must be completely drafted before starting."
        );

        return;
    }

    if(battleRunning)return;

    battleRunning=true;

    document.getElementById("battleFeed").innerHTML="";

    document.getElementById("battleStatus").textContent=
        "SIMULATION ACTIVE";

    const units=[
        ...team1.map(name=>createUnit(name,1)),
        ...team2.map(name=>createUnit(name,2))
    ];

    renderHealth(units);

    const battlefield=
        document.getElementById("battlefield").value;

    addBattleText(`
        <div class="round-card">
            <div class="round-heading">
                BATTLE INITIALIZATION
            </div>

            The combatants enter the
            <strong>${battlefield}</strong>,
            and the atmosphere changes immediately.
            Neither side has room for hesitation.
            Every fighter understands that this is not a
            single exchange—the battle will continue until
            one team has been completely eliminated.
        </div>
    `);

    setTimeout(
        ()=>runRound(units,1),
        700
    );
}


/* =========================================================
   ROUND ENGINE
   ========================================================= */

function runRound(units,round){

    const alive1=
        units.filter(u=>u.team===1&&!u.eliminated);

    const alive2=
        units.filter(u=>u.team===2&&!u.eliminated);

    if(alive1.length===0 || alive2.length===0){

        finishBattle(
            alive1.length>0?1:2,
            units,
            round
        );

        return;
    }

    const depth=
        document.getElementById("storyDepth").value;

    const battlefield=
        document.getElementById("battlefield").value;

    addBattleText(`
        <div class="round-card">
            <div class="round-heading">
                ROUND ${round} // ${battlefield.toUpperCase()}
            </div>

            The next exchange begins with both teams
            repositioning across the battlefield.
            The surviving combatants are already adapting
            to what they have witnessed.
        </div>
    `);

    let actors=[...alive1,...alive2]
        .sort((a,b)=>b.speed-a.speed);

    let index=0;

    function nextAction(){

        if(index>=actors.length){

            renderHealth(units);

            setTimeout(
                ()=>runRound(units,round+1),
                depth==="cinematic"?900:
                depth==="detailed"?600:350
            );

            return;
        }

        const attacker=actors[index++];

        if(attacker.eliminated){

            nextAction();
            return;
        }

        const enemies=
            units.filter(
                u=>u.team!==attacker.team&&!u.eliminated
            );

        if(enemies.length===0){

            nextAction();
            return;
        }

        const target=
            chooseTarget(attacker,enemies);

        const move=
            chooseMove(attacker,target);

        const result=
            calculateDamage(attacker,target,move);

        const narration=
            generateNarration(
                attacker,
                target,
                move,
                result,
                round,
                battlefield
            );

        if(!result.evaded){

            target.hp=
                Math.max(
                    0,
                    target.hp-result.damage
                );

        }

        attacker.lastMove=move;

        addBattleText(narration);

        if(target.hp<=0){

            target.hp=0;
            target.eliminated=true;

            addBattleText(`
                <div class="round-card">
                    <strong class="eliminated">
                        ${target.name} HAS BEEN ELIMINATED.
                    </strong>

                    ${target.name} is no longer able to continue.
                    The remaining members of
                    <strong>
                        Team ${target.team===1?"Alpha":"Omega"}
                    </strong>
                    are now forced to carry the battle forward
                    without them.
                </div>
            `);
        }

        renderHealth(units);

        setTimeout(
            nextAction,
            depth==="cinematic"?1200:
            depth==="detailed"?750:400
        );
    }

    nextAction();
}


/* =========================================================
   TARGETING
   ========================================================= */

function chooseTarget(attacker,enemies){

    /*
        Characters with higher health and offensive ability
        become more attractive targets, while fast/intelligent
        characters are treated as threats.
    */

    const scored=enemies.map(enemy=>{

        let score=0;

        score+=enemy.power*.35;
        score+=enemy.intelligence*.25;
        score+=enemy.speed*.15;
        score+=enemy.hp*.2;

        if(attacker.traits.includes("analyzes opponents")){
            score+=enemy.intelligence*.2;
        }

        return{
            enemy,
            score:score+Math.random()*25
        };

    });

    scored.sort(
        (a,b)=>b.score-a.score
    );

    return scored[0].enemy;
}


/* =========================================================
   MOVE SELECTION
   ========================================================= */

function chooseMove(attacker,target){

    /*
        The move isn't simply random.
        The engine considers the target and battle state.
    */

    if(
        target.hp<30 &&
        attacker.moves.some(
            m=>m.includes("Execution")||
               m.includes("Overdrive")||
               m.includes("Smash")
        )
    ){

        return attacker.moves.find(
            m=>m.includes("Execution")||
               m.includes("Overdrive")||
               m.includes("Smash")
        );
    }

    if(
        target.speed>attacker.speed &&
        attacker.moves.some(
            m=>m.includes("Counter")||
               m.includes("Bind")||
               m.includes("Cage")
        )
    ){

        return attacker.moves.find(
            m=>m.includes("Counter")||
               m.includes("Bind")||
               m.includes("Cage")
        );
    }

    return random(attacker.moves);
}


/* =========================================================
   DAMAGE
   ========================================================= */

function calculateDamage(attacker,target,move){

    let base=
        attacker.power*.46+
        attacker.intelligence*.16+
        attacker.speed*.12;

    let defense=
        target.defense*.34;

    let damage=
        base-defense;

    damage*=
        .78+
        Math.random()*.44;

    /*
        Heavy attacks.
    */

    if(
        move.includes("Smash")||
        move.includes("Blast")||
        move.includes("God")||
        move.includes("Beam")||
        move.includes("Strike")
    ){

        damage*=1.08;
    }

    let critical=
        Math.random()<.13;

    if(critical){

        damage*=1.35;
    }

    /*
        Evasion.
    */

    let evade=
        Math.random()<
        Math.max(
            .025,
            (target.speed-attacker.speed)/500
        );

    return{
        damage:Math.max(
            5,
            Math.round(damage)
        ),
        critical,
        evaded:evade
    };
}


/* =========================================================
   SOPHISTICATED NARRATION
   ========================================================= */

function generateNarration(
    attacker,
    target,
    move,
    result,
    round,
    battlefield
){

    const openings=[
        `${attacker.name} moves first, refusing to give ${target.name} enough time to establish a rhythm.`,
        `${attacker.name} studies ${target.name} for a brief moment before committing to the next exchange.`,
        `The distance between the two combatants suddenly disappears as ${attacker.name} commits to an aggressive advance.`,
        `With the battle becoming increasingly chaotic, ${attacker.name} identifies ${target.name} as the immediate threat.`,
        `${attacker.name} changes position through the wreckage, searching for an angle that will force ${target.name} to react.`
    ];

    const tactics=[
        `Rather than relying on raw power, the attack is designed to disrupt ${target.name}'s positioning.`,
        `The choice is deliberate; ${attacker.name} is attempting to exploit a moment of hesitation rather than simply overpower the opponent.`,
        `The maneuver forces ${target.name} to defend from an awkward position, limiting the options available for the counterattack.`,
        `The timing is important. ${attacker.name} waits until ${target.name} commits before unleashing the attack.`,
        `${attacker.name} uses the surrounding battlefield as part of the strategy, turning debris and distance into advantages.`
    ];

    const impacts=[
        `${target.name} absorbs the impact and is driven backward through the battlefield.`,
        `The force of the attack sends ${target.name} skidding across the ground before they manage to regain their footing.`,
        `${target.name} manages to remain upright, but the attack clearly changes the balance of the exchange.`,
        `The strike connects cleanly, forcing ${target.name} to abandon their previous position.`,
        `The collision tears through the surrounding environment as ${target.name} struggles to recover.`
    ];

    const defense=[
        `${target.name} reacts quickly enough to avoid the center of the attack, but the maneuver still forces them away from the confrontation.`,
        `${target.name} reads the incoming movement and narrowly avoids the worst of it.`,
        `${target.name} attempts to counter immediately, but the speed of the exchange leaves little room for a clean response.`
    ];

    let text=
        `<div class="round-card">
            <div class="round-heading">
                ROUND ${round} // ${attacker.name.toUpperCase()}
            </div>

            ${random(openings)}

            ${random(tactics)}

            <br><br>

            <span class="move">
                "${move}"
            </span>

            ${attacker.name}
            unleashes the technique against
            ${target.name}.
        `;

    if(result.evaded){

        text+=`
            ${random(defense)}
            The attack fails to deal meaningful damage,
            but ${attacker.name}'s positioning forces
            ${target.name} to give ground.
        `;

    }else{

        text+=`
            ${random(impacts)}
        `;

        if(result.critical){

            text+=`
                The timing is exceptional.
                The blow lands with enough precision to
                produce a <span class="impact">critical impact</span>.
            `;
        }

        text+=`
            <br><br>
            <strong>
                ${target.name} loses ${result.damage}% health.
            </strong>
        `;
    }

    text+=`</div>`;

    return text;
}


/* =========================================================
   HEALTH DISPLAY
   ========================================================= */

function renderHealth(units){

    const panel=document.getElementById("healthPanel");

    let html="";

    for(let team=1;team<=2;team++){

        const teamUnits=
            units.filter(u=>u.team===team);

        html+=`
            <div class="health-team">

                <div class="health-name">
                    TEAM ${team===1?"ALPHA":"OMEGA"}
                </div>
        `;

        teamUnits.forEach(u=>{

            const percent=
                Math.max(
                    0,
                    Math.min(
                        100,
                        u.hp
                    )
                );

            const className=
                u.eliminated?
                "dead":
                percent<30?
                "low":
                "";

            html+=`
                <div class="health-row">

                    <div class="health-label">
                        <span>
                            ${u.name}
                        </span>

                        <span>
                            ${percent}%
                        </span>
                    </div>

                    <div class="health-bar">

                        <div
                            class="health-fill ${className}"
                            style="width:${percent}%">
                        </div>

                    </div>

                </div>
            `;
        });

        html+=`</div>`;
    }

    panel.innerHTML=html;
}


/* =========================================================
   BATTLE LOG
   ========================================================= */

function addBattleText(html){

    const feed=
        document.getElementById("battleFeed");

    feed.insertAdjacentHTML(
        "beforeend",
        html
    );

    feed.scrollTop=
        feed.scrollHeight;
}


/* =========================================================
   END BATTLE
   ========================================================= */

function finishBattle(
    winningTeam,
    units,
    round
){

    battleRunning=false;

    const survivors=
        units.filter(
            u=>u.team===winningTeam&&!u.eliminated
        );

    const defeatedTeam=
        winningTeam===1?2:1;

    const defeated=
        units.filter(
            u=>u.team===defeatedTeam
        );

    const survivorNames=
        survivors.map(
            u=>u.name
        ).join(", ");

    addBattleText(`

        <div class="winner">

            <div class="winner-title">
                🏆 TEAM ${winningTeam===1?"ALPHA":"OMEGA"} WINS
            </div>

            <p>
                The battle concludes in Round ${round}.
                Every member of Team
                ${defeatedTeam===1?"Alpha":"Omega"}
                has been eliminated.
            </p>

            <p>
                The surviving combatants—
                <strong>${survivorNames}</strong>—
                remain standing as the dust settles across
                the battlefield.
            </p>

            <p>
                This is not a draw.
                The opposing team has been completely removed
                from the battle, leaving
                <strong>
                    Team ${winningTeam===1?"Alpha":"Omega"}
                </strong>
                as the definitive victor.
            </p>

        </div>
    `);

    document.getElementById("battleStatus").textContent=
        `TEAM ${winningTeam===1?"ALPHA":"OMEGA"} VICTORIOUS`;

    renderHealth(units);
}
