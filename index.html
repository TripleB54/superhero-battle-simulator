<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Character Battle</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #20263d 0%, #0b0d14 45%, #05060a 100%);
    color: white;
}

.container {
    width: min(1200px, 94%);
    margin: auto;
    padding: 25px 0 50px;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

header h1 {
    font-size: clamp(32px, 5vw, 60px);
    margin: 5px 0;
    letter-spacing: 2px;
}

header p {
    color: #aeb5c9;
    margin-top: 8px;
}

.panel {
    background: rgba(18, 21, 32, .92);
    border: 1px solid #343a50;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,.3);
}

button {
    border: 0;
    border-radius: 10px;
    padding: 13px 18px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
    font-size: 15px;
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(1.15);
}

.primary {
    background: #ffffff;
    color: #10131c;
}

.secondary {
    background: #292f42;
    color: white;
    border: 1px solid #464d65;
}

.danger {
    background: #7d2630;
    color: white;
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

.mode-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 15px;
}

.mode-buttons button.active {
    background: white;
    color: black;
}

.status {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin: 20px 0;
}

.selection-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
}

.character-card {
    background: linear-gradient(145deg, #202536, #121520);
    border: 1px solid #3b4259;
    border-radius: 14px;
    padding: 16px;
    cursor: pointer;
    min-height: 160px;
    transition: .2s;
}

.character-card:hover {
    transform: translateY(-4px);
    border-color: white;
}

.character-card h3 {
    margin: 0 0 7px;
    font-size: 19px;
}

.character-card .universe {
    color: #aeb5c9;
    font-size: 12px;
    margin-bottom: 10px;
}

.character-card .type {
    font-size: 12px;
    color: #d4d8e4;
}

.character-card .abilities {
    margin-top: 10px;
    color: #9299ad;
    font-size: 12px;
    line-height: 1.4;
}

.character-card.picked {
    opacity: .25;
    pointer-events: none;
    transform: scale(.97);
}

.teams {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.team {
    min-height: 180px;
    border-radius: 14px;
    padding: 18px;
    background: #11141e;
    border: 1px solid #353b50;
}

.team h2 {
    margin-top: 0;
}

.team1 h2 {
    color: #8fc7ff;
}

.team2 h2 {
    color: #ff9494;
}

.team-member {
    background: #202536;
    border-radius: 8px;
    padding: 9px 11px;
    margin: 7px 0;
}

.story-controls {
    text-align: center;
}

.story-box {
    line-height: 1.75;
    font-size: 17px;
    white-space: pre-wrap;
    background: #0d1018;
    border: 1px solid #30364a;
    border-radius: 14px;
    padding: 25px;
    min-height: 100px;
}

.hidden {
    display: none !important;
}

.one-character {
    text-align: center;
    padding: 35px;
}

.one-character h2 {
    font-size: 40px;
    margin: 10px 0;
}

.stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-top: 20px;
}

.stat {
    background: #191d2a;
    border-radius: 10px;
    padding: 12px;
}

.stat strong {
    display: block;
    color: #9da6bd;
    font-size: 11px;
    text-transform: uppercase;
    margin-bottom: 5px;
}

#battleMeta {
    color: #aeb5c9;
    text-align: center;
    margin-bottom: 15px;
}

@media (max-width: 700px) {
    .teams {
        grid-template-columns: 1fr;
    }

    .story-box {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>ULTIMATE CHARACTER BATTLE</h1>
    <p>Generate the fighters. Build the teams. Then let the battle begin.</p>
</header>

<!-- GENERATOR -->
<section class="panel">
    <div class="controls">
        <button class="primary" onclick="generateTen()">GENERATE 10</button>
        <button class="secondary" onclick="resetBattle()">RESET</button>
        <button class="secondary" onclick="showOneAtATime()">ONE-AT-A-TIME MODE</button>
    </div>

    <div class="status" id="status">
        Generate 10 characters to begin.
    </div>

    <div id="selectionGrid" class="selection-grid"></div>
</section>

<!-- TEAMS -->
<section class="panel">
    <div class="teams">

        <div class="team team1">
            <h2>TEAM 1</h2>
            <div id="team1"></div>
        </div>

        <div class="team team2">
            <h2>TEAM 2</h2>
            <div id="team2"></div>
        </div>

    </div>
</section>

<!-- STORY -->
<section class="panel">
    <div class="story-controls">

        <h2>BATTLE STORY</h2>

        <div id="battleMeta">
            Build both teams before starting the battle.
        </div>

        <div class="mode-buttons">
            <button class="secondary active" onclick="setStoryMode('quick', this)">
                QUICK
            </button>

            <button class="secondary" onclick="setStoryMode('detailed', this)">
                DETAILED
            </button>

            <button class="secondary" onclick="setStoryMode('cinematic', this)">
                CINEMATIC
            </button>
        </div>

        <br>

        <button class="primary" onclick="startBattle()">
            START BATTLE
        </button>

    </div>

    <br>

    <div id="storyBox" class="story-box">
        Your battle story will appear here.
    </div>
</section>

<!-- ONE AT A TIME -->
<section id="oneMode" class="panel hidden">

    <div class="one-character">
        <h2 id="singleName">?</h2>

        <div id="singleUniverse"></div>
        <div id="singleDescription"></div>

        <div class="stat-grid" id="singleStats"></div>

        <br>

        <button class="primary" onclick="generateOneCharacter()">
            GENERATE ONE
        </button>

        <button class="secondary" onclick="hideOneAtATime()">
            BACK TO TEAM MODE
        </button>
    </div>

</section>

</div>

/* ============================================================
   GAME STATE
   ============================================================ */

let generated = [];
let team1 = [];
let team2 = [];
let currentTeam = 1;
let storyMode = "quick";
let oneMode = false;


/* ============================================================
   RANDOM HELPERS
   ============================================================ */

function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
}

function randomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}


/* ============================================================
   GENERATE EXACTLY 10
   ============================================================ */

function generateTen() {

    team1 = [];
    team2 = [];
    currentTeam = 1;

    generated = shuffle(characters).slice(0, 10);

    renderSelection();
    renderTeams();

    document.getElementById("status").innerText =
        "TEAM 1 PICKS FIRST — choose one of the 10 characters.";

    document.getElementById("battleMeta").innerText =
        "Pick one character at a time. Teams alternate until all 10 are selected.";

    document.getElementById("storyBox").innerText =
        "Build both teams to begin the battle.";
}


/* ============================================================
   RENDER 10
   ============================================================ */

function renderSelection() {

    const grid = document.getElementById("selectionGrid");

    grid.innerHTML = "";

    generated.forEach((character, index) => {

        const card = document.createElement("div");

        card.className = "character-card";

        const alreadyPicked =
            team1.includes(character) ||
            team2.includes(character);

        if (alreadyPicked) {
            card.classList.add("picked");
        }

        card.innerHTML = `
            <h3>${character.name}</h3>
            <div class="universe">${character.universe} • ${character.type}</div>
            <div class="type">
                STR ${character.stats.strength}
                • SPD ${character.stats.speed}
                • DUR ${character.stats.durability}
            </div>
            <div class="abilities">
                ${character.abilities}
            </div>
        `;

        if (!alreadyPicked) {
            card.onclick = () => pickCharacter(index);
        }

        grid.appendChild(card);
    });
}


/* ============================================================
   ALTERNATING PICKS
   ============================================================ */

function pickCharacter(index) {

    const character = generated[index];

    if (!character) return;

    if (team1.includes(character) || team2.includes(character)) {
        return;
    }

    if (currentTeam === 1) {
        team1.push(character);
        currentTeam = 2;
    } else {
        team2.push(character);
        currentTeam = 1;
    }

    renderSelection();
    renderTeams();

    const remaining =
        generated.length - team1.length - team2.length;

    if (remaining === 0) {

        document.getElementById("status").innerText =
            "ALL 10 CHARACTERS HAVE BEEN PICKED.";

        document.getElementById("battleMeta").innerText =
            `Team 1: ${team1.length} fighters • Team 2: ${team2.length} fighters`;

    } else {

        document.getElementById("status").innerText =
            `TEAM ${currentTeam} PICKS — ${remaining} characters remaining.`;
    }
}


/* ============================================================
   TEAMS
   ============================================================ */

function renderTeams() {

    const t1 = document.getElementById("team1");
    const t2 = document.getElementById("team2");

    t1.innerHTML = "";
    t2.innerHTML = "";

    team1.forEach(character => {

        const div = document.createElement("div");

        div.className = "team-member";

        div.innerHTML = `
            <strong>${character.name}</strong><br>
            <small>${character.universe} — ${character.abilities}</small>
        `;

        t1.appendChild(div);
    });

    team2.forEach(character => {

        const div = document.createElement("div");

        div.className = "team-member";

        div.innerHTML = `
            <strong>${character.name}</strong><br>
            <small>${character.universe} — ${character.abilities}</small>
        `;

        t2.appendChild(div);
    });
}


/* ============================================================

   ============================================================ */

function setStoryMode(mode, button) {

    storyMode = mode;

    document
        .querySelectorAll(".mode-buttons button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");
}


/* ============================================================
   BATTLE ENGINE
   ============================================================ */

function startBattle() {

    if (team1.length === 0 || team2.length === 0) {

        document.getElementById("storyBox").innerText =
            "Both teams need at least one fighter before the battle can begin.";

        return;
    }

    const story = createBattleStory(team1, team2, storyMode);

    document.getElementById("storyBox").innerText = story;

    document.getElementById("battleMeta").innerText =
        `${storyMode.toUpperCase()} MODE • ${team1.length} vs ${team2.length}`;
}


/* ============================================================
   BATTLE WRITING ENGINE
   ============================================================ */

function createBattleStory(a, b, mode) {

    const all = [...a, ...b];

    const strongestA = [...a].sort(
        (x,y) => powerScore(y) - powerScore(x)
    )[0];

    const strongestB = [...b].sort(
        (x,y) => powerScore(y) - powerScore(x)
    )[0];

    const fastA = [...a].sort(
        (x,y) => y.stats.speed - x.stats.speed
    )[0];

    const fastB = [...b].sort(
        (x,y) => y.stats.speed - x.stats.speed
    )[0];

    const smartA = [...a].sort(
        (x,y) => y.stats.intelligence - x.stats.intelligence
    )[0];

    const smartB = [...b].sort(
        (x,y) => y.stats.intelligence - x.stats.intelligence
    )[0];

    const opening = openingParagraph(a,b);

    const clash = clashParagraph(
        strongestA,
        strongestB,
        fastA,
        fastB
    );

    const tactics = tacticalParagraph(
        smartA,
        smartB,
        a,
        b
    );

    const escalation = escalationParagraph(
        strongestA,
        strongestB,
        a,
        b
    );

    const turning = turningPointParagraph(
        a,
        b,
        strongestA,
        strongestB
    );

    const ending = endingParagraph(
        a,
        b,
        strongestA,
        strongestB
    );

    let paragraphs;

    if (mode === "quick") {

        paragraphs = [
            opening,
            clash,
            ending
        ];

        return fitWords(paragraphs.join(" "), 50, 100);

    }

    if (mode === "detailed") {

        paragraphs = [
            opening,
            clash,
            tactics,
            escalation,
            ending
        ];

        return fitWords(paragraphs.join("\n\n"), 150, 300);

    }

    paragraphs = [
        opening,
        clash,
        tactics,
        escalation,
        turning,
        ending
    ];

    return fitWords(paragraphs.join("\n\n"), 300, 450);
}


/* ============================================================
   STORY COMPONENTS
   ============================================================ */

function openingParagraph(a,b) {

    const firstA = randomItem(a);
    const firstB = randomItem(b);

    const environments = [
        "a shattered industrial district surrounded by abandoned towers",
        "a massive city block already scarred by previous battles",
        "a ruined battlefield beneath a sky filled with storm clouds",
        "an empty metropolis where the streets stretched for miles",
        "a vast canyon surrounded by broken stone and steel",
        "a deserted facility packed with narrow corridors and open chambers"
    ];

    const environment = randomItem(environments);

    return `The battlefield was ${environment}. ${firstA.name} moved first, cutting across the terrain as ${firstB.name} answered immediately. The rest of both teams spread out, reading the battlefield and looking for the first opening.`;
}


function clashParagraph(strongA,strongB,fastA,fastB) {

    const moves = [

        `${strongA.name} drove forward with overwhelming force, forcing ${strongB.name} to meet the attack head-on. The impact tore through the ground beneath them while ${fastA.name} and ${fastB.name} flashed through the battlefield at impossible speed.`,

        `${fastA.name} struck first, using speed to attack from an unexpected angle. ${fastB.name} intercepted the assault before it could land, and their collision sent a shockwave across the battlefield. Nearby, ${strongA.name} and ${strongB.name} crashed together with enough force to shake the surrounding structures.`,

        `${strongB.name} launched a devastating opening attack, but ${strongA.name} absorbed the pressure and countered immediately. The two powerhouses collided while ${fastA.name} and ${fastB.name} tore across the battlefield, forcing the other fighters to constantly reposition.`
    ];

    return randomItem(moves);
}


function tacticalParagraph(smartA,smartB,a,b) {

    const supportA = randomItem(a);
    const supportB = randomItem(b);

    const tactics = [

        `${smartA.name} quickly recognized that raw power would not decide the fight alone. A signal went through Team 1, changing their formation. ${supportA.name} drew attention while the rest of the team attacked from multiple angles. ${smartB.name} saw the maneuver coming and redirected Team 2, turning the trap into a counterattack.`,

        `${smartB.name} began exploiting the battlefield itself, forcing Team 1 away from the positions they wanted. ${supportB.name} pressured the weakest opening while ${smartA.name} adjusted the formation, preventing the attack from becoming a collapse.`,

        `The fight became increasingly tactical. ${smartA.name} targeted the opponent's strongest advantage while ${smartB.name} attempted to isolate key fighters. Powers began interacting in unexpected ways, with attacks being blocked, redirected, avoided, or turned against their original users.`
    ];

    return randomItem(tactics);
}


function escalationParagraph(strongA,strongB,a,b) {

    const options = [

        `The pace suddenly changed. ${strongA.name} stopped holding back and unleashed a much larger attack, forcing Team 2 to scatter. ${strongB.name} answered with an equally powerful counter, creating a violent exchange that left both sides struggling to regain control.`,

        `Neither side could maintain the advantage for long. One attack opened another weakness, which immediately created another counter. ${strongA.name} pushed through the pressure while ${strongB.name} escalated, turning the battle from a coordinated clash into a desperate struggle for momentum.`,

        `The battlefield could no longer contain the intensity. Energy, debris, shattered concrete, and displaced air filled the area as both teams committed to their strongest abilities. Every fighter was forced to react faster, because a single mistake could end the fight.`
    ];

    return randomItem(options);
}


function turningPointParagraph(a,b,strongA,strongB) {

    const winnerSide = teamPower(a) >= teamPower(b) ? 1 : 2;

    if (winnerSide === 1) {

        return `${strongA.name} finally found the opening the team had been creating. Instead of attacking directly, Team 1 synchronized their abilities, forcing Team 2 into a narrow defensive position. ${strongB.name} attempted to break through, but the combined assault shifted the momentum decisively.`;

    }

    return `${strongB.name} finally found the opening the team had been creating. Team 2 synchronized their attacks, forcing Team 1 into a narrow defensive position. ${strongA.name} attempted to break through, but the coordinated counterattack shifted the momentum decisively.`;
}


function endingParagraph(a,b,strongA,strongB) {

    const scoreA = teamPower(a);
    const scoreB = teamPower(b);

    let winner;
    let loser;
    let finalFighter;

    if (scoreA >= scoreB) {

        winner = "Team 1";
        loser = "Team 2";
        finalFighter = strongest(a);

    } else {

        winner = "Team 2";
        loser = "Team 1";
        finalFighter = strongest(b);
    }

    const endings = [

        `The final exchange came down to timing. ${finalFighter.name} found the decisive opening and committed everything to the attack. The opposing side was unable to recover, and the remaining fighters were forced out of the fight one by one. When the dust finally settled, ${winner} remained standing.`,

        `The last clash was brief but decisive. ${finalFighter.name} capitalized on the opening created by the rest of the team and delivered the finishing sequence before the opposition could regroup. The battlefield fell silent. ${winner} had won.`,

        `Both teams had pushed each other to their limits, but the difference was coordination. ${finalFighter.name} delivered the final decisive move as the rest of ${winner} maintained the pressure. ${loser} could no longer continue. The battle was over, and ${winner} stood victorious.`
    ];

    return randomItem(endings);
}


/* ============================================================
   POWER CALCULATIONS
   ============================================================ */

function powerScore(c) {

    return (
        c.stats.strength * 1.25 +
        c.stats.speed +
        c.stats.durability * 1.2 +
        c.stats.intelligence * .75 +
        c.stats.power * 1.35
    );
}


function teamPower(team) {

    let score = 0;

    team.forEach(c => {
        score += powerScore(c);
    });

    /* Team synergy bonus */

    const intelligence =
        team.reduce((sum,c) => sum + c.stats.intelligence, 0) /
        team.length;

    const power =
        team.reduce((sum,c) => sum + c.stats.power, 0) /
        team.length;

    score += intelligence * 8;
    score += power * 4;

    return score;
}


function strongest(team) {

    return [...team].sort(
        (a,b) => powerScore(b) - powerScore(a)
    )[0];
}


/* ============================================================
   WORD COUNT CONTROL
   ============================================================ */

function fitWords(text,min,max) {

    let words = text.split(/\s+/);

    if (words.length <= max && words.length >= min) {
        return text;
    }

    if (words.length > max) {
        words = words.slice(0,max);

        let result = words.join(" ");

        if (!/[.!?]$/.test(result)) {
            result += ".";
        }

        return result;
    }

    const additions = [
        "The battlefield shook beneath the continuing impact.",
        "Neither side was willing to surrender the advantage.",
        "Every fighter was forced to adapt as the situation changed.",
        "The pressure continued to build until the final exchange.",
        "What began as a direct confrontation had become a battle of timing, positioning, and power."
    ];

    while (words.length < min) {

        const addition = randomItem(additions);

        words = words.concat(addition.split(/\s+/));

        if (words.length > max) {
            words = words.slice(0,max);
        }
    }

    let result = words.join(" ");

    if (!/[.!?]$/.test(result)) {
        result += ".";
    }

    return result;
}


/* ============================================================
   ONE AT A TIME MODE
   ============================================================ */

function showOneAtATime() {

    oneMode = true;

    document
        .getElementById("oneMode")
        .classList.remove("hidden");

    generateOneCharacter();

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior:"smooth"
    });
}


function hideOneAtATime() {

    oneMode = false;

    document
        .getElementById("oneMode")
        .classList.add("hidden");
}


function generateOneCharacter() {

    const character = randomItem(characters);

    document.getElementById("singleName").innerText =
        character.name;

    document.getElementById("singleUniverse").innerText =
        `${character.universe} • ${character.type}`;

    document.getElementById("singleDescription").innerText =
        character.abilities;

    const stats = document.getElementById("singleStats");

    stats.innerHTML = "";

    Object.entries(character.stats).forEach(([key,value]) => {

        const div = document.createElement("div");

        div.className = "stat";

        div.innerHTML = `
            <strong>${key}</strong>
            ${value}
        `;

        stats.appendChild(div);
    });
}
