<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Superhero Battle Simulator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top, #17283a 0%, #080d13 45%, #020305 100%);
    color: #eaf6ff;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    text-align: center;
    padding: 30px 15px;
    background: linear-gradient(#111d2a, #070b10);
    border-bottom: 1px solid #29445c;
    box-shadow: 0 0 25px #000;
}

header h1 {
    margin: 0;
    font-size: 38px;
    letter-spacing: 2px;
}

header p {
    color: #91a9bd;
}

button {
    border: 1px solid #3d6b88;
    border-radius: 8px;
    padding: 13px 22px;
    background: linear-gradient(#173b54, #0b1d2c);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: linear-gradient(#225878, #103049);
    box-shadow: 0 0 15px rgba(50,190,255,.3);
}

.primary {
    background: linear-gradient(#009bd8, #005b82);
    border-color: #4ad5ff;
}

.settings {
    text-align: center;
    margin: 20px;
}

select {
    background: #0b131c;
    color: white;
    border: 1px solid #395066;
    padding: 9px 14px;
    border-radius: 6px;
}

/* TEAMS */

.teams {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.team {
    background: linear-gradient(145deg,#111d29,#070c12);
    border: 1px solid #294257;
    border-radius: 14px;
    padding: 20px;
    min-height: 280px;
}

.team h2 {
    text-align: center;
}

.team1-title {
    color: #38adff;
}

.team2-title {
    color: #ff566a;
}

.character {
    padding: 11px;
    margin: 8px 0;
    background: #182633;
    border: 1px solid #2b4357;
    border-radius: 7px;
    font-weight: bold;
}

/* BATTLE HUD */

#battleHUD {
    max-width: 1100px;
    margin: 25px auto;
    padding: 20px;
    background: linear-gradient(145deg,#101b26,#060a0f);
    border: 1px solid #2b465b;
    border-radius: 14px;
    box-shadow: 0 10px 35px #000;
}

.hidden {
    display: none !important;
}

.hud-top {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    text-align: center;
    border-bottom: 1px solid #263c4e;
    padding-bottom: 15px;
}

.hud-team1 {
    color: #35aaff;
}

.hud-team2 {
    color: #ff596d;
}

.round-number {
    color: #48d8ff;
    font-size: 24px;
    font-weight: bold;
}

.health-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    margin-top: 20px;
}

.health-column {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.health-card {
    background: #091119;
    border: 1px solid #263b4d;
    border-radius: 8px;
    padding: 10px;
}

.health-card.dead {
    opacity: .4;
    filter: grayscale(1);
}

.health-name {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 7px;
}

.hp-number {
    color: #8ea6ba;
}

.hp-bar {
    height: 14px;
    background: #020407;
    border: 1px solid #263a4c;
    border-radius: 20px;
    overflow: hidden;
}

.hp-fill {
    height: 100%;
    width: 100%;
    background: #20d77a;
    transition: width .6s ease;
}

.hp-fill.medium {
    background: #e8b52e;
}

.hp-fill.low {
    background: #e23a4d;
}

.dead-label {
    margin-top: 5px;
    color: #ff5063;
    font-size: 10px;
    font-weight: bold;
}

/* STORY */

#battle {
    max-width: 1100px;
    margin: 25px auto;
    padding: 25px;
    background: linear-gradient(145deg,#101923,#060a0f);
    border: 1px solid #2a4154;
    border-radius: 14px;
    box-shadow: 0 10px 35px #000;
}

.story-round {
    margin: 15px 0;
    padding: 18px;
    background: #0b141d;
    border: 1px solid #263d50;
    border-radius: 9px;
    text-align: left;
    line-height: 1.75;
}

.story-title {
    color: #46d8ff;
    font-weight: bold;
    border-bottom: 1px solid #263a4c;
    padding-bottom: 8px;
    margin-bottom: 12px;
}

.elimination {
    color: #ff5368;
    font-weight: bold;
}

.next-container {
    text-align: center;
    margin-top: 25px;
}

.next-button {
    font-size: 18px;
    padding: 16px 40px;
}

.winner {
    margin-top: 25px;
    padding: 25px;
    text-align: center;
    border: 1px solid #8b7130;
    border-radius: 10px;
    background: #211b0b;
    color: #ffd966;
    font-size: 30px;
    font-weight: bold;
}

.winner-info {
    color: #d7e1e8;
    font-size: 15px;
    margin-top: 12px;
    font-weight: normal;
}

@media(max-width:750px) {
    .teams,
    .health-grid {
        grid-template-columns: 1fr;
    }

    .hud-top {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    header h1 {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<header>
    <h1>⚔️ SUPERHERO BATTLE SIMULATOR ⚔️</h1>
    <p>Build your teams and control the battle round by round.</p>
</header>

<div class="settings">

    <label>
        Battle Depth:
    </label>

    <select id="battleDepth">
        <option value="short">Short</option>
        <option value="medium" selected>Medium</option>
        <option value="long">Long</option>
    </select>

</div>

<!-- TEAMS -->

<div class="teams">

    <div class="team">

        <h2 class="team1-title">
            🔵 TEAM 1
        </h2>

        <div id="team1"></div>

        <button onclick="addCharacter(1)">
            🎲 Add Character
        </button>

    </div>

    <div class="team">

        <h2 class="team2-title">
            🔴 TEAM 2
        </h2>

        <div id="team2"></div>

        <button onclick="addCharacter(2)">
            🎲 Add Character
        </button>

    </div>

</div>

<div style="text-align:center;">

    <button class="primary" onclick="startBattle()">
        ⚔️ START BATTLE
    </button>

</div>

<!-- BATTLE HEALTH HUD -->

<div id="battleHUD" class="hidden">

    <div class="hud-top">

        <div>
            <h2 class="hud-team1">🔵 TEAM 1</h2>
        </div>

        <div id="roundNumber" class="round-number">
            ROUND 1
        </div>

        <div>
            <h2 class="hud-team2">🔴 TEAM 2</h2>
        </div>

    </div>

    <div class="health-grid">

        <div id="healthTeam1" class="health-column"></div>

        <div id="healthTeam2" class="health-column"></div>

    </div>

</div>

<!-- STORY -->

<div id="battle">

    <h2>Battle Console</h2>

    <p>
        Build both teams and press START BATTLE.
    </p>

</div>

<script>

/* =========================================================
   CHARACTER POOL — 60
========================================================= */

const characters = [

    "Spider-Man",
    "Miles Morales",
    "Captain Marvel",
    "Jean Grey",
    "Wolverine",
    "Hulk",
    "Thor",
    "Iron Man",
    "Doctor Doom",
    "Magneto",
    "Storm",
    "Deadpool",
    "Kingpin",
    "Groot",
    "Gamora",
    "Hela",
    "Mephisto",
    "Cyclops",
    "Quicksilver",
    "Invisible Woman",
    "Kraven",
    "Ghost Rider",
    "MODOK",
    "Psylocke",
    "Rocket Raccoon",
    "Punisher",
    "Killmonger",
    "Ant-Man",
    "Peni Parker",
    "Mister Sinister",

    "Batman",
    "Superman",
    "Wonder Woman",
    "The Flash",
    "Green Lantern",
    "Aquaman",
    "Cyborg",
    "Green Arrow",
    "Black Canary",
    "Nightwing",
    "Raven",
    "Starfire",
    "Martian Manhunter",
    "Shazam",
    "Black Adam",
    "Darkseid",
    "Lex Luthor",
    "Deathstroke",
    "Harley Quinn",
    "Joker",
    "Bane",
    "Poison Ivy",
    "Catwoman",
    "Doomsday",
    "Blue Beetle",
    "Zatanna",
    "Constantine",
    "Swamp Thing",
    "Supergirl",
    "Red Hood"

];


/* =========================================================
   MOVE LIST
========================================================= */

const moves = {

    "Spider-Man": ["Web Strike","Web Barrage","Web Swing Kick","Spider-Sense Counter"],
    "Miles Morales": ["Venom Strike","Venom Blast","Camouflage Strike","Bio-Electric Punch"],
    "Captain Marvel": ["Photon Blast","Binary Strike","Cosmic Punch","Energy Burst"],
    "Jean Grey": ["Telekinetic Crush","Psychic Assault","Psychic Shockwave","Telekinetic Shield"],
    "Wolverine": ["Adamantium Slash","Berserker Charge","Claw Strike","Savage Counter"],
    "Hulk": ["Hulk Smash","Thunderclap","Ground Pound","Gamma Charge"],
    "Thor": ["Mjolnir Strike","Lightning Bolt","Thunderclap","Stormbreaker Slam"],
    "Iron Man": ["Repulsor Blast","Unibeam","Missile Barrage","Armor-Assisted Strike"],
    "Doctor Doom": ["Doom Beam","Mystic Blast","Force Field Counter","Doombot Assault"],
    "Magneto": ["Magnetic Crush","Metal Storm","Electromagnetic Pulse","Magnetic Shield"],
    "Storm": ["Lightning Strike","Cyclone","Wind Blast","Thunderstorm"],
    "Deadpool": ["Twin Blade Assault","Gunfire Burst","Acrobatic Strike","Regeneration Counter"],

    "Batman": ["Batarang Barrage","Grapnel Strike","Smoke Counter","Martial Arts Combination"],
    "Superman": ["Heat Vision","Super Punch","Flying Charge","Freeze Breath"],
    "Wonder Woman": ["Lasso Strike","Amazonian Combination","Bracelet Counter","Sword Strike"],
    "The Flash": ["Speed Blitz","Lightning Punch","Phasing Strike","Speed Force Barrage"],
    "Green Lantern": ["Energy Construct","Power Ring Blast","Construct Hammer","Energy Shield"],
    "Aquaman": ["Trident Strike","Atlantean Charge","Tidal Blast","Trident Throw"],
    "Cyborg": ["Sonic Cannon","Arm Cannon Blast","Cybernetic Charge","Tech Override"],
    "Green Arrow": ["Explosive Arrow","Trick Arrow","Rapid Arrow Shot","Grappling Arrow"],
    "Black Canary": ["Canary Cry","Sonic Burst","Martial Arts Strike","Sonic Counter"],
    "Nightwing": ["Escrima Strike","Acrobatic Assault","Electric Kali Strike","Aerial Kick"],
    "Raven": ["Soul-Self Strike","Dark Energy Blast","Telekinetic Attack","Shadow Bind"],
    "Starfire": ["Starbolt","Energy Burst","Flying Strike","Solar Blast"],
    "Martian Manhunter": ["Telepathic Assault","Martian Strength Strike","Phasing Attack","Telekinetic Blast"],
    "Shazam": ["Lightning Strike","Magic Punch","Flying Charge","Thunderclap"],
    "Black Adam": ["Lightning Blast","Adam Force Punch","Superhuman Charge","Electrical Burst"],
    "Darkseid": ["Omega Beam","Darkseid Strike","Omega Blast","Apokoliptian Assault"],
    "Lex Luthor": ["Kryptonite Blast","Power Suit Punch","Energy Cannon","Armor Missile Barrage"],
    "Deathstroke": ["Sword Combination","Staff Strike","Explosive Charge","Tactical Counter"],
    "Harley Quinn": ["Hammer Strike","Acrobat Assault","Explosive Attack","Baseball Bat Swing"],
    "Joker": ["Explosive Trick","Electric Hand Buzzer","Joker Gas","Chaos Strike"],
    "Bane": ["Venom Punch","Power Slam","Brutal Charge","Ground Strike"],
    "Poison Ivy": ["Vine Lash","Plant Bind","Toxic Pollen","Vine Crush"],
    "Catwoman": ["Whip Strike","Acrobatic Kick","Claw Swipe","Cat-Like Counter"],
    "Doomsday": ["Doomsday Smash","Ground Shockwave","Brutal Charge","Monster Strike"],
    "Blue Beetle": ["Scarabean Cannon","Energy Blade","Armor Charge","Energy Shield"],
    "Zatanna": ["Mystic Blast","Magical Binding","Reality Spell","Arcane Shield"],
    "Constantine": ["Mystic Ward","Occult Binding","Demonic Counter","Arcane Blast"],
    "Swamp Thing": ["Vine Assault","Plant Surge","Swamp Crush","Green Regeneration"],
    "Supergirl": ["Heat Vision","Super Punch","Kryptonian Charge","Freeze Breath"],
    "Red Hood": ["Dual Pistol Burst","Explosive Round","Helmet Strike","Tactical Counter"]

};


/* =========================================================
   TEAM VARIABLES
========================================================= */

let team1 = [];
let team2 = [];


/* =========================================================
   ADD CHARACTER
========================================================= */

function addCharacter(team) {

    const target = team === 1 ? team1 : team2;

    if (target.length >= 5) {

        alert("Each team can have a maximum of 5 characters.");

        return;
    }

    const used = [...team1, ...team2];

    const available =
        characters.filter(name => !used.includes(name));

    if (available.length === 0) {

        alert("There are no characters remaining.");

        return;
    }

    const name =
        available[Math.floor(Math.random() * available.length)];

    target.push(name);

    displayTeams();
}


/* =========================================================
   DISPLAY TEAMS
========================================================= */

function displayTeams() {

    const t1 = document.getElementById("team1");
    const t2 = document.getElementById("team2");

    t1.innerHTML = "";
    t2.innerHTML = "";

    team1.forEach((name,index) => {

        const div = document.createElement("div");

        div.className = "character";

        div.textContent =
            `${index + 1}. ${name}`;

        t1.appendChild(div);

    });

    team2.forEach((name,index) => {

        const div = document.createElement("div");

        div.className = "character";

        div.textContent =
            `${index + 1}. ${name}`;

        t2.appendChild(div);

    });

}


/* =========================================================
   BATTLE STATE
========================================================= */

let battle = null;


/* =========================================================
   START BATTLE
========================================================= */

function startBattle() {

    if (
        team1.length === 0 ||
        team2.length === 0
    ) {

        alert("Both teams need at least one character.");

        return;
    }


    battle = {

        round: 1,

        team1: team1.map(name => ({

            name: name,

            hp: 100,

            alive: true

        })),

        team2: team2.map(name => ({

            name: name,

            hp: 100,

            alive: true

        })),

        finished: false

    };


    document
        .getElementById("battleHUD")
        .classList
        .remove("hidden");


    renderHealth();


    document.getElementById("battle").innerHTML = `

        <h2>⚔️ BATTLE READY</h2>

        <p>
            The two teams take their positions across the
            battlefield. Every combatant begins at full
            strength.
        </p>

        <p>
            <strong>
                The battle will now proceed one round at a time.
            </strong>
        </p>

        <div class="next-container">

            <button
                class="primary next-button"
                onclick="simulateRound()"
            >
                ▶ SIMULATE ROUND 1
            </button>

        </div>

    `;

}


/* =========================================================
   HEALTH BAR
========================================================= */

function renderHealth() {

    const t1 =
        document.getElementById("healthTeam1");

    const t2 =
        document.getElementById("healthTeam2");


    t1.innerHTML = "";

    t2.innerHTML = "";


    battle.team1.forEach(fighter => {

        t1.appendChild(
            makeHealthCard(fighter)
        );

    });


    battle.team2.forEach(fighter => {

        t2.appendChild(
            makeHealthCard(fighter)
        );

    });


    document.getElementById(
        "roundNumber"
    ).textContent =
        battle.finished
            ? "BATTLE OVER"
            : `ROUND ${battle.round}`;

}


/* =========================================================
   HEALTH CARD
========================================================= */

function makeHealthCard(fighter) {

    const card =
        document.createElement("div");

    card.className = "health-card";


    if (!fighter.alive) {

        card.classList.add("dead");

    }


    let barClass = "";

    if (fighter.hp <= 25) {

        barClass = "low";

    } else if (fighter.hp <= 50) {

        barClass = "medium";

    }


    card.innerHTML = `

        <div class="health-name">

            <span>
                ${fighter.name}
            </span>

            <span class="hp-number">
                ${fighter.hp} HP
            </span>

        </div>

        <div class="hp-bar">

            <div
                class="hp-fill ${barClass}"
                style="width:${fighter.hp}%"
            ></div>

        </div>

        ${
            !fighter.alive
                ?
            `
                <div class="dead-label">
                    ☠ ELIMINATED
                </div>
            `
                :
            ""
        }

    `;


    return card;

}


/* =========================================================
   RANDOM HELPERS
========================================================= */

function random(array) {

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}


function living(team) {

    return team.filter(
        fighter => fighter.alive
    );

}


/* =========================================================
   DAMAGE
========================================================= */

function calculateDamage(attacker) {

    let damage =
        Math.floor(
            Math.random() * 16
        ) + 10;


    /*
       Stronger characters occasionally
       produce heavier attacks.
    */

    const name = attacker.name;


    const heavyCharacters = [

        "Hulk",
        "Thor",
        "Superman",
        "Wonder Woman",
        "Captain Marvel",
        "Darkseid",
        "Doomsday",
        "Black Adam",
        "Shazam",
        "Jean Grey",
        "Doctor Doom"

    ];


    if (
        heavyCharacters.includes(name)
    ) {

        damage +=
            Math.floor(
                Math.random() * 10
            );

    }


    return damage;

}


/* =========================================================
   MOVE
========================================================= */

function getMove(name) {

    if (!moves[name]) {

        return "a devastating attack";

    }

    return random(moves[name]);

}


/* =========================================================
   SIMULATE ONE ROUND
========================================================= */

function simulateRound() {

    if (!battle || battle.finished) {

        return;

    }


    const round =
        battle.round;


    let story = `

        <h2>⚔️ ROUND ${round}</h2>

    `;


    let living1 = living(battle.team1);

    let living2 = living(battle.team2);


    if (
        living1.length === 0 ||
        living2.length === 0
    ) {

        endBattle();

        return;

    }


    /* TEAM 1 ATTACK */

    const attacker1 =
        random(living1);


    const target1 =
        random(living2);


    const move1 =
        getMove(attacker1.name);


    const damage1 =
        calculateDamage(attacker1);


    target1.hp =
        Math.max(
            0,
            target1.hp - damage1
        );


    story += `

        <div class="story-round">

            <div class="story-title">
                🔵 TEAM 1 — ATTACK
            </div>

            <p>
                <strong>${attacker1.name}</strong>
                breaks from the formation and advances
                toward
                <strong>${target1.name}</strong>.
                Rather than waste the opening with a reckless
                strike, the attacker waits for the precise
                moment when the defender's guard begins to
                shift.
            </p>

            <p>
                The opportunity finally appears.
                ${attacker1.name} commits to
                <strong>${move1}</strong>,
                driving the attack directly toward
                ${target1.name}.
                The impact forces the defender backward and
                deals <strong>${damage1} damage</strong>.
            </p>

    `;


    if (target1.hp <= 0) {

        target1.alive = false;

        story += `

            <p class="elimination">

                ☠ ${target1.name} has been eliminated.

            </p>

        `;

    } else {

        story += `

            <p>
                ${target1.name} manages to remain in the
                fight, although the attack leaves them with
                <strong>${target1.hp} HP</strong>.
            </p>

        `;

    }


    story += `</div>`;


    /* CHECK TEAM 2 */

    if (
        living(battle.team2).length === 0
    ) {

        battle.finished = true;

        renderHealth();

        story += winnerScreen(
            "TEAM 1"
        );

        document.getElementById("battle").innerHTML =
            story;

        return;

    }


    /* TEAM 2 ATTACK */

    living1 = living(battle.team1);

    living2 = living(battle.team2);


    const attacker2 =
        random(living2);


    const target2 =
        random(living1);


    const move2 =
        getMove(attacker2.name);


    const damage2 =
        calculateDamage(attacker2);


    target2.hp =
        Math.max(
            0,
            target2.hp - damage2
        );


    story += `

        <div class="story-round">

            <div class="story-title">
                🔴 TEAM 2 — COUNTERATTACK
            </div>

            <p>
                Team 2 responds before its opponent can fully
                recover.
                <strong>${attacker2.name}</strong>
                shifts position and identifies
                <strong>${target2.name}</strong>
                as the next opening.
            </p>

            <p>
                Without hesitation,
                ${attacker2.name} executes
                <strong>${move2}</strong>.
                The attack catches ${target2.name}
                during the transition and inflicts
                <strong>${damage2} damage</strong>.
            </p>

    `;


    if (target2.hp <= 0) {

        target2.alive = false;

        story += `

            <p class="elimination">

                ☠ ${target2.name} has been eliminated.

            </p>

        `;

    } else {

        story += `

            <p>
                ${target2.name} absorbs the attack and
                manages to stay upright with
                <strong>${target2.hp} HP</strong>
                remaining.
            </p>

        `;

    }


    story += `</div>`;


    /* UPDATE HEALTH BARS */

    renderHealth();


    /* CHECK WINNER */

    const team1Alive =
        living(battle.team1).length > 0;


    const team2Alive =
        living(battle.team2).length > 0;


    if (!team1Alive) {

        battle.finished = true;

        story += winnerScreen("TEAM 2");

        document.getElementById("battle").innerHTML =
            story;

        renderHealth();

        return;

    }


    if (!team2Alive) {

        battle.finished = true;

        story += winnerScreen("TEAM 1");

        document.getElementById("battle").innerHTML =
            story;

        renderHealth();

        return;

    }


    /* PAUSE */

    battle.round++;


    story += `

        <div class="story-round">

            <div class="story-title">
                ROUND ${round} COMPLETE
            </div>

            <p>
                The exchange finally breaks apart.
                Both sides create distance, taking a moment
                to reassess the battlefield and the condition
                of their remaining fighters.
            </p>

            <p>
                <strong>
                    The battle is paused.
                </strong>
                The updated health bars above show the exact
                condition of every combatant.
            </p>

        </div>

        <div class="next-container">

            <button
                class="primary next-button"
                onclick="simulateRound()"
            >
                ▶ NEXT ROUND
            </button>

        </div>

    `;


    document.getElementById("battle").innerHTML =
        story;

}


/* =========================================================
   WINNER
========================================================= */

function winnerScreen(teamName) {

    const winningTeam =
        teamName === "TEAM 1"
            ? battle.team1
            : battle.team2;


    const survivors =
        winningTeam
            .filter(fighter => fighter.alive)
            .map(
                fighter =>
                    `${fighter.name} — ${fighter.hp} HP`
            )
            .join("<br>");


    return `

        <div class="winner">

            🏆 ${teamName} WINS

            <div class="winner-info">

                The opposing team has been completely
                eliminated from the battlefield.

                <br><br>

                <strong>Survivors</strong>

                <br><br>

                ${survivors}

            </div>

        </div>

    `;

}


/* =========================================================
   END BATTLE
========================================================= */

function endBattle() {

    const team1Alive =
        living(battle.team1);


    const winner =
        team1Alive.length > 0
            ? "TEAM 1"
            : "TEAM 2";


    battle.finished = true;


    renderHealth();


    document.getElementById("battle").innerHTML =
        winnerScreen(winner);

}

</script>
