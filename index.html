<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STARK // BATTLE COMMAND</title>

<style>

:root{
    --cyan:#00eaff;
    --red:#ff4055;
    --purple:#b56cff;
    --gold:#ffc83d;
    --green:#4dff9a;
    --bg:#020609;
    --panel:#07131b;
    --line:#16485a;
    --text:#dffaff;
    --muted:#6c8792;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:
        radial-gradient(circle at 50% 10%,rgba(0,234,255,.1),transparent 32%),
        #020609;
    color:var(--text);
    font-family:Arial,sans-serif;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.04;

    background-image:
        linear-gradient(rgba(0,234,255,.7) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,234,255,.7) 1px,transparent 1px);

    background-size:40px 40px;
}

header{
    min-height:72px;
    border-bottom:1px solid #11627a;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 28px;
    background:#02090d;
}

.brand{
    font-weight:900;
    letter-spacing:5px;
    font-size:20px;
}

.brand span{
    color:var(--cyan);
}

.online{
    color:var(--green);
    font-size:9px;
    letter-spacing:2px;
}

main{
    width:min(1550px,95%);
    margin:auto;
    padding:26px 0 60px;
}

.title{
    text-align:center;
    margin-bottom:18px;
}

.title small{
    color:var(--muted);
    letter-spacing:4px;
    font-size:8px;
}

.title h1{
    letter-spacing:6px;
    font-size:26px;
}

button{
    background:#06131b;
    color:white;
    border:1px solid #1a596c;
    padding:12px 16px;
    font-weight:bold;
    letter-spacing:1.5px;
    cursor:pointer;
}

button:hover{
    border-color:var(--cyan);
    color:var(--cyan);
}

button:disabled{
    opacity:.3;
    cursor:not-allowed;
}

.primary{
    background:linear-gradient(90deg,#063949,#061821);
}

.gold{
    border-color:#7d6425;
}

.red{
    border-color:#74303a;
}

.purple{
    border-color:#6c3b92;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}

.tab{
    flex:1;
}

.tab.active{
    border-color:var(--cyan);
    color:var(--cyan);
}

.panel{
    background:linear-gradient(135deg,#07161f,#02080c);
    border:1px solid var(--line);
    padding:16px;
    margin-bottom:12px;
    position:relative;
}

.panel::before{
    content:"";
    position:absolute;
    left:-1px;
    top:-1px;
    width:18px;
    height:18px;
    border-left:2px solid var(--cyan);
    border-top:2px solid var(--cyan);
}

.heading{
    display:flex;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid #153b49;
    padding-bottom:10px;
    margin-bottom:12px;
}

.heading h2{
    margin:0;
    font-size:11px;
    letter-spacing:3px;
}

.code{
    color:var(--gold);
    font-size:8px;
    letter-spacing:2px;
}

.controls{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.control{
    background:#02090d;
    border:1px solid #153743;
    padding:10px;
}

.control label{
    display:block;
    font-size:8px;
    color:var(--muted);
    letter-spacing:2px;
    margin-bottom:7px;
}

.control select,
.control input{
    width:100%;
    background:#02080c;
    color:var(--cyan);
    border:1px solid #1a5365;
    padding:9px;
}

.tiers{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.tier{
    display:flex!important;
    align-items:center;
    gap:6px;
    margin:0!important;
    color:#b8d1d9!important;
}

.tier input{
    width:auto!important;
}

.actions{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    gap:8px;
    margin-top:10px;
}

.status{
    padding:10px;
    text-align:center;
    background:#02080c;
    border:1px solid #153743;
    color:var(--gold);
    font-size:9px;
    letter-spacing:2px;
    margin-bottom:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.card{
    background:linear-gradient(135deg,#0a1b24,#03090d);
    border:1px solid #183d4a;
    padding:10px;
    min-height:100px;
    cursor:pointer;
    transition:.15s;
}

.card:hover{
    border-color:var(--accent,var(--cyan));
    transform:translateY(-2px);
}

.name{
    font-weight:bold;
    font-size:11px;
}

.meta{
    font-size:8px;
    color:var(--muted);
    margin-top:5px;
}

.badge{
    font-size:7px;
    color:var(--gold);
    margin-top:7px;
    letter-spacing:1px;
}

.emblem{
    width:34px;
    height:34px;
    border-radius:50%;
    display:grid;
    place-items:center;
    border:1px solid var(--accent,var(--cyan));
    color:var(--accent,var(--cyan));
    margin-bottom:8px;
}

.teams{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.teams.two{
    grid-template-columns:repeat(2,1fr);
}

.alpha{
    border-color:#17647b;
}

.omega{
    border-color:#6b2a35;
}

.sigma{
    border-color:#613980;
}

.alpha h2{
    color:var(--cyan);
}

.omega h2{
    color:var(--red);
}

.sigma h2{
    color:var(--purple);
}

.slots{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.slot{
    min-height:125px;
    border:1px dashed #1b3a46;
    background:#02080c;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8px;
}

.slot.filled{
    border-style:solid;
    border-color:var(--accent,var(--cyan));
}

.slot .emblem{
    margin:0 auto 7px;
}

.slotname{
    font-size:9px;
    font-weight:bold;
}

.slotver{
    font-size:7px;
    color:var(--gold);
    margin-top:4px;
}

.remove-btn{
    margin-top:8px;
    padding:6px 8px;
    font-size:7px;
    width:100%;
    border-color:#67313a;
    color:#ff8793;
}

#battleOutput{
    display:none;
}

.versus{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:10px;
}

.versus.two{
    grid-template-columns:1fr 1fr;
}

.readout{
    background:#02080c;
    border:1px solid #153743;
    padding:12px;
}

.readout small{
    display:block;
    color:var(--muted);
    font-size:8px;
}

.readout strong{
    display:block;
    margin-top:4px;
}

.round{
    margin:12px 0;
    padding:17px;
    border-left:2px solid var(--cyan);
    background:linear-gradient(90deg,#081b24,#030a0e);
}

.roundtitle{
    color:var(--gold);
    font-size:9px;
    font-weight:bold;
    letter-spacing:3px;
    margin-bottom:10px;
}

.story{
    font:14px/1.8 Georgia,serif;
    color:#c9dbe0;
}

.story p{
    margin:0 0 14px;
}

.health{
    margin:10px 0;
    padding:12px;
    background:#02080c;
    border:1px solid #143542;
}

.healthtitle{
    color:var(--gold);
    font-size:8px;
    letter-spacing:2px;
    margin-bottom:8px;
}

.healthcols{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.healthcols.two{
    grid-template-columns:repeat(2,1fr);
}

.hteam{
    font-size:8px;
    margin-bottom:8px;
    letter-spacing:2px;
}

.hrow{
    margin-bottom:7px;
}

.hlabel{
    display:flex;
    justify-content:space-between;
    font-size:8px;
    color:#9db4be;
}

.track{
    height:6px;
    background:#10212a;
    margin-top:3px;
}

.fill{
    height:100%;
    background:var(--green);
}

.fill.mid{
    background:var(--gold);
}

.fill.low{
    background:var(--red);
}

.winner{
    padding:24px;
    text-align:center;
    border:1px solid var(--gold);
    color:var(--gold);
    letter-spacing:3px;
    margin-top:15px;
}

.hidden{
    display:none!important;
}

.dbtools{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:8px;
    margin-bottom:10px;
}

.dbtools input,
.dbtools select{
    background:#02080c;
    border:1px solid #1a5365;
    color:var(--cyan);
    padding:10px;
}

.profiles{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.profile{
    background:#02080c;
    border:1px solid #183d4a;
    padding:12px;
}

.profile h3{
    margin:0;
}

.profile p{
    font-size:9px;
    color:#b7cbd2;
    line-height:1.5;
}

.profile strong{
    color:var(--gold);
}

/* =========================================================
   MODALS
========================================================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:500;
    background:rgba(0,4,7,.95);
    place-items:center;
    padding:20px;
}

.modal-box{
    width:min(580px,96vw);
    background:#041018;
    border:1px solid var(--cyan);
    padding:24px;
    text-align:center;
}

#wheel{
    width:280px;
    height:280px;
    margin:12px auto;
    border-radius:50%;
    border:7px solid #173742;

    background:
        conic-gradient(
            #0b7187 0 45deg,
            #85692e 45deg 90deg,
            #8c3441 90deg 135deg,
            #326b83 135deg 180deg,
            #684986 180deg 225deg,
            #3a7c56 225deg 270deg,
            #916b38 270deg 315deg,
            #315c91 315deg 360deg
        );

    transition:transform 3s cubic-bezier(.1,.8,.15,1);
}

.selector-display{
    width:300px;
    height:300px;
    margin:15px auto;
    position:relative;
}

.selector-center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:95px;
    height:95px;
    border-radius:50%;
    display:grid;
    place-items:center;
    border:2px solid var(--gold);
    color:var(--gold);
    font-size:11px;
    letter-spacing:2px;
}

.selector-option{
    position:absolute;
    width:100px;
    min-height:55px;
    display:grid;
    place-items:center;
    padding:8px;
    border:1px solid #36525d;
    background:#041018;
    font-size:9px;
    letter-spacing:1px;
}

.selector-option.active{
    border-color:var(--gold);
    color:var(--gold);
    transform:scale(1.08);
}

.sel-alpha{
    left:100px;
    top:0;
}

.sel-omega{
    left:0;
    bottom:20px;
}

.sel-sigma{
    right:0;
    bottom:20px;
}

.two-player-selector .sel-sigma{
    display:none;
}

.two-player-selector .sel-alpha{
    left:15px;
    top:120px;
}

.two-player-selector .sel-omega{
    left:auto;
    right:15px;
    top:120px;
    bottom:auto;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px){

    .controls{
        grid-template-columns:repeat(2,1fr);
    }

    .grid{
        grid-template-columns:repeat(3,1fr);
    }

    .teams,
    .healthcols{
        grid-template-columns:1fr!important;
    }

}

@media(max-width:700px){

    .controls,
    .actions,
    .grid,
    .profiles,
    .dbtools,
    .versus{
        grid-template-columns:1fr!important;
    }

    .slots{
        grid-template-columns:repeat(2,1fr);
    }

    .online{
        display:none;
    }

}

</style>
</head>

<body>

<header>

<div class="brand">
STARK <span>//</span> BATTLE COMMAND
</div>

<div class="online">
JARVIS BATTLE ENGINE ONLINE
</div>

</header>

<main>

<div class="title">

<small>
STARK INDUSTRIES // COMBAT SIMULATION SYSTEM
</small>

<h1>
SUPERHERO BATTLE COMMAND
</h1>

</div>

<div class="tabs">

<button
id="battleTab"
class="tab active"
onclick="switchPage('battle')">
BATTLE COMMAND
</button>

<button
id="databaseTab"
class="tab"
onclick="switchPage('database')">
CHARACTER DATABASE
</button>

</div>

<section id="battlePage">

<!-- =====================================================
     SETTINGS
===================================================== -->

<div class="panel">

<div class="heading">

<h2>
SIMULATION PARAMETERS
</h2>

<span class="code">
SYS // 001
</span>

</div>

<div class="controls">

<div class="control">

<label>
PLAYERS
</label>

<select id="playerCount" onchange="playerCountChanged()">

<option value="2">
2 PLAYERS
</option>

<option value="3">
3 PLAYERS
</option>

</select>

</div>

<div class="control">

<label>
TEAM ALPHA SIZE
</label>

<select id="alphaTeamSize" onchange="sizeChanged()">

<option value="1">1 FIGHTER</option>
<option value="2">2 FIGHTERS</option>
<option value="3">3 FIGHTERS</option>
<option value="4">4 FIGHTERS</option>
<option value="5">5 FIGHTERS</option>

</select>

</div>

<div class="control">

<label>
TEAM OMEGA SIZE
</label>

<select id="omegaTeamSize" onchange="sizeChanged()">

<option value="1">1 FIGHTER</option>
<option value="2">2 FIGHTERS</option>
<option value="3">3 FIGHTERS</option>
<option value="4">4 FIGHTERS</option>
<option value="5">5 FIGHTERS</option>

</select>

</div>

<div
id="sigmaSizeControl"
class="control hidden">

<label>
TEAM SIGMA SIZE
</label>

<select id="sigmaTeamSize" onchange="sizeChanged()">

<option value="1">1 FIGHTER</option>
<option value="2">2 FIGHTERS</option>
<option value="3">3 FIGHTERS</option>
<option value="4">4 FIGHTERS</option>
<option value="5">5 FIGHTERS</option>

</select>

</div>

<div class="control">

<label>
SELECTION MODE
</label>

<select
id="selectionMode"
onchange="selectionModeChanged()">

<option value="Generate10">
GENERATE 10
</option>

<option value="FreeSelect">
FREE SELECT
</option>

</select>

</div>

<div class="control">

<label>
UNIVERSE
</label>

<select
id="universe"
onchange="filtersChanged()">

<option value="Both">
MARVEL + DC
</option>

<option value="Marvel">
MARVEL
</option>

<option value="DC">
DC
</option>

</select>

</div>

<div class="control">

<label>
VERSION
</label>

<select
id="versionMode"
onchange="filtersChanged()">

<option value="Standard">
STANDARD
</option>

<option value="Amped">
AMPED
</option>

<option value="Mixed">
MIXED
</option>

</select>

</div>

<div class="control">

<label>
BATTLEFIELD
</label>

<select id="battlefield">

<option>
Abandoned City
</option>

<option>
Stark Tower
</option>

<option>
Gotham Rooftops
</option>

<option>
Savage Land
</option>

<option>
Cosmic Arena
</option>

</select>

</div>

<div class="control">

<label>
STORY DEPTH
</label>

<select id="storyDepth">

<option value="brief">
BRIEF
</option>

<option
value="detailed"
selected>
DETAILED
</option>

<option value="cinematic">
CINEMATIC
</option>

</select>

</div>

</div>

<!-- =====================================================
     TIERS
===================================================== -->

<div
class="control"
style="margin-top:8px">

<label>
POWER TIERS // SELECT ANY COMBINATION
</label>

<div class="tiers">

<label class="tier">

<input
class="tierCheck"
type="checkbox"
value="Street"
checked
onchange="filtersChanged()">

STREET

</label>

<label class="tier">

<input
class="tierCheck"
type="checkbox"
value="Enhanced"
checked
