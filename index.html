<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Superhero Battle Simulator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top, #182b3c 0%, #070c12 48%, #020305 100%);
    color: #edf7ff;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    padding: 30px 15px;
    text-align: center;
    background: linear-gradient(#111e2b,#060a0f);
    border-bottom: 1px solid #29485f;
    box-shadow: 0 0 30px #000;
}

header h1 {
    margin: 0;
    font-size: 38px;
    letter-spacing: 3px;
}

header p {
    color: #91a9bb;
    margin-bottom: 0;
}

.settings {
    text-align: center;
    padding: 20px;
}

select {
    background: #09131c;
    color: white;
    border: 1px solid #3a5b70;
    padding: 10px 15px;
    border-radius: 7px;
    margin-left: 8px;
}

button {
    border: 1px solid #3c6d88;
    border-radius: 8px;
    padding: 12px 20px;
    background: linear-gradient(#173d56,#0a1c2a);
    color: white;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    box-shadow: 0 0 15px rgba(70,210,255,.35);
    background: linear-gradient(#225875,#0e3047);
}

.primary {
    background: linear-gradient(#00a5e6,#005e86);
    border-color: #55d9ff;
}

.teams {
    max-width: 1100px;
    margin: 20px auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.team {
    background: linear-gradient(145deg,#101d29,#070c11);
    border: 1px solid #294456;
    border-radius: 14px;
    padding: 20px;
    min-height: 270px;
}

.team h2 {
    text-align: center;
}

.team1-title {
    color: #39b3ff;
}

.team2-title {
    color: #ff5b6d;
}

.character {
    margin: 8px 0;
    padding: 12px;
    border-radius: 7px;
    background: #162532;
    border: 1px solid #294658;
    font-weight: bold;
}

.center {
    text-align: center;
}

#battleHUD {
    max-width: 1100px;
    margin: 25px auto;
    padding: 20px;
    background: linear-gradient(145deg,#101c27,#05090e);
    border: 1px solid #294456;
    border-radius: 14px;
    box-shadow: 0 10px 40px #000;
}

.hidden {
    display: none !important;
}

.hud-header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    text-align: center;
    border-bottom: 1px solid #263c4e;
    padding-bottom: 12px;
}

.hud-header h2 {
    margin: 5px;
}

.blue {
    color: #42b9ff;
}

.red {
    color: #ff596c;
}

.round-display {
    color: #4ad9ff;
    font-size: 24px;
    font-weight: bold;
}

.health-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    margin-top: 20px;
}

.health-column {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.health-card {
    background: #071018;
    border: 1px solid #263c4c;
    border-radius: 7px;
    padding: 10px;
    transition: .5s;
}

.health-card.dead {
    opacity: .3;
    filter: grayscale(1);
}

.health-name {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 7px;
}

.hp-number {
    color: #9bb0bf;
}

.hp-bar {
    height: 18px;
    background: #020407;
    border: 1px solid #263b4c;
    border-radius: 20px;
    overflow: hidden;
}

.hp-fill {
    height: 100%;
    width: 100%;
    background: #20d77a;
    transition: width .8s ease;
}

.hp-fill.medium {
    background: #e7b52c;
}

.hp-fill.low {
    background: #e23d50;
}

.dead-label {
    color: #ff5368;
    font-size: 10px;
    font-weight: bold;
    margin-top: 5px;
}

#battle {
    max-width: 1100px;
    margin: 25px auto;
    padding: 30px;
    background: linear-gradient(145deg,#101a24,#05090d);
    border: 1px solid #294456;
    border-radius: 14px;
    box-shadow: 0 10px 40px #000;
}

.story {
    text-align: left;
    line-height: 1.85;
    font-size: 17px;
}

.story p {
    margin: 18px 0;
}

.story h2 {
    color: #48d7ff;
    border-bottom: 1px solid #294456;
    padding-bottom: 12px;
}

.move {
    color: #ffd86a;
    font-weight: bold;
}

.elimination {
    color: #ff586c;
    font-weight: bold;
    font-size: 18px;
    border-left: 3px solid #ff586c;
    padding-left: 15px;
}

.round-summary {
    margin-top: 25px;
    padding: 18px;
    background: #0a141d;
    border: 1px solid #294456;
    border-radius: 8px;
}

.next {
    text-align: center;
    margin-top: 25px;
}

.next button {
    padding: 16px 45px;
    font-size: 18px;
}

.winner {
    margin-top: 30px;
    padding: 30px;
    text-align: center;
    border: 1px solid #92782f;
    background: #211b0b;
    border-radius: 10px;
}

.winner h2 {
    color: #ffd75d;
    font-size: 34px;
}

.winner p {
    color: #d9e2e8;
}

@media(max-width:750px) {

    .teams,
    .health-grid {
        grid-template-columns: 1fr;
    }

    .hud-header {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    header h1 {
        font-size: 27px;
    }

    #battle {
        padding: 20px;
    }

    .story {
        font-size: 15px;
    }
}
</style>

</head>

<body>

<header>
    <h1>⚔️ SUPERHERO BATTLE SIMULATOR</h1>
    <p>Watch the battle unfold one round at a time.</p>
</header>

<div class="settings">

```
<label><strong>Battle Depth:</strong></label>

<select id="battleDepth">
    <option value="short">Short</option>
    <option value="medium" selected>Medium</option>
    <option value="long">Long</option>
</select>
```

</div>

<div class="teams">

```
<div class="team">
    <h2 class="team1-title">🔵 TEAM 1</h2>

    <div id="team1"></div>

    <div class="center">
        <button onclick="addCharacter(1)">
            🎲 Add Character
        </button>
    </div>
</div>

<div class="team">
    <h2 class="team2-title">🔴 TEAM 2</h2>

    <div id="team2"></div>

    <div class="center">
        <button onclick="addCharacter(2)">
            🎲 Add Character
        </button>
    </div>
</div>
```

</div>

<div class="center">

```
<button class="primary" onclick="startBattle()">
    ⚔️ START BATTLE
</button>
```

</div>

<div id="battleHUD" class="hidden">

```
<div class="hud-header">

    <h2 class="blue">🔵 TEAM 1</h2>

    <div id="roundDisplay" class="round-display">
        ROUND 1
    </div>

    <h2 class="red">🔴 TEAM 2</h2>

</div>

<div class="health-grid">

    <div id="healthTeam1" class="health-column"></div>

    <div id="healthTeam2" class="health-column"></div>

</div>
```

</div>

<div id="battle">

```
<h2>Battle Console</h2>

<p>
    Build both teams and start the battle.
</p>
```

</div>

style:"trick-based supernatural tactician",
range:"all ranges"
},

"Swamp Thing":{
moves:[
"Vine Assault",
"Plant Surge",
"Swamp Crush",
"Green Regeneration",
"Root Bind",
"Nature's Wrath"
],
style:"environmental powerhouse",
range:"all ranges"
},

"Supergirl":{
moves:[
"Heat Vision",
"Super Punch",
"Kryptonian Charge",
"Freeze Breath",
"Super-Speed Blitz",
"Flying Strike"
],
style:"high-speed Kryptonian powerhouse",
range:"all ranges"
},

"Red Hood":{
moves:[
"Dual Pistol Burst",
"Explosive Round",
"Helmet Strike",
"Tactical Counter",
"Heavy Pistol Burst",
"Close Combat Combination"
],
style:"aggressive tactical fighter",
range:"all ranges"
}

};


/* =========================================================
   TEAM VARIABLES
========================================================= */

let team1 = [];
let team2 = [];
let battle = null;


/* =========================================================
   ADD CHARACTER
========================================================= */

function addCharacter(team) {

    const target =
        team === 1 ? team1 : team2;

    if(target.length >= 5) {

        alert("Each team can have a maximum of 5 characters.");

        return;
    }

    const used =
        [...team1,...team2];

    const available =
        characters.filter(
            name => !used.includes(name)
        );

    if(!available.length) {

        alert("No characters remain.");

        return;
    }

    const selected =
        random(available);

    target.push(selected);

    displayTeams();

}


/* =========================================================
   DISPLAY TEAMS
========================================================= */

function displayTeams() {

    document.getElementById("team1").innerHTML =
        team1.map(
            (name,index) =>
            `<div class="character">
                ${index+1}. ${name}
            </div>`
        ).join("");

    document.getElementById("team2").innerHTML =
        team2.map(
            (name,index) =>
            `<div class="character">
                ${index+1}. ${name}
            </div>`
        ).join("");

}


/* =========================================================
   HELPERS
========================================================= */

function random(array) {

    return array[
        Math.floor(Math.random()*array.length)
    ];

}

function living(team) {

    return team.filter(
        fighter => fighter.alive
    );

}

function getMove(name) {

    return random(
        combat[name].moves
    );

}


/* =========================================================
   DAMAGE
========================================================= */

function damageFor(name, move) {

    let damage =
        Math.floor(Math.random()*13)+10;

    const heavy = [

        "Hulk",
        "Thor",
        "Superman",
        "Wonder Woman",
        "Captain Marvel",
        "Darkseid",
        "Doomsday",
        "Black Adam",
        "Shazam",
        "Jean Grey",
        "Doctor Doom",
        "Martian Manhunter"

    ];

    if(heavy.includes(name)) {

        damage +=
            Math.floor(Math.random()*10);

    }

    if(
        move.includes("Smash") ||
        move.includes("Barrage") ||
        move.includes("Blast") ||
        move.includes("Beam") ||
        move.includes("Uppercut") ||
        move.includes("Strike")
    ) {

        damage +=
            Math.floor(Math.random()*5);

    }

    return damage;

}


/* =========================================================
   START
========================================================= */

function startBattle() {

    if(!team1.length || !team2.length) {

        alert("Both teams need at least one character.");

        return;
    }

    battle = {

        round:1,

        team1:
            team1.map(name => ({
                name:name,
                hp:100,
                alive:true
            })),

        team2:
            team2.map(name => ({
                name:name,
                hp:100,
                alive:true
            })),

        finished:false

    };

    document
        .getElementById("battleHUD")
        .classList
        .remove("hidden");

    renderHealth();

    document.getElementById("battle").innerHTML = `

        <div class="story">

            <h2>THE BATTLE BEGINS</h2>

            <p>
                The battlefield falls silent as the two teams
                take their positions. Broken concrete stretches
                across the ground, abandoned buildings rise on
                either side, and the distance between the two
                groups suddenly feels very small.
            </p>

            <p>
                Nobody moves.
            </p>

            <p>
                Then the first fighter steps forward.
            </p>

            <div class="next">

                <button
                    class="primary"
                    onclick="simulateRound()"
                >
                    ▶ SIMULATE ROUND 1
                </button>

            </div>

        </div>

    `;

}


/* =========================================================
   HEALTH HUD
========================================================= */

function renderHealth() {

    if(!battle) return;

    document.getElementById("roundDisplay")
        .textContent =
        battle.finished
        ? "BATTLE OVER"
        : `ROUND ${battle.round}`;

    document.getElementById("healthTeam1").innerHTML =
        battle.team1.map(
            makeHealthCard
        ).join("");

    document.getElementById("healthTeam2").innerHTML =
        battle.team2.map(
            makeHealthCard
        ).join("");

}


function makeHealthCard(fighter) {

    let hpClass = "";

    if(fighter.hp <= 25)
        hpClass = "low";

    else if(fighter.hp <= 50)
        hpClass = "medium";

    return `

        <div class="health-card ${
            fighter.alive ? "" : "dead"
        }">

            <div class="health-name">

                <span>
                    ${fighter.name}
                </span>

                <span class="hp-number">
                    ${fighter.hp} HP
                </span>

            </div>

            <div class="hp-bar">

                <div
                    class="hp-fill ${hpClass}"
                    style="width:${fighter.hp}%"
                ></div>

            </div>

            ${
                !fighter.alive
                ?
                `<div class="dead-label">
                    ☠ ELIMINATED
                </div>`
                :
                ""
            }

        </div>

    `;

}


/* =========================================================
   CINEMATIC ATTACK
========================================================= */

function cinematicAttack(attacker,target,teamNumber) {

    const move =
        getMove(attacker.name);

    const damage =
        damageFor(attacker.name,move);

    const oldHP =
        target.hp;

    target.hp =
        Math.max(0,target.hp-damage);

    let text = "";


    /*
       Special writing for iconic characters.
    */

    if(attacker.name === "Hulk") {

        text += `

        <p>
            Hulk suddenly explodes forward, his footsteps
            cracking the pavement beneath him. He closes the
            distance before ${target.name} can establish a
            proper defense and swings with a brutal
            <span class="move">${move}</span>.
            The blow tears through the battlefield and sends
            ${target.name} violently backward.
        </p>

        `;

    }

    else if(attacker.name === "Superman") {

        text += `

        <p>
            Superman disappears in a blur of movement.
            The sound of his acceleration reaches the battlefield
            a fraction of a second after he has already crossed it.
            He appears directly in front of ${target.name} and
            unleashes a devastating
            <span class="move">${move}</span>.
        </p>

        `;

    }

    else if(
        attacker.name === "The Flash" ||
        attacker.name === "Quicksilver"
    ) {

        text += `

        <p>
            ${attacker.name} lowers into a runner's stance and
            vanishes from sight. A streak of motion circles
            ${target.name}, followed by a rapid series of impacts.
            The sequence ends with
            <span class="move">${move}</span>,
            catching ${target.name} before they can react.
        </p>

        `;

    }

    else if(
        attacker.name === "Thor" ||
        attacker.name === "Captain Marvel" ||
        attacker.name === "Black Adam" ||
        attacker.name === "Shazam"
    ) {

        text += `

        <p>
            ${attacker.name} surges forward with overwhelming
            force. Energy erupts across the battlefield as
            ${attacker.name} unleashes
            <span class="move">${move}</span>.
            The impact sends a shockwave across the ground and
            forces ${target.name} to absorb the full force of
            the attack.
        </p>

        `;

    }

    else if(
        attacker.name === "Batman" ||
        attacker.name === "Nightwing" ||
        attacker.name === "Deathstroke" ||
        attacker.name === "Black Canary"
    ) {

        text += `

        <p>
            ${attacker.name} does not rush blindly. A brief
            movement from ${target.name} reveals an opening.
            ${attacker.name} immediately exploits it, chaining
            together precise movements before finishing with
            <span class="move">${move}</span>.
            The strike lands cleanly.
        </p>

        `;

    }

    else if(
        attacker.name === "Storm" ||
        attacker.name === "Magneto" ||
        attacker.name === "Green Lantern" ||
        attacker.name === "Raven"
    ) {

        text += `

        <p>
            The battlefield itself seems to respond to
            ${attacker.name}. Energy gathers around the fighter
            as they raise their hand and unleash
            <span class="move">${move}</span>.
            The attack tears across the battlefield and crashes
            into ${target.name}.
        </p>

        `;

    }

    else {

        text += `

        <p>
            ${attacker.name} sees an opening and commits immediately.
            Moving with the instincts of a fighter who knows that
            hesitation can be fatal, they unleash
            <span class="move">${move}</span>.
            ${target.name} attempts to react, but the attack reaches
            them before they can completely escape its path.
        </p>

        `;

    }


    text += `

        <p>
            The attack reduces ${target.name}'s health from
            <strong>${oldHP} HP</strong> to
            <strong>${target.hp} HP</strong>.
        </p>

    `;


    if(target.hp <= 0) {

        target.alive = false;

        text += `

            <p class="elimination">
                ☠ ${target.name} is eliminated.
                The fighter falls out of the battle as the
                remaining combatants immediately shift their
                attention toward the changing battlefield.
            </p>

        `;

    }

    else {

        const reactions = [

            `${target.name} staggers backward but refuses to fall.`,

            `${target.name} absorbs the impact and forces themselves back into position.`,

            `${target.name} is clearly hurt, but the fighter remains on their feet.`,

            `${target.name} slides across the ground before finally stopping and looking back toward the fight.`,

            `${target.name} recovers their balance and immediately begins searching for another opening.`

        ];

        text += `

            <p>
                ${random(reactions)}
            </p>

        `;

    }

    return text;

}


/* =========================================================
   ROUND SIMULATION
========================================================= */

function simulateRound() {

    if(!battle || battle.finished)
        return;


    const round =
        battle.round;

    let story = `

        <div class="story">

            <h2>⚔️ ROUND ${round}</h2>

            <p>
                The next exchange begins.
                The surviving fighters spread across the battlefield,
                each one reacting to the damage already taken.
                Wounded combatants become more cautious while the
                stronger fighters begin pressing their advantages.
            </p>

    `;


    /*
       Build attack order from every living fighter.
    */

    let order = [

        ...living(battle.team1).map(f => ({
            fighter:f,
            team:1
        })),

        ...living(battle.team2).map(f => ({
            fighter:f,
            team:2
        }))

    ];


    /*
       Randomize initiative.
    */

    order.sort(
        () => Math.random()-.5
    );


    /*
       Long battles receive additional exchanges.
    */

    const depth =
        document.getElementById("battleDepth").value;

    if(depth === "long") {

        const extra =
            [...order]
            .sort(() => Math.random()-.5)
            .slice(
                0,
                Math.max(1,
                Math.floor(order.length/2))
            );

        order =
            [...order,...extra];

    }


    let attackNumber = 0;


    for(const action of order) {

        if(
            living(battle.team1).length === 0 ||
            living(battle.team2).length === 0
        )
            break;


        const attacker =
            action.fighter;


        if(!attacker.alive)
            continue;


        const enemyTeam =
            action.team === 1
            ? battle.team2
            : battle.team1;


        const targets =
            living(enemyTeam);


        if(!targets.length)
            break;


        /*
           Characters with low health are slightly more
           likely to be targeted.
        */

        const target =
            random(targets);


        attackNumber++;


        story += `

            <div class="story">

                ${cinematicAttack(
                    attacker,
                    target,
                    action.team
                )}

            </div>

        `;


        renderHealth();


        /*
           Check for winner immediately.
        */

        if(
            living(battle.team1).length === 0 ||
            living(battle.team2).length === 0
        ) {

            battle.finished = true;

            renderHealth();

            const winner =
                living(battle.team1).length > 0
                ? "TEAM 1"
                : "TEAM 2";

            story += winnerScreen(winner);

            story += `</div>`;

            document.getElementById("battle").innerHTML =
                story;

            return;

        }

    }


    /*
       ROUND END
    */

    const survivors1 =
        living(battle.team1);

    const survivors2 =
        living(battle.team2);


    story += `

        <div class="round-summary">

            <strong>
                ROUND ${round} COMPLETE
            </strong>

            <p>
                The latest exchange comes to an end.
                The surviving fighters create distance while
                assessing the damage inflicted during the round.
            </p>

            <p>
                Team 1 has
                <strong>${survivors1.length}</strong>
                combatant(s) remaining.
            </p>

            <p>
                Team 2 has
                <strong>${survivors2.length}</strong>
                combatant(s) remaining.
            </p>

            <p>
                The health bars above now show the exact condition
                of every remaining fighter.
            </p>

        </div>

        <div class="next">

            <button
                class="primary"
                onclick="simulateRound()"
            >
                ▶ NEXT ROUND
            </button>

        </div>

    `;


    battle.round++;

    renderHealth();

    document.getElementById("battle").innerHTML =
        story;

}


/* =========================================================
   WINNER
========================================================= */

function winnerScreen(teamName) {

    const winningTeam =
        teamName === "TEAM 1"
        ? battle.team1
        : battle.team2;


    const survivors =
        winningTeam
        .filter(f => f.alive);


    const survivorText =
        survivors.length
        ?
        survivors
        .map(
            f =>
            `${f.name} — ${f.hp} HP`
        )
        .join("<br>")
        :
        "No survivors";


    const difficulty =
        survivors.length === 1
        ? "Extreme"
        : survivors.length === 2
        ? "Very Hard"
        : survivors.length >= 4
        ? "Decisive"
        : "Hard";


    return `

        <div class="winner">

            <h2>
                🏆 ${teamName} WINS
            </h2>

            <p>
                The battlefield finally falls silent.
                The opposing team has been completely eliminated,
                leaving ${teamName} as the only side still standing.
            </p>

            <p>
                <strong>Difficulty: ${difficulty}</strong>
            </p>

            <p>
                <strong>Survivors</strong>
                <br><br>
                ${survivorText}
            </p>

        </div>

    `;

}
