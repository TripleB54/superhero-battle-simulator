<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Superhero Battle Simulator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top, #17283a 0%, #080d13 45%, #020305 100%);
    color: #eaf6ff;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    text-align: center;
    padding: 30px 15px;
    background: linear-gradient(#111d2a, #070b10);
    border-bottom: 1px solid #29445c;
    box-shadow: 0 0 25px #000;
}

header h1 {
    margin: 0;
    font-size: 38px;
    letter-spacing: 2px;
}

header p {
    color: #91a9bd;
}

button {
    border: 1px solid #3d6b88;
    border-radius: 8px;
    padding: 13px 22px;
    background: linear-gradient(#173b54, #0b1d2c);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    background: linear-gradient(#225878, #103049);
    box-shadow: 0 0 15px rgba(50,190,255,.3);
}

.primary {
    background: linear-gradient(#009bd8, #005b82);
    border-color: #4ad5ff;
}

.settings {
    text-align: center;
    margin: 20px;
}

select {
    background: #0b131c;
    color: white;
    border: 1px solid #395066;
    padding: 9px 14px;
    border-radius: 6px;
}

/* TEAMS */

.teams {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.team {
    background: linear-gradient(145deg,#111d29,#070c12);
    border: 1px solid #294257;
    border-radius: 14px;
    padding: 20px;
    min-height: 280px;
}

.team h2 {
    text-align: center;
}

.team1-title {
    color: #38adff;
}

.team2-title {
    color: #ff566a;
}

.character {
    padding: 11px;
    margin: 8px 0;
    background: #182633;
    border: 1px solid #2b4357;
    border-radius: 7px;
    font-weight: bold;
}

/* BATTLE HUD */

#battleHUD {
    max-width: 1100px;
    margin: 25px auto;
    padding: 20px;
    background: linear-gradient(145deg,#101b26,#060a0f);
    border: 1px solid #2b465b;
    border-radius: 14px;
    box-shadow: 0 10px 35px #000;
}

.hidden {
    display: none !important;
}

.hud-top {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    text-align: center;
    border-bottom: 1px solid #263c4e;
    padding-bottom: 15px;
}

.hud-team1 {
    color: #35aaff;
}

.hud-team2 {
    color: #ff596d;
}

.round-number {
    color: #48d8ff;
    font-size: 24px;
    font-weight: bold;
}

.health-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    margin-top: 20px;
}

.health-column {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.health-card {
    background: #091119;
    border: 1px solid #263b4d;
    border-radius: 8px;
    padding: 10px;
    transition: .3s;
}

.health-card.active {
    border-color: #45d5ff;
    box-shadow: 0 0 12px rgba(50,190,255,.25);
}

.health-card.dead {
    opacity: .38;
    filter: grayscale(1);
}

.health-name {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 7px;
}

.hp-number {
    color: #8ea6ba;
}

.hp-bar {
    height: 14px;
    background: #020407;
    border: 1px solid #263a4c;
    border-radius: 20px;
    overflow: hidden;
}

.hp-fill {
    height: 100%;
    width: 100%;
    background: #20d77a;
    transition: width .7s ease;
}

.hp-fill.medium {
    background: #e8b52e;
}

.hp-fill.low {
    background: #e23a4d;
}

.dead-label {
    margin-top: 5px;
    color: #ff5063;
    font-size: 10px;
    font-weight: bold;
}

/* STORY */

#battle {
    max-width: 1100px;
    margin: 25px auto;
    padding: 25px;
    background: linear-gradient(145deg,#101923,#060a0f);
    border: 1px solid #2a4154;
    border-radius: 14px;
    box-shadow: 0 10px 35px #000;
}

.story-round {
    margin: 15px 0;
    padding: 20px;
    background: #0b141d;
    border: 1px solid #263d50;
    border-radius: 9px;
    text-align: left;
    line-height: 1.8;
}

.story-title {
    color: #46d8ff;
    font-weight: bold;
    border-bottom: 1px solid #263a4c;
    padding-bottom: 9px;
    margin-bottom: 14px;
    font-size: 18px;
}

.attack-label {
    color: #b7d5e8;
    font-weight: bold;
}

.elimination {
    color: #ff5368;
    font-weight: bold;
    border-left: 3px solid #ff5368;
    padding-left: 12px;
}

.next-container {
    text-align: center;
    margin-top: 25px;
}

.next-button {
    font-size: 18px;
    padding: 16px 45px;
}

.winner {
    margin-top: 25px;
    padding: 30px;
    text-align: center;
    border: 1px solid #8b7130;
    border-radius: 10px;
    background: #211b0b;
    color: #ffd966;
    font-size: 30px;
    font-weight: bold;
}

.winner-info {
    color: #d7e1e8;
    font-size: 15px;
    margin-top: 15px;
    line-height: 1.8;
    font-weight: normal;
}

.round-summary {
    background: #101d27;
    border: 1px solid #294557;
    padding: 16px;
    border-radius: 8px;
    margin-top: 18px;
    text-align: left;
}

@media(max-width:750px) {
    .teams,
    .health-grid {
        grid-template-columns: 1fr;
    }

    .hud-top {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    header h1 {
        font-size: 27px;
    }
}
</style>

</head>

<body>

<header>
    <h1>⚔️ SUPERHERO BATTLE SIMULATOR ⚔️</h1>
    <p>Build your teams and control the battle round by round.</p>
</header>

<div class="settings">

```
<label>
    <strong>Battle Depth:</strong>
</label>

<select id="battleDepth">
    <option value="short">Short</option>
    <option value="medium" selected>Medium</option>
    <option value="long">Long</option>
</select>
```

</div>

<div class="teams">

```
<div class="team">

    <h2 class="team1-title">🔵 TEAM 1</h2>

    <div id="team1"></div>

    <button onclick="addCharacter(1)">
        🎲 Add Character
    </button>

</div>

<div class="team">

    <h2 class="team2-title">🔴 TEAM 2</h2>

    <div id="team2"></div>

    <button onclick="addCharacter(2)">
        🎲 Add Character
    </button>

</div>
```

</div>

<div style="text-align:center;">

```
<button class="primary" onclick="startBattle()">
    ⚔️ START BATTLE
</button>
```

</div>

<div id="battleHUD" class="hidden">

```
<div class="hud-top">

    <div>
        <h2 class="hud-team1">🔵 TEAM 1</h2>
    </div>

    <div id="roundNumber" class="round-number">
        ROUND 1
    </div>

    <div>
        <h2 class="hud-team2">🔴 TEAM 2</h2>
    </div>

</div>

<div class="health-grid">

    <div id="healthTeam1" class="health-column"></div>

    <div id="healthTeam2" class="health-column"></div>

</div>
```

</div>

<div id="battle">

```
<h2>Battle Console</h2>

<p>
    Build both teams and press START BATTLE.
</p>
```

</div>

<script>

"Zatanna":["Mystic Blast","Magical Binding","Reality Spell","Arcane Shield"],
"Constantine":["Mystic Ward","Occult Binding","Demonic Counter","Arcane Blast"],
"Swamp Thing":["Vine Assault","Plant Surge","Swamp Crush","Green Regeneration"],
"Supergirl":["Heat Vision","Super Punch","Kryptonian Charge","Freeze Breath"],
"Red Hood":["Dual Pistol Burst","Explosive Round","Helmet Strike","Tactical Counter"]

};


/* =========================================================
   TEAM DATA
========================================================= */

let team1 = [];
let team2 = [];
let battle = null;


/* =========================================================
   ADD CHARACTER
========================================================= */

function addCharacter(team) {

    const target = team === 1 ? team1 : team2;

    if(target.length >= 5) {
        alert("Each team can have a maximum of 5 characters.");
        return;
    }

    const used = [...team1,...team2];

    const available =
        characters.filter(name => !used.includes(name));

    if(!available.length) {
        alert("There are no characters remaining.");
        return;
    }

    const selected =
        available[Math.floor(Math.random()*available.length)];

    target.push(selected);

    displayTeams();
}


/* =========================================================
   DISPLAY TEAMS
========================================================= */

function displayTeams() {

    const t1 = document.getElementById("team1");
    const t2 = document.getElementById("team2");

    t1.innerHTML = "";
    t2.innerHTML = "";

    team1.forEach((name,index) => {

        const div = document.createElement("div");

        div.className = "character";

        div.textContent =
            `${index + 1}. ${name}`;

        t1.appendChild(div);

    });

    team2.forEach((name,index) => {

        const div = document.createElement("div");

        div.className = "character";

        div.textContent =
            `${index + 1}. ${name}`;

        t2.appendChild(div);

    });

}


/* =========================================================
   START BATTLE
========================================================= */

function startBattle() {

    if(!team1.length || !team2.length) {

        alert("Both teams need at least one character.");

        return;
    }

    battle = {

        round: 1,

        team1: team1.map(name => ({
            name,
            hp: 100,
            alive: true
        })),

        team2: team2.map(name => ({
            name,
            hp: 100,
            alive: true
        })),

        finished: false

    };

    document
        .getElementById("battleHUD")
        .classList.remove("hidden");

    renderHealth();

    document.getElementById("battle").innerHTML = `

        <h2>⚔️ BATTLE READY</h2>

        <div class="story-round">

            <div class="story-title">
                THE BATTLEFIELD
            </div>

            <p>
                The two teams enter the battlefield from opposite
                sides, each fighter aware that there will be no
                opportunity to retreat once the confrontation
                reaches its decisive stage.
            </p>

            <p>
                Every combatant begins at <strong>100 HP</strong>.
                The battle will be simulated one complete round
                at a time, allowing you to watch the condition of
                both teams change before deciding whether to
                continue.
            </p>

        </div>

        <div class="next-container">

            <button
                class="primary next-button"
                onclick="simulateRound()"
            >
                ▶ SIMULATE ROUND 1
            </button>

        </div>
    `;

}


/* =========================================================
   HEALTH SYSTEM
========================================================= */

function renderHealth() {

    if(!battle) return;

    const t1 =
        document.getElementById("healthTeam1");

    const t2 =
        document.getElementById("healthTeam2");

    t1.innerHTML = "";
    t2.innerHTML = "";

    battle.team1.forEach(fighter => {

        t1.appendChild(createHealthCard(fighter));

    });

    battle.team2.forEach(fighter => {

        t2.appendChild(createHealthCard(fighter));

    });

    document.getElementById("roundNumber").textContent =
        battle.finished
            ? "BATTLE OVER"
            : `ROUND ${battle.round}`;
}


function createHealthCard(fighter) {

    const card =
        document.createElement("div");

    card.className = "health-card";

    if(!fighter.alive) {
        card.classList.add("dead");
    }

    let hpClass = "";

    if(fighter.hp <= 25) {
        hpClass = "low";
    }
    else if(fighter.hp <= 50) {
        hpClass = "medium";
    }

    card.innerHTML = `

        <div class="health-name">

            <span>${fighter.name}</span>

            <span class="hp-number">
                ${fighter.hp} HP
            </span>

        </div>

        <div class="hp-bar">

            <div
                class="hp-fill ${hpClass}"
                style="width:${fighter.hp}%"
            ></div>

        </div>

        ${
            !fighter.alive
            ?
            `<div class="dead-label">
                ☠ ELIMINATED
            </div>`
            :
            ""
        }

    `;

    return card;
}


/* =========================================================
   HELPERS
========================================================= */

function random(array) {

    return array[
        Math.floor(Math.random()*array.length)
    ];

}


function living(team) {

    return team.filter(
        fighter => fighter.alive
    );

}


function getMove(name) {

    if(!moves[name]) {
        return "a devastating attack";
    }

    return random(moves[name]);

}


/* =========================================================
   DAMAGE
========================================================= */

function calculateDamage(attacker, move) {

    let damage =
        Math.floor(Math.random()*13) + 9;

    const heavy = [

        "Hulk",
        "Thor",
        "Superman",
        "Wonder Woman",
        "Captain Marvel",
        "Darkseid",
        "Doomsday",
        "Black Adam",
        "Shazam",
        "Jean Grey",
        "Doctor Doom",
        "Martian Manhunter"

    ];

    if(heavy.includes(attacker.name)) {

        damage +=
            Math.floor(Math.random()*10);

    }

    if(
        move.includes("Blast") ||
        move.includes("Beam") ||
        move.includes("Smash") ||
        move.includes("Barrage") ||
        move.includes("Strike")
    ) {

        damage +=
            Math.floor(Math.random()*5);

    }

    return damage;

}


/* =========================================================
   DEPTH
========================================================= */

function getRoundIntensity() {

    const depth =
        document.getElementById("battleDepth").value;

    if(depth === "short") {
        return 1;
    }

    if(depth === "long") {
        return 2;
    }

    return 1;

}


/* =========================================================
   ATTACK STORY
========================================================= */

function performAttack(attacker, target, teamName) {

    const move =
        getMove(attacker.name);

    const damage =
        calculateDamage(attacker, move);

    const oldHP =
        target.hp;

    target.hp =
        Math.max(0,target.hp-damage);

    let text = `

        <p>

            <span class="attack-label">
                ${teamName}:
            </span>

            <strong>${attacker.name}</strong>
            moves first, closing the distance with
            <strong>${target.name}</strong> before the defender
            can completely establish a defensive position.

        </p>

        <p>

            ${attacker.name} unleashes
            <strong>${move}</strong>.
            The attack connects with enough force to change the
            momentum of the exchange, reducing
            ${target.name}'s health from
            <strong>${oldHP} HP</strong> to
            <strong>${target.hp} HP</strong>.

        </p>

    `;

    if(target.hp <= 0) {

        target.alive = false;

        text += `

            <p class="elimination">

                ☠ ${target.name} has been eliminated from the
                battle.

            </p>

        `;

    }
    else {

        text += `

            <p>

                ${target.name} refuses to give ground.
                Despite the damage, the fighter remains active
                and immediately begins searching for another
                opening.

            </p>

        `;

    }

    return text;

}


/* =========================================================
   SIMULATE FULL ROUND
========================================================= */

function simulateRound() {

    if(!battle || battle.finished) {
        return;
    }

    const round =
        battle.round;

    let story = `

        <h2>⚔️ ROUND ${round}</h2>

        <div class="story-round">

            <div class="story-title">
                ROUND ${round} — THE ENGAGEMENT
            </div>

            <p>
                The temporary silence across the battlefield
                disappears almost immediately. Fighters from
                both sides begin repositioning, watching for
                openings while attempting to protect their
                wounded teammates.
            </p>

    `;

    const intensity =
        getRoundIntensity();

    let fighters1 =
        [...living(battle.team1)];

    let fighters2 =
        [...living(battle.team2)];

    /*
       Shuffle the fighters so the same character
       does not always attack first.
    */

    const order = [
        ...fighters1.map(f => ({
            fighter:f,
            team:1
        })),
        ...fighters2.map(f => ({
            fighter:f,
            team:2
        }))
    ].sort(() => Math.random()-.5);


    let attacks = 0;


    /*
       Each living character gets an attack.
    */

    for(const entry of order) {

        if(
            living(battle.team1).length === 0 ||
            living(battle.team2).length === 0
        ) {
            break;
        }

        const attacker =
            entry.fighter;

        if(!attacker.alive) {
            continue;
        }

        const enemyTeam =
            entry.team === 1
                ? battle.team2
                : battle.team1;

        let targets =
            living(enemyTeam);

        if(!targets.length) {
            break;
        }

        const target =
            random(targets);

        story += `

            <div class="story-round">

                <div class="story-title">

                    ${
                        entry.team === 1
                            ? "🔵 TEAM 1"
                            : "🔴 TEAM 2"
                    }
                    — ATTACK ${attacks + 1}

                </div>

                ${performAttack(
                    attacker,
                    target,
                    entry.team === 1
                        ? "TEAM 1"
                        : "TEAM 2"
                )}

            </div>

        `;

        attacks++;

        renderHealth();

        /*
           Long mode gives some fighters an additional
           opportunity during the round.
        */

        if(intensity === 2 && attacker.alive) {

            if(
                living(battle.team1).length > 0 &&
                living(battle.team2).length > 0
            ) {

                const secondTargets =
                    living(enemyTeam);

                if(secondTargets.length) {

                    const secondTarget =
                        random(secondTargets);

                    story += `

                        <div class="story-round">

                            <div class="story-title">
                                ⚡ FOLLOW-UP ATTACK
                            </div>

                            ${performAttack(
                                attacker,
                                secondTarget,
                                entry.team === 1
                                    ? "TEAM 1"
                                    : "TEAM 2"
                            )}

                        </div>

                    `;

                    attacks++;

                    renderHealth();

                }

            }

        }

    }


    const alive1 =
        living(battle.team1).length;

    const alive2 =
        living(battle.team2).length;


    /*
       WINNER CHECK
    */

    if(alive1 === 0 || alive2 === 0) {

        battle.finished = true;

        renderHealth();

        const winner =
            alive1 > 0
                ? "TEAM 1"
                : "TEAM 2";

        story += winnerScreen(winner);

        document.getElementById("battle").innerHTML =
            story;

        return;

    }


    /*
       ROUND SUMMARY
    */

    story += `

        <div class="round-summary">

            <strong>
                ROUND ${round} COMPLETE
            </strong>

            <p>
                Team 1:
                <strong>${alive1} fighter(s)</strong>
                remaining.
            </p>

            <p>
                Team 2:
                <strong>${alive2} fighter(s)</strong>
                remaining.
            </p>

            <p>
                The battle is now paused. No additional attacks
                will occur until you choose to continue.
            </p>

        </div>

        <div class="next-container">

            <button
                class="primary next-button"
                onclick="simulateRound()"
            >
                ▶ NEXT ROUND
            </button>

        </div>

    `;


    battle.round++;


    renderHealth();


    document.getElementById("battle").innerHTML =
        story;

}


/* =========================================================
   WINNER
========================================================= */

function winnerScreen(teamName) {

    const winningTeam =
        teamName === "TEAM 1"
            ? battle.team1
            : battle.team2;

    const survivors =
        winningTeam
            .filter(f => f.alive)
            .map(
                f => `${f.name} — ${f.hp} HP`
            )
            .join("<br>");


    return `

        <div class="winner">

            🏆 ${teamName} WINS

            <div class="winner-info">

                The opposing team has been completely
                eliminated. There are no remaining enemy
                combatants capable of continuing the battle.

                <br><br>

                <strong>FINAL SURVIVORS</strong>

                <br><br>

                ${survivors}

            </div>

        </div>

    `;

}

</script>
