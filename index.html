<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Superhero Battle Simulator</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #172638 0%, #080c12 45%, #030507 100%);
    color: #fff;
    min-height: 100vh;
}

header {
    padding: 28px 20px;
    background: linear-gradient(180deg, #111c29, #080d14);
    border-bottom: 1px solid #31475c;
    box-shadow: 0 0 30px rgba(0,0,0,.6);
}

h1 {
    margin: 0;
    font-size: 38px;
    letter-spacing: 2px;
}

header p {
    color: #8da4ba;
    margin-bottom: 0;
}

button,
select {
    font-family: inherit;
}

button {
    border: 1px solid #3c6a88;
    background: linear-gradient(180deg, #18364d, #0b1b29);
    color: white;
    padding: 13px 22px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
    background: linear-gradient(180deg, #22516f, #10283b);
    box-shadow: 0 0 18px rgba(40,180,255,.25);
}

.primary {
    background: linear-gradient(180deg, #008ec7, #00567c);
    border-color: #45cfff;
}

.primary:hover {
    background: linear-gradient(180deg, #00a9eb, #006b99);
}

.controls {
    max-width: 1100px;
    margin: 25px auto 10px;
    padding: 0 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.controls label {
    color: #91a8bd;
    font-size: 14px;
}

select {
    background: #0c141e;
    color: white;
    border: 1px solid #334b61;
    border-radius: 7px;
    padding: 10px 14px;
}

/* TEAMS */

.teams {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}

.team {
    background: linear-gradient(145deg, #111b26, #080e15);
    border: 1px solid #2b4054;
    border-radius: 14px;
    padding: 22px;
    min-height: 320px;
    box-shadow: 0 15px 35px rgba(0,0,0,.35);
}

.team h2 {
    margin-top: 0;
    font-size: 25px;
}

.team1-title {
    color: #36aaff;
}

.team2-title {
    color: #ff596b;
}

.characters {
    min-height: 200px;
}

.character {
    margin: 9px 0;
    padding: 12px;
    border-radius: 8px;
    background: #18232e;
    border: 1px solid #2d4355;
    text-align: left;
    font-weight: bold;
}

/* MAIN BATTLE */

#battle {
    max-width: 1100px;
    margin: 30px auto;
    padding: 25px;
    background: linear-gradient(145deg, #101923, #070b10);
    border: 1px solid #2c4154;
    border-radius: 14px;
    min-height: 180px;
    box-shadow: 0 15px 40px rgba(0,0,0,.45);
}

.round {
    background: rgba(12,22,32,.9);
    border: 1px solid #293e51;
    border-radius: 10px;
    margin: 15px 0;
    padding: 18px;
    text-align: left;
    line-height: 1.7;
}

.round-title {
    color: #43cfff;
    font-weight: 900;
    letter-spacing: 1px;
    border-bottom: 1px solid #25394a;
    padding-bottom: 8px;
    margin-bottom: 12px;
}

.elimination {
    color: #ff586b;
    font-weight: 900;
}

.winner {
    margin-top: 25px;
    padding: 25px;
    text-align: center;
    font-size: 32px;
    font-weight: 900;
    color: #ffd76a;
    border: 1px solid #806b2d;
    background: linear-gradient(145deg, #2a2411, #151207);
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(255,190,50,.12);
}

/* HEALTH HUD */

#battleHUD {
    max-width: 1100px;
    margin: 30px auto 0;
    padding: 22px;
    background: linear-gradient(145deg, #101923, #070b10);
    border: 1px solid #2c4154;
    border-radius: 14px;
    box-shadow: 0 15px 40px rgba(0,0,0,.45);
}

.hidden {
    display: none !important;
}

.battle-hud-header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 20px;
    text-align: center;
    border-bottom: 1px solid #26384d;
    padding-bottom: 15px;
}

.battle-hud-header h2 {
    margin: 4px 0 0;
}

.team1-hud {
    color: #36aaff;
}

.team2-hud {
    color: #ff596b;
}

.hud-label {
    font-size: 9px;
    letter-spacing: 3px;
    color: #71859c;
}

.round-display {
    font-size: 23px;
    font-weight: 900;
    color: #46ddff;
    text-shadow: 0 0 15px rgba(70,221,255,.4);
}

.health-teams {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    margin-top: 20px;
}

.health-team {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.health-character {
    background: #0a111a;
    border: 1px solid #26384d;
    border-radius: 9px;
    padding: 11px;
    transition: .3s;
}

.health-character.eliminated {
    opacity: .4;
    filter: grayscale(1);
}

.health-name-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 7px;
}

.health-number {
    color: #91a6bc;
}

.health-bar {
    height: 14px;
    background: #05080d;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid #27384d;
}

.health-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg,#20d47a,#7cf2a8);
    transition: width .5s ease;
}

.health-fill.medium {
    background: linear-gradient(90deg,#e6a72e,#f7d66b);
}

.health-fill.low {
    background: linear-gradient(90deg,#d83245,#ff6978);
}

.eliminated-text {
    color: #ff5365;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-top: 5px;
}

.next-round-container {
    text-align: center;
    padding: 22px 0 5px;
}

.next-round-button {
    font-size: 18px;
    padding: 15px 40px;
    min-width: 230px;
}

/* RESPONSIVE */

@media(max-width: 750px) {

    .teams {
        grid-template-columns: 1fr;
    }

    .health-teams {
        grid-template-columns: 1fr;
    }

    .battle-hud-header {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 28px;
    }
}

</style>
</head>

<header>

    <h1>⚔️ SUPERHERO BATTLE SIMULATOR ⚔️</h1>

    <p>

    </p>

</header>


<!-- BATTLE SETTINGS -->

<div class="controls">

    </label>

        </option>

        </option>

        <option value="long">
            Long
        </option>

</div>


<!-- TEAMS -->

<div class="teams">

            🔵 TEAM 1

    </div>


    <div class="team">

    </div>

</div>


<div style="text-align:center;">

    <button
        class="primary"

        ⚔️ START BATTLE

</div>


<!-- HEALTH HUD -->

<section id="battleHUD" class="hidden">

        <div>

            <span class="hud-label">
                TEAM 1
            </span>

                🔵 TEAM 1
            </h2>

        </div>


        <div

            ROUND 1
        </div>


        <div>

            <span class="hud-label">
                TEAM 2
            </span>

                🔴 TEAM 2

        </div>

    </div>


    <div class="health-teams">

        <div
            id="healthTeam1"
            class="health-team"
        ></div>

        <div
            id="healthTeam2"
            class="health-team"

    </div>

</section>


<!-- BATTLE STORY -->

<div id="battle">

    <h2>Battle</h2>

    <p>
        Build both teams and start the battle!

</div>

/* =========================================================
   TEAMS
========================================================= */

let team1 = [];
let team2 = [];


/* =========================================================
   ADD RANDOM CHARACTER
========================================================= */

function addCharacter(team) {

    if (team === 1 && team1.length >= 5) {

        alert("Team 1 already has 5 characters!");

        return;
    }

    if (team === 2 && team2.length >= 5) {

        alert("Team 2 already has 5 characters!");

        return;
    }


    const alreadyUsed = [
        ...team1,
        ...team2
    ];


    const available =
        characters.filter(
            character =>
                !alreadyUsed.includes(character)
        );


    if (available.length === 0) {

        alert("There are no unused characters left.");

        return;
    }


    const randomCharacter =
        available[
            Math.floor(
                Math.random() * available.length
            )
        ];


    if (team === 1) {

        team1.push(randomCharacter);

    } else {

        team2.push(randomCharacter);

    }


    displayTeam(team);

}


/* =========================================================
   DISPLAY TEAM
========================================================= */

function displayTeam(team) {

    const list =
        team === 1
            ? team1
            : team2;


    const element =
        document.getElementById(
            team === 1
                ? "team1"
                : "team2"
        );


    element.innerHTML = "";


    list.forEach(
        (character,index) => {

            const div =
                document.createElement("div");


            div.className =
                "character";


            div.innerHTML =
                `${index + 1}. ${character}`;


            element.appendChild(div);

        }
    );

}


/* =========================================================
   BATTLE STATE
========================================================= */

let battleState = null;


/* =========================================================
   START BATTLE
========================================================= */

function startBattle() {

    if (
        team1.length === 0 ||
        team2.length === 0
    ) {

        alert(
            "Both teams need at least one character!"
        );

        return;
    }


    battleState = {

        round: 1,

        fighters1:
            team1.map(character => ({

                name: character,

                health: 100,

                eliminated: false

            })),

        fighters2:
            team2.map(character => ({

                name: character,

                health: 100,

                eliminated: false

            })),

        finished: false

    };


    document
        .getElementById("battleHUD")
        .classList
        .remove("hidden");


    renderHealthBars();


    document.getElementById("battle").innerHTML = `

        <h2>⚔️ BATTLE READY</h2>

        <p>
            The battlefield is established. Both teams
            stand ready and every combatant begins at full
            strength.
        </p>

        <p>
            The simulation will stop after every round.
            You decide when the next exchange begins.
        </p>

        <div class="next-round-container">

            <button
                class="primary next-round-button"
                onclick="simulateNextRound()"
            >
                ▶ SIMULATE ROUND 1
            </button>

        </div>

    `;

}


/* =========================================================
   HEALTH BAR DISPLAY
========================================================= */

function renderHealthBars() {

    const team1Element =
        document.getElementById(
            "healthTeam1"
        );

    const team2Element =
        document.getElementById(
            "healthTeam2"
        );


    team1Element.innerHTML = "";

    team2Element.innerHTML = "";


    battleState.fighters1.forEach(
        fighter => {

            team1Element.appendChild(
                createHealthBar(fighter)
            );

        }
    );


    battleState.fighters2.forEach(
        fighter => {

            team2Element.appendChild(
                createHealthBar(fighter)
            );

        }
    );


    document.getElementById(
        "roundDisplay"
    ).textContent =
        battleState.finished
            ? "BATTLE COMPLETE"
            : `ROUND ${battleState.round}`;

}


/* =========================================================
   CREATE HEALTH BAR
========================================================= */

function createHealthBar(fighter) {

    const container =
        document.createElement("div");


    container.className =
        "health-character";


    if (
        fighter.health <= 0
    ) {

        container.classList.add(
            "eliminated"
        );

    }


    const health =
        Math.max(
            0,
            fighter.health
        );


    let healthClass = "";


    if (health <= 25) {

        healthClass = "low";

    } else if (health <= 50) {

        healthClass = "medium";

    }


    container.innerHTML = `

        <div class="health-name-row">

            <span>
                ${fighter.name}
            </span>

            <span class="health-number">
                ${health} HP
            </span>

        </div>

        <div class="health-bar">

            <div
                class="health-fill ${healthClass}"
                style="width:${health}%"
            ></div>

        </div>

        ${
            health <= 0
                ?
            `
                <div class="eliminated-text">
                    ☠ ELIMINATED
                </div>
            `
                :
            ""
        }

    `;


    return container;

}


/* =========================================================
   RANDOM ITEM
========================================================= */

function randomItem(array) {

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}


/* =========================================================
   DAMAGE
========================================================= */

function getDamage(fighter) {

    /*
       Damage varies so the fights aren't
       identical every time.
    */

    return Math.floor(
        Math.random() * 18
    ) + 8;

}

/* =========================================================
   GET MOVE
========================================================= */

function getMove(name) {

    const moves =
        moveDatabase[name];


    if (
        !moves ||
        moves.length === 0
    ) {

        return "a powerful attack";

    }


    return randomItem(moves);

}


/* =========================================================
   SIMULATE ONE ROUND
========================================================= */

function simulateNextRound() {

    if (
        !battleState ||
        battleState.finished
    ) {

        return;

    }


    const round =
        battleState.round;


    let story = `

        <h2>
            ⚔️ ROUND ${round}
        </h2>

    `;


    /*
       TEAM 1 ATTACK
    */

    const livingTeam1 =
        battleState.fighters1.filter(
            fighter => fighter.health > 0
        );


    const livingTeam2 =
        battleState.fighters2.filter(
            fighter => fighter.health > 0
        );


    if (
        livingTeam1.length === 0 ||
        livingTeam2.length === 0
    ) {

        finishBattle();

        return;

    }


    const attacker1 =
        randomItem(livingTeam1);


    const target1 =
        randomItem(livingTeam2);


    const move1 =
        getMove(attacker1.name);


    const damage1 =
        getDamage(attacker1);


    target1.health =
        Math.max(
            0,
            target1.health - damage1
        );


    story += `

        <div class="round">

            <div class="round-title">
                🔵 TEAM 1 — OFFENSIVE ACTION
            </div>

            <p>
                <strong>${attacker1.name}</strong>
                takes the initiative. Rather than rushing
                directly into the opposing formation,
                the fighter adjusts their position and waits
                for a moment when
                <strong>${target1.name}</strong>
                is exposed.
            </p>

            <p>
                The opening appears.
                ${attacker1.name} immediately commits to
                <strong>${move1}</strong>.
                The attack is directed straight at
                ${target1.name}, forcing the defender to react
                under pressure.
            </p>

            <p>
                The strike lands for
                <strong>${damage1} damage</strong>.
                ${target1.name} remains standing with
                <strong>${target1.health} HP</strong>.
            </p>

    `;


    if (
        target1.health <= 0
    ) {

        target1.eliminated = true;

        story += `

            <p class="elimination">

                ☠ ${target1.name}
                has been eliminated from the battle.

            </p>

        `;

    }


    story += `</div>`;


    /*
       CHECK TEAM 2
    */

    if (
        battleState.fighters2.every(
            fighter => fighter.health <= 0
        )
    ) {

        battleState.finished = true;

        renderHealthBars();

        story += createWinnerScreen(
            "TEAM 1",
            battleState.fighters1
        );

        document.getElementById("battle").innerHTML =
            story;

        return;

    }


    /*
       TEAM 2 COUNTERATTACK
    */

    const livingTeam1Again =
        battleState.fighters1.filter(
            fighter => fighter.health > 0
        );


    const livingTeam2Again =
        battleState.fighters2.filter(
            fighter => fighter.health > 0
        );


    if (
        livingTeam1Again.length > 0 &&
        livingTeam2Again.length > 0
    ) {

        const attacker2 =
            randomItem(livingTeam2Again);


        const target2 =
            randomItem(livingTeam1Again);


        const move2 =
            getMove(attacker2.name);


        const damage2 =
            getDamage(attacker2);


        target2.health =
            Math.max(
                0,
                target2.health - damage2
            );


        story += `

            <div class="round">

                <div class="round-title">
                    🔴 TEAM 2 — COUNTERATTACK
                </div>

                <p>
                    Team 2 refuses to surrender the initiative.
                    <strong>${attacker2.name}</strong>
                    recognizes the disruption caused by the
                    previous exchange and immediately turns
                    the situation into an opportunity.
                </p>

                <p>
                    ${attacker2.name} closes the distance and
                    unleashes
                    <strong>${move2}</strong>
                    against
                    <strong>${target2.name}</strong>.
                </p>

                <p>
                    The counterattack deals
                    <strong>${damage2} damage</strong>.
                    ${target2.name} is left with
                    <strong>${target2.health} HP</strong>.
                </p>

        `;


        if (
            target2.health <= 0
        ) {

            target2.eliminated = true;

            story += `

                <p class="elimination">

                    ☠ ${target2.name}
                    has been eliminated from the battle.

                </p>

            `;

        }


        story += `</div>`;

    }


    /*
       UPDATE HUD
    */

    renderHealthBars();


    /*
       CHECK FOR TEAM ELIMINATION
    */

    const team1Alive =
        battleState.fighters1.some(
            fighter => fighter.health > 0
        );


    const team2Alive =
        battleState.fighters2.some(
            fighter => fighter.health > 0
        );


    if (!team1Alive) {

        battleState.finished = true;

        story += createWinnerScreen(
            "TEAM 2",
            battleState.fighters2
        );

        document.getElementById("battle").innerHTML =
            story;

        return;

    }


    if (!team2Alive) {

        battleState.finished = true;

        story += createWinnerScreen(
            "TEAM 1",
            battleState.fighters1
        );

        document.getElementById("battle").innerHTML =
            story;

        return;

    }


    /*
       ROUND COMPLETE
    */

    story += `

        <div class="round">

            <div class="round-title">
                ROUND ${round} COMPLETE
            </div>

            <p>
                The exchange ends without either side being
                completely broken. The surviving combatants
                pull apart, reassess the battlefield, and
                prepare themselves for the next engagement.
            </p>

            <p>
                The health displays above have been updated.
                When you are ready, continue to the next round.
            </p>

        </div>

    `;


    battleState.round++;


    story += `

        <div class="next-round-container">

            <button
                class="primary next-round-button"
                onclick="simulateNextRound()"
            >

                ▶ NEXT ROUND

            </button>

        </div>

    `;


    document.getElementById("battle").innerHTML =
        story;

}


/* =========================================================
   WINNER SCREEN
========================================================= */

function createWinnerScreen(
    winningTeam,
    survivors
) {

    return `

        <div class="winner">

            🏆 ${winningTeam} WINS

            <div style="
                font-size:15px;
                margin-top:14px;
                color:#d5e1ed;
                font-weight:normal;
            ">

                The opposing team has been completely
                eliminated from the battlefield.

                <br><br>

                <strong>Survivors:</strong>

                <br>

                ${survivors
                    .filter(
                        fighter =>
                            fighter.health > 0
                    )
                    .map(
                        fighter =>
                            `${fighter.name} (${fighter.health} HP)`
                    )
                    .join(", ")
                }

            </div>

        </div>

    `;

}


/* =========================================================
   FINISH BATTLE
========================================================= */

function finishBattle() {

    const team1Alive =
        battleState.fighters1.filter(
            fighter => fighter.health > 0
        );


    const team2Alive =
        battleState.fighters2.filter(
            fighter => fighter.health > 0
        );


    battleState.finished = true;


    renderHealthBars();


    const winner =
        team1Alive.length > 0
            ? "TEAM 1"
            : "TEAM 2";


    document.getElementById(
        "battle"
    ).innerHTML =

        createWinnerScreen(
            winner,
            winner === "TEAM 1"
                ? team1Alive
                : team2Alive
        );

}

</script>

</body>
</html>
