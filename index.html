<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC BATTLE SIMULATOR</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at center, #10252a 0%, #061114 35%, #020607 75%);
    color: #dffcff;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}

/* ARC REACTOR BACKGROUND */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(rgba(0,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,.035) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: -1;
}

.container {
    width: min(1400px, 94%);
    margin: auto;
    padding: 25px 0 60px;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 25px;
}

.arc-logo {
    width: 110px;
    height: 110px;
    margin: 0 auto 15px;
    border-radius: 50%;
    border: 3px solid #63f7ff;
    box-shadow:
        0 0 10px #00eaff,
        0 0 30px #00eaff,
        inset 0 0 20px #00eaff;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.arc-logo::before,
.arc-logo::after {
    content: "";
    position: absolute;
    border-radius: 50%;
}

.arc-logo::before {
    width: 72px;
    height: 72px;
    border: 3px solid #8fffff;
    box-shadow: 0 0 15px #00eaff;
}

.arc-logo::after {
    width: 35px;
    height: 35px;
    background: #dfffff;
    box-shadow:
        0 0 15px #00eaff,
        0 0 40px #00eaff;
}

h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 55px);
    letter-spacing: 8px;
    text-shadow: 0 0 15px #00eaff;
}

.subtitle {
    color: #71d9df;
    letter-spacing: 3px;
    font-size: 13px;
}

/* CONTROL PANEL */

.hud-panel {
    border: 1px solid #21cbd5;
    background: rgba(2, 18, 21, .88);
    box-shadow:
        0 0 20px rgba(0,234,255,.15),
        inset 0 0 25px rgba(0,234,255,.04);
    padding: 20px;
    position: relative;
}

.hud-panel::before {
    content: "";
    position: absolute;
    top: -1px;
    left: 20px;
    width: 120px;
    height: 2px;
    background: #8fffff;
    box-shadow: 0 0 10px #00eaff;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.control-group label {
    display: block;
    color: #61e8ef;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 7px;
}

select {
    width: 100%;
    background: #061316;
    border: 1px solid #168e98;
    color: #dffcff;
    padding: 12px;
    outline: none;
}

.generate {
    margin-top: 18px;
    width: 100%;
    padding: 16px;
    border: 1px solid #71faff;
    background: rgba(0, 205, 220, .12);
    color: #dfffff;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 4px;
    cursor: pointer;
    text-shadow: 0 0 8px #00eaff;
    box-shadow:
        0 0 12px rgba(0,234,255,.3),
        inset 0 0 12px rgba(0,234,255,.08);
    transition: .2s;
}

.generate:hover {
    background: rgba(0, 234, 255, .25);
    box-shadow:
        0 0 25px rgba(0,234,255,.5),
        inset 0 0 20px rgba(0,234,255,.15);
}

/* STATUS */

.status {
    margin: 18px 0;
    padding: 12px;
    text-align: center;
    border-left: 2px solid #00eaff;
    border-right: 2px solid #00eaff;
    color: #8deef4;
    letter-spacing: 2px;
    font-size: 13px;
}

/* TEAMS */

.teams {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.team {
    min-height: 260px;
}

.team-title {
    font-size: 20px;
    letter-spacing: 4px;
    margin-bottom: 15px;
    color: #9ffcff;
    border-bottom: 1px solid #147c84;
    padding-bottom: 10px;
}

.character-list {
    display: grid;
    gap: 10px;
}

.character {
    border: 1px solid #156e75;
    background: rgba(0, 10, 12, .8);
    padding: 13px;
    position: relative;
    overflow: hidden;
}

.character::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    height: 2px;
    width: 35%;
    background: #00eaff;
    box-shadow: 0 0 10px #00eaff;
}

.character-name {
    font-size: 17px;
    font-weight: bold;
}

.character-universe {
    font-size: 10px;
    color: #53bfc7;
    letter-spacing: 2px;
    margin-top: 3px;
}

/* SIMULATION */

.simulation {
    margin-top: 20px;
}

.match-header {
    text-align: center;
    margin-bottom: 15px;
}

.match-header h2 {
    letter-spacing: 4px;
    margin-bottom: 5px;
}

.matchup {
    color: #72dfe7;
}

.story {
    border: 1px solid #156e75;
    background: rgba(0, 9, 11, .86);
    padding: 25px;
    line-height: 1.8;
    font-size: 15px;
    box-shadow: inset 0 0 25px rgba(0,234,255,.03);
}

.story p {
    margin-top: 0;
    margin-bottom: 18px;
}

.winner {
    margin-top: 20px;
    border: 1px solid #6efaff;
    padding: 15px;
    text-align: center;
    letter-spacing: 3px;
    font-weight: bold;
    box-shadow: 0 0 20px rgba(0,234,255,.15);
}

.hidden {
    display: none;
}

@media (max-width: 800px) {
    .controls,
    .teams {
        grid-template-columns: 1fr;
    }

    h1 {
        letter-spacing: 4px;
    }
}
</style>
</head>

<body>

<div class="container">

<header class="header">

    <div class="arc-logo"></div>

    <h1>ARC BATTLE</h1>
    <div class="subtitle">TACTICAL CHARACTER SIMULATION SYSTEM</div>

</header>

<section class="hud-panel">

    <div class="controls">

        <div class="control-group">
            <label>SIMULATION MODE</label>

            <select id="mode">
                <option value="team">TEAM BATTLE</option>
                <option value="single">ONE AT A TIME</option>
            </select>
        </div>

        <div class="control-group">
            <label>STORY DETAIL</label>

            <select id="detail">

                <option value="detailed" selected>DETAILED — 150–300 WORDS</option>
                <option value="cinematic">CINEMATIC — 300–450 WORDS</option>
            </select>
        </div>

    </div>

    <button class="generate" id="generate">
        GENERATE 10
    </button>

</section>

<div class="status" id="status">
    SYSTEM READY — 10 CHARACTER SELECTIONS AVAILABLE
</div>

<section class="teams">

    <div class="team hud-panel">

    </div>

    <div class="team hud-panel">

</section>

<section class="simulation hud-panel hidden" id="simulation">

        <div class="matchup" id="matchup"></div>
    </div>

    <div class="story" id="story"></div>

    <div class="winner" id="winner"></div>

</section>

</div>

/* ============================================================
   GAME STATE
============================================================ */

let availableCharacters = [];
let team1 = [];
let team2 = [];
let selectionNumber = 0;


/* ============================================================
   RESET GAME
============================================================ */

function resetGame() {

    availableCharacters = [...characters];

    team1 = [];
    team2 = [];

    selectionNumber = 0;

    document.getElementById("team1").innerHTML = "";
    document.getElementById("team2").innerHTML = "";

    document.getElementById("simulation")
        .classList.add("hidden");

    updateStatus("SYSTEM READY — 10 CHARACTER SELECTIONS AVAILABLE");
}


/* ============================================================
   RANDOM CHARACTER
============================================================ */

function getRandomCharacter() {

    if (availableCharacters.length === 0) {
        return null;
    }

    const index = Math.floor(
        Math.random() * availableCharacters.length
    );

    const selected = availableCharacters[index];

    /*
       IMPORTANT:
       Once selected, character is removed from the available
       pool. Therefore duplicates cannot occur.
    */

    availableCharacters.splice(index, 1);

    return selected;
}

   CHARACTER DISPLAY
============================================================ */

function displayCharacter(character, team) {

    const div = document.createElement("div");

    div.className = "character";

    div.innerHTML = `
        <div class="character-name">
            ${character.name}
        </div>

        <div class="character-universe">
            ${character.universe}
        </div>
    `;

    document.getElementById(team).appendChild(div);
}


/* ============================================================
   GENERATE EXACTLY 10
============================================================ */

function generateTen() {

    resetGame();

    /*
       EXACTLY 10 selections.

       Team 1
       Team 2
       Team 1
       Team 2
       ...
    */

    for (let i = 0; i < 10; i++) {

        const character = getRandomCharacter();

        if (!character) break;

        selectionNumber++;

        if (selectionNumber % 2 === 1) {

            team1.push(character);

            displayCharacter(
                character,
                "team1"
            );

        } else {

            team2.push(character);

            displayCharacter(
                character,
                "team2"
            );
        }
    }

    updateStatus(
        "SELECTION COMPLETE — 10 UNIQUE CHARACTERS ASSIGNED"
    );

    simulateBattle();
}


/* ============================================================
   ONE AT A TIME
============================================================ */

function generateOne() {

    if (selectionNumber >= 10) {

        updateStatus(
            "ALL 10 CHARACTER SELECTIONS COMPLETE"
        );

        return;
    }

    if (selectionNumber === 0) {

        availableCharacters = [...characters];

        team1 = [];
        team2 = [];

        document.getElementById("team1").innerHTML = "";
        document.getElementById("team2").innerHTML = "";

        document.getElementById("simulation")
            .classList.add("hidden");
    }

    const character = getRandomCharacter();

    if (!character) return;

    selectionNumber++;

    if (selectionNumber % 2 === 1) {

        team1.push(character);

        displayCharacter(
            character,
            "team1"
        );

        updateStatus(
            `SELECTION ${selectionNumber}/10 — TEAM 1`
        );

    } else {

        team2.push(character);

        displayCharacter(
            character,
            "team2"
        );

        updateStatus(
            `SELECTION ${selectionNumber}/10 — TEAM 2`
        );
    }

    if (selectionNumber === 10) {

        updateStatus(
            "SELECTION COMPLETE — 10 UNIQUE CHARACTERS ASSIGNED"
        );

        simulateBattle();
    }
}


/* ============================================================
   POWER SCORE
============================================================ */

function totalPower(character) {

    return (
        character.power +
        character.durability +
        character.speed +
        character.range +
        character.skill +
        character.special
    );
}


/* ============================================================
   TEAM SCORE
============================================================ */

function teamPower(team) {

    return team.reduce(
        (total, character) =>
            total + totalPower(character),
        0
    );
}


/* ============================================================
   DETERMINE WINNER
============================================================ */

function determineWinner(teamA, teamB) {

    const scoreA = teamPower(teamA);
    const scoreB = teamPower(teamB);

    /*
       Small tactical variance prevents every matchup from
       being a completely deterministic spreadsheet result.
    */

    const tacticalA =
        Math.random() * 70;

    const tacticalB =
        Math.random() * 70;

    if (scoreA + tacticalA >= scoreB + tacticalB) {

        return {
            winner:"TEAM 1",
            team:teamA,
            scoreA,
            scoreB
        };

    }

    return {
        winner:"TEAM 2",
        team:teamB,
        scoreA,
        scoreB
    };
}


/* ============================================================
   GET BEST CHARACTER
============================================================ */

function strongest(team) {

    return [...team].sort(
        (a,b) =>
            totalPower(b) -
            totalPower(a)
    )[0];
}


/* ============================================================
   GET STORY LENGTH
============================================================ */

function storyLimits() {

    const detail =
        document.getElementById("detail").value;

    if (detail === "quick") {

        return {
            min:50,
            max:100
        };

    }

    if (detail === "cinematic") {

        return {
            min:300,
            max:450
        };

    }

    return {
        min:150,
        max:300
    };
}


/* ============================================================
   BUILD COMBAT STORY
============================================================ */

function buildBattleStory(teamA, teamB) {

    const strongestA = strongest(teamA);
    const strongestB = strongest(teamB);

    const result =
        determineWinner(teamA, teamB);

    const winnerTeam =
        result.winner === "TEAM 1"
            ? teamA
            : teamB;

    const loserTeam =
        result.winner === "TEAM 1"
            ? teamB
            : teamA;

    const winnerLead =
        strongest(winnerTeam);

    const loserLead =
        strongest(loserTeam);

    const limits = storyLimits();

    /*
       Team battle structure:

       1. Setup
       2. First exchanges
       3. Powers appear
       4. Cooperation
       5. Momentum shift
       6. Damage affects later actions
       7. Final exchange
    */

    let paragraphs = [];

    paragraphs.push(
        `The battlefield erupts as ${teamA.map(c => c.name).join(", ")} confront ${teamB.map(c => c.name).join(", ")}. Neither side immediately commits its strongest fighter. ${strongestA.name} begins probing the opposition while ${strongestB.name} answers by forcing the first exchange. The opening minutes become a contest of positioning, with faster fighters drawing attention while the heavier members search for a decisive opening.`
    );

    paragraphs.push(
        `${teamA[0].name} and ${teamB[0].name} collide first, but the battle quickly expands beyond a simple duel. ${teamA.map(c => c.name).join(" and ")} begin exploiting one another's strengths, creating openings instead of attacking independently. Across the field, ${teamB.map(c => c.name).join(", ")} respond by dividing their attention between defense and coordinated counterattacks.`
    );

    paragraphs.push(
        `${strongestA.name} finally unleashes ${strongestA.style}. The attack forces ${loserLead.name} to change tactics rather than absorb the full assault. Damaged fighters begin moving differently, slower members taking cover while more mobile characters attempt to draw attacks away from their weakened allies.`
    );

    paragraphs.push(
        `The momentum shifts when ${winnerLead.name} identifies the most dangerous remaining threat. Instead of pursuing an isolated target, the winning side concentrates its attacks, combining pressure from multiple directions. Defensive options disappear one by one as damaged characters lose mobility and their earlier strategies become harder to repeat.`
    );

    paragraphs.push(
        `The final exchange is no longer a chaotic clash. It becomes a calculated sequence built around the surviving fighters' abilities. ${winnerLead.name} creates the opening, allowing the rest of the team to capitalize immediately. ${loserLead.name} attempts one final counterattack, but the accumulated damage and loss of support leave the response incomplete.`
    );

    let story = paragraphs.join("\n\n");

    /*
       Adjust story length according to requested mode.
    */

    const words = story.split(/\s+/);

    if (words.length > limits.max) {

        story =
            words.slice(0, limits.max).join(" ") +
            ".";

    }

    return {
        story,
        winner:result.winner,
        winnerTeam
    };
}


/* ============================================================
   SIMULATE
============================================================ */

function simulateBattle() {

    if (
        team1.length !== 5 ||
        team2.length !== 5
    ) {
        return;
    }

    const battle =
        buildBattleStory(
            team1,
            team2
        );

    document.getElementById("simulation")
        .classList.remove("hidden");

    document.getElementById("matchup").textContent =
        `${team1.map(c => c.name).join(" • ")}
        VS
        ${team2.map(c => c.name).join(" • ")}`;

    /*
       Convert paragraphs into actual HTML paragraphs.
    */

    const paragraphs =
        battle.story
            .split("\n\n")
            .map(p => `<p>${p}</p>`)
            .join("");

    document.getElementById("story")
        .innerHTML = paragraphs;

    document.getElementById("winner")
        .textContent =
            `VICTOR: ${battle.winner}`;
}


/* ============================================================
   STATUS
============================================================ */

function updateStatus(text) {

    document.getElementById("status")
        .textContent = text;
}


/* ============================================================
   BUTTON
============================================================ */

document.getElementById("generate")
    .addEventListener("click", () => {

        const mode =
            document.getElementById("mode").value;

        if (mode === "single") {

            generateOne();

        } else {

            generateTen();
        }

    });


/* INITIAL STATE */

resetGame();

</script>
