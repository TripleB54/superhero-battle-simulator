* {

========================= */

    background: #151821;

/* =========================================================
   TEAM STORAGE
========================================================= */

let team1 = [];
let team2 = [];


/* =========================================================
   SETTINGS
========================================================= */

function getTeamSize() {

    return Number(
        document.getElementById("teamSize").value
    );

}


function getUniverse() {

    return document.getElementById(
        "universe"
    ).value;

}


function getVersionMode() {

    return document.getElementById(
        "versionMode"
    ).value;

}


function getDepth() {

    return document.getElementById(
        "depth"
    ).value;

}


/* =========================================================
   AVAILABLE CHARACTERS
========================================================= */

function getAvailableCharacters() {

    const universe =
        getUniverse();

    let pool =
        characters.filter(character => {

            if (
                universe === "Mixed"
            ) {

                return true;

            }

            return (
                character.universe === universe
            );

        });


    /*
        Remove characters already selected
        by either team.

        This creates the NO DUPLICATES rule.
    */

    const used =
        [
            ...team1,
            ...team2
        ].map(
            character =>
                character.name
        );


    pool =
        pool.filter(
            character =>
                !used.includes(
                    character.name
                )
        );


    return pool;

}


/* =========================================================
   ADD CHARACTER
========================================================= */

function addCharacter(teamNumber) {

    const size =
        getTeamSize();


    const team =
        teamNumber === 1
            ? team1
            : team2;


    if (
        team.length >= size
    ) {

        alert(
            `Team ${teamNumber} already has ${size} character${size > 1 ? "s" : ""}.`
        );

        return;

    }


    const pool =
        getAvailableCharacters();


    if (
        pool.length === 0
    ) {

        alert(
            "There are no more available characters in this pool."
        );

        return;

    }


    const base =
        randomItem(pool);


    let version;


    if (
        getVersionMode() === "Mixed"
    ) {

        version =
            Math.random() < .5
                ? "Standard"
                : "Amped";

    } else {

        version =
            getVersionMode();

    }


    const fighter = {

        ...base,

        version: version

    };


    if (
        teamNumber === 1
    ) {

        team1.push(fighter);

    } else {

        team2.push(fighter);

    }


    displayTeams();

}


/* =========================================================
   REMOVE CHARACTER
========================================================= */

function removeCharacter(
    teamNumber,
    index
) {

    if (
        teamNumber === 1
    ) {

        team1.splice(
            index,
            1
        );

    } else {

        team2.splice(
            index,
            1
        );

    }


    displayTeams();

}


/* =========================================================
   DISPLAY TEAMS
========================================================= */

function displayTeams() {

    const size =
        getTeamSize();


    document.getElementById(
        "team1Count"
    ).textContent =
        `${team1.length} / ${size}`;


    document.getElementById(
        "team2Count"
    ).textContent =
        `${team2.length} / ${size}`;


    displayTeam(
        1,
        team1
    );


    displayTeam(
        2,
        team2
    );

}


function displayTeam(
    teamNumber,
    team
) {

    const element =
        document.getElementById(
            `team${teamNumber}`
        );


    element.innerHTML = "";


    team.forEach(
        (fighter, index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "character";


            div.innerHTML = `

                <div>

                    <span class="character-name">
                        ${index + 1}. ${fighter.name}
                    </span>

                    <span class="version">
                        ${fighter.version}
                    </span>

                </div>

                <button
                    class="remove"
                    onclick="removeCharacter(${teamNumber}, ${index})">

                    ✕

                </button>

            `;


            element.appendChild(
                div
            );

        }
    );

}

/* =========================================================
   RANDOM
========================================================= */

function randomItem(array) {

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}


function randomNumber(
    min,
    max
) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}

/* =========================================================
   GET ACTION
========================================================= */

function getAction(
    fighter
) {

    if (
        actions[fighter.name]
    ) {

        return randomItem(
            actions[fighter.name]
        );

    }


    return "uses their abilities to attack and create an opening";

}


/* =========================================================
   CREATE FIGHTERS
========================================================= */

function createBattleFighters(
    team
) {

    return team.map(
        fighter => ({

            ...fighter,

            health: 100,

            active: true,

            momentum: 0,

            attacks: 0,

            knockouts: 0

        })
    );

}


/* =========================================================
   ACTIVE FIGHTERS
========================================================= */

function activeFighters(
    team
) {

    return team.filter(
        fighter =>
            fighter.active
    );

}


/* =========================================================
   TARGETING
========================================================= */

function chooseTarget(
    team
) {

    const active =
        activeFighters(team);


    if (
        active.length === 0
    ) {

        return null;

    }


    /*
        Intelligent targeting:
        usually target a weakened fighter,
        but sometimes target a powerful fighter.
    */

    const weakest =
        [...active].sort(
            (a,b) =>
                a.health -
                b.health
        )[0];


    const strongest =
        [...active].sort(
            (a,b) =>
                getPower(b) -
                getPower(a)
        )[0];


    const roll =
        Math.random();


    if (
        roll < .55
    ) {

        return weakest;

    }


    if (
        roll < .8
    ) {

        return strongest;

    }


    return randomItem(active);

}


/* =========================================================
   POWER
========================================================= */

function getPower(
    fighter
) {

    let power =

        fighter.strength * .25 +
        fighter.speed * .15 +
        fighter.durability * .2 +
        fighter.intelligence * .15 +
        fighter.combat * .25;


    if (
        fighter.version === "Amped"
    ) {

        power *= 1.18;

    }


    return power;

}


/* =========================================================
   DAMAGE
========================================================= */

function calculateDamage(
    attacker,
    defender
) {

    const attackerPower =
        getPower(attacker);


    const defenderPower =
        getPower(defender);


    let damage =
        8 +
        attackerPower / 8;


    damage -=
        defender.durability / 12;


    /*
        Speed advantage
    */

    if (
        attacker.speed >
        defender.speed + 15
    ) {

        damage += 5;

    }


    /*
        Combat advantage
    */

    if (
        attacker.combat >
        defender.combat + 15
    ) {

        damage += 4;

    }


    /*
        Amped bonus
    */

    if (
        attacker.version === "Amped"
    ) {

        damage *= 1.18;

    }


    /*
        Comeback mechanic
    */

    if (
        attacker.health < 35
    ) {

        damage *= 1.12;

    }


    /*
        Randomness
    */

    damage *=
        .8 +
        Math.random() * .4;


    return Math.max(
        5,
        Math.round(damage)
    );

}


/* =========================================================
   ATTACK
========================================================= */

function performAttack(
    attacker,
    defender
) {

    if (
        !attacker ||
        !defender ||
        !attacker.active ||
        !defender.active
    ) {

        return "";

    }


    attacker.attacks++;


    const action =
        getAction(attacker);


    let damage =
        calculateDamage(
            attacker,
            defender
        );


    /*
        Defense chance
    */

    const defenseChance =
        defender.speed * .002 +
        defender.combat * .001;


    if (
        Math.random() <
        defenseChance
    ) {

        damage =
            Math.floor(
                damage * .45
            );


        attacker.momentum += 1;


        return `

            <strong>${attacker.name}</strong>
            ${action}, but
            <strong>${defender.name}</strong>
            reads the attack and partially avoids it.
            Only a glancing blow connects.

        `;

    }


    defender.health =
        Math.max(
            0,
            defender.health -
            damage
        );


    attacker.momentum +=
        3;


    let story = `

        <strong>${attacker.name}</strong>
        ${action}.

        The attack catches
        <strong>${defender.name}</strong>
        and reduces their remaining fighting strength by
        approximately <strong>${damage}%</strong>.

    `;


    /*
        Knockout
    */

    if (
        defender.health <= 0
    ) {

        defender.health = 0;

        defender.active = false;

        attacker.knockouts++;

        attacker.momentum += 15;


        story += `

            <strong>${defender.name}
            is knocked out!</strong>

            The loss immediately changes the balance
            of the battle.

        `;


        return story;

    }


    /*
        Counterattack
    */

    const counterChance =
        .18 +
        defender.combat / 250;


    if (
        Math.random() <
        counterChance &&
        defender.active
    ) {

        const counterDamage =
            Math.round(
                5 +
                defender.combat / 10
            );


        attacker.health =
            Math.max(
                0,
                attacker.health -
                counterDamage
            );


        defender.momentum +=
            4;


        story += `

            But
            <strong>${defender.name}</strong>
            refuses to give up the exchange
            and immediately counters.

            <strong>${attacker.name}</strong>
            is forced backward and loses another
            <strong>${counterDamage}%</strong>
            of their remaining strength.

        `;


        if (
            attacker.health <= 0
        ) {

            attacker.health = 0;

            attacker.active = false;

            story += `

                <strong>${attacker.name}
                is knocked out by the counterattack!</strong>

            `;

        }

    }


    return story;

}


/* =========================================================
   TEAMWORK
========================================================= */

function teamwork(
    attackingTeam,
    defendingTeam
) {

    const attackers =
        activeFighters(
            attackingTeam
        );


    const defenders =
        activeFighters(
            defendingTeam
        );


    if (
        attackers.length < 2 ||
        defenders.length === 0
    ) {

        return "";

    }


    if (
        Math.random() > .5
    ) {

        return "";

    }


    const first =
        randomItem(
            attackers
        );


    const second =
        randomItem(
            attackers
        );


    const target =
        chooseTarget(
            defendingTeam
        );


    if (
        !target
    ) {

        return "";

    }


    const damage =
        Math.round(
            5 +
            (
                first.combat +
                second.combat
            ) / 25
        );


    target.health =
        Math.max(
            0,
            target.health -
            damage
        );


    first.momentum += 5;

    second.momentum += 5;


    let story = `

        <strong>TEAMWORK:</strong>
        ${first.name} and
        ${second.name}
        coordinate their attacks.

        One fighter forces
        <strong>${target.name}</strong>
        to react while the other exploits the opening.

        The coordinated assault causes another
        <strong>${damage}%</strong>
        loss of fighting strength.

    `;


    if (
        target.health <= 0
    ) {

        target.health = 0;

        target.active = false;


        story += `

            <strong>${target.name}
            is knocked out by the coordinated attack!</strong>

        `;

    }


    return story;

}


/* =========================================================
   ADAPTATION
========================================================= */

function adaptation(
    team1,
    team2,
    round
) {

    if (
        round < 2
    ) {

        return "";

    }


    if (
        Math.random() > .65
    ) {

        return "";

    }


    const all =
        [
            ...activeFighters(team1),
            ...activeFighters(team2)
        ];


    if (
        all.length === 0
    ) {

        return "";

    }


    const fighter =
        randomItem(all);


    fighter.momentum += 8;


    return `

        <strong>ADAPTATION:</strong>
        ${fighter.name}
        begins recognizing the opposing team's patterns.

        Instead of repeating the same strategy,
        ${fighter.name} changes position and begins
        anticipating the enemy's next move.

        The tactical adjustment gives their team
        a brief advantage.

    `;

}


/* =========================================================
   MOMENTUM
========================================================= */

function momentumDescription(
    team1,
    team2
) {

    const m1 =
        team1.reduce(
            (sum, fighter) =>
                sum + fighter.momentum,
            0
        );


    const m2 =
        team2.reduce(
            (sum, fighter) =>
                sum + fighter.momentum,
            0
        );


    if (
        m1 > m2 + 15
    ) {

        return "Team 1 has seized control of the momentum.";

    }


    if (
        m2 > m1 + 15
    ) {

        return "Team 2 has seized control of the momentum.";

    }


    return "Neither team has established a decisive advantage yet.";

}


/* =========================================================
   ROUND
========================================================= */

function generateRound(
    round,
    team1,
    team2
) {

    let story = `

        <div class="round">
            🔥 ROUND ${round}
        </div>

    `;


    const exchanges =
        round <= 2
            ? 3
            : round <= 5
                ? 4
                : 5;


    for (
        let i = 0;
        i < exchanges;
        i++
    ) {

        const attacking =
            i % 2 === 0
                ? team1
                : team2;


        const defending =
            i % 2 === 0
                ? team2
                : team1;


        const attacker =
            chooseTarget(
                attacking
            );


        const defender =
            chooseTarget(
                defending
            );


        if (
            !attacker ||
            !defender
        ) {

            break;

        }


        story += `

            <p class="battle-paragraph">

                ${performAttack(
                    attacker,
                    defender
                )}

            </p>

        `;


        if (
            activeFighters(team1).length === 0 ||
            activeFighters(team2).length === 0
        ) {

            break;

        }

    }


    /*
        Teamwork
    */

    const teamAttack1 =
        teamwork(
            team1,
            team2
        );


    if (
        teamAttack1
    ) {

        story += `

            <p class="battle-paragraph">
                ${teamAttack1}
            </p>

        `;

    }


    const teamAttack2 =
        teamwork(
            team2,
            team1
        );


    if (
        teamAttack2
    ) {

        story += `

            <p class="battle-paragraph">
                ${teamAttack2}
            </p>

        `;

    }


    /*
        Adaptation
    */

    const adaptationStory =
        adaptation(
            team1,
            team2,
            round
        );


    if (
        adaptationStory
    ) {

        story += `

            <p class="battle-paragraph">
                ${adaptationStory}
            </p>

        `;

    }


    story += `

        <p class="battle-paragraph">

            <strong>⚡ MOMENTUM:</strong>
            ${momentumDescription(
                team1,
                team2
            )}

        </p>

    `;


    return story;

}


/* =========================================================
   ROUND COUNT
========================================================= */

function getRoundCount() {

    const depth =
        getDepth();


    if (
        depth === "quick"
    ) {

        return 2;

    }


    if (
        depth === "standard"
    ) {

        return 4;

    }


    if (
        depth === "detailed"
    ) {

        return 7;

    }


    return 10;

}


/* =========================================================
   BATTLE RESULT
========================================================= */

function determineWinner(
    team1,
    team2
) {

    const alive1 =
        activeFighters(team1);


    const alive2 =
        activeFighters(team2);


    /*
        If one team is eliminated,
        they automatically lose.
    */

    if (
        alive1.length === 0
    ) {

        return {
            winner: team2,
            loser: team1,
            name: "TEAM 2"
        };

    }


    if (
        alive2.length === 0
    ) {

        return {
            winner: team1,
            loser: team2,
            name: "TEAM 1"
        };

    }


    /*
        Otherwise calculate total
        remaining strength + momentum.
    */

    const score1 =
        getTeamScore(team1);


    const score2 =
        getTeamScore(team2);


    if (
        score1 >= score2
    ) {

        return {
            winner: team1,
            loser: team2,
            name: "TEAM 1"
        };

    }


    return {
        winner: team2,
        loser: team1,
        name: "TEAM 2"
    };

}


function getTeamScore(
    team
) {

    return team.reduce(
        (
            total,
            fighter
        ) => {

            if (
                !fighter.active
            ) {

                return total;

            }


            return total +
                fighter.health +
                fighter.momentum * 1.5 +
                getPower(fighter) * .35;

        },
        0
    );

}


/* =========================================================
   FINAL SHOWDOWN
========================================================= */

function finalShowdown(
    winner,
    loser,
    winnerName
) {

    const remaining =
        activeFighters(
            winner
        );


    const defeated =
        loser.filter(
            fighter =>
                !fighter.active
        );


    if (
        remaining.length === 0
    ) {

        return "";

    }


    const hero =
        [...remaining].sort(
            (a,b) =>
                b.health -
                a.health
        )[0];


    let story = `

        <div class="round">
            ⚡ FINAL SHOWDOWN
        </div>

        <p class="battle-paragraph">

            The battlefield has become almost silent.

            After the chaos of the previous rounds,
            only a handful of fighters remain standing.

            The opposing team makes one final attempt
            to turn the battle around.

        </p>

        <p class="battle-paragraph">

            <strong>${hero.name}</strong>
            steps forward.

            The fighter has already endured the worst
            the opposing team could throw at them,
            and there is no intention of backing down now.

            ${getAction(hero)}.

            The decisive exchange finally breaks
            the remaining resistance.

        </p>

    `;


    if (
        defeated.length > 0
    ) {

        story += `

            <p class="battle-paragraph">

                The defeated fighters can no longer
                continue.

                ${winnerName}
                has survived the battle and remains
                in control of the battlefield.

            </p>

        `;

    }


    return story;

}

                ${fighter.active
                    ? fighter.name
                    : `<span class="defeated">${fighter.name}</span>`
                }

                —
                ${fighter.health}% strength

                <br>

            `;

        }
    );


    html += `</p>`;


    return html;

}


/* =========================================================
   START BATTLE
========================================================= */

function startBattle() {

    const size =
        getTeamSize();


    if (
        team1.length !== size ||
        team2.length !== size
    ) {

        alert(
            `Both teams need exactly ${size} character${size > 1 ? "s" : ""}.`
        );

        return;

    }


    const fighterTeam1 =
        createBattleFighters(
            team1
        );


    const fighterTeam2 =
        createBattleFighters(
            team2
        );


    const battlefield =
        randomItem(
            battlefields
        );


    const rounds =
        getRoundCount();


    let html = `

        <div class="battle-title">
            ⚔️ BATTLE SIMULATION
        </div>

        <div class="battle-subtitle">

            ${size}v${size}
            •
            ${getUniverse()}
            •
            ${getVersionMode()}
            •
            ${getDepth().toUpperCase()}

        </div>


        <div class="round">
            🏟️ BATTLEFIELD
        </div>


        <p class="battle-paragraph">

            <strong>
                ${battlefield.name}
            </strong>

            <br><br>

            ${battlefield.description}

        </p>


        <div class="round">
            ⚔️ THE TEAMS ARRIVE
        </div>


        <p class="battle-paragraph">

            <strong>TEAM 1:</strong>

            ${team1
                .map(
                    fighter =>
                        `${fighter.name} (${fighter.version})`
                )
                .join(", ")}

            <br><br>

            <strong>TEAM 2:</strong>

            ${team2
                .map(
                    fighter =>
                        `${fighter.name} (${fighter.version})`
                )
                .join(", ")}

        </p>


        <p class="battle-paragraph">

            Both teams take their positions.

            The fighters study their opponents,
            looking for weaknesses and deciding
            who represents the biggest threat.

            There is no guarantee that the strongest
            fighter will be the deciding factor.

            Speed, intelligence, teamwork and the
            ability to adapt could change everything.

            Then the battle begins.

        </p>

    `;


    /*
        ROUNDS
    */

    for (
        let round = 1;
        round <= rounds;
        round++
    ) {

        if (
            activeFighters(
                fighterTeam1
            ).length === 0 ||
            activeFighters(
                fighterTeam2
            ).length === 0
        ) {

            break;

        }


        html +=
            generateRound(
                round,
                fighterTeam1,
                fighterTeam2
            );


        /*
            Show battle status periodically.
        */

        if (
            round === 2 ||
            round === 5 ||
            round === 8
        ) {

            html +=
                battleStatus(
                    fighterTeam1,
                    fighterTeam2
                );

        }

    }


    /*
        Winner
    */

    const result =
        determineWinner(
            fighterTeam1,
            fighterTeam2
        );


    html +=
        finalShowdown(
            result.winner,
            result.loser,
            result.name
        );


    /*
        Final status
    */

    html +=
        battleStatus(
            fighterTeam1,
            fighterTeam2
        );


    html += `

        <div class="round">
            🏆 FINAL RESULT
        </div>


        <p class="battle-paragraph">

            The battle has reached its conclusion.

            After multiple rounds of attacks,
            counters, tactical adjustments and
            team-based strategies,

            <strong>
                ${result.name}
            </strong>

            has the advantage.

        </p>


        <div class="winner">

            🏆 ${result.name} WINS!

        </div>

    `;


    document.getElementById(
        "battle"
    ).innerHTML =
        html;


    /*
        Scroll to battle.
    */

    document.getElementById(
        "battle"
    ).scrollIntoView({
        behavior: "smooth"
    });

}


/* =========================================================
   SETTINGS CHANGE
========================================================= */

document.getElementById(
    "teamSize"
).addEventListener(
    "change",
    () => {

        /*
            If the user lowers the team size,
            remove excess characters.
        */

        const size =
            getTeamSize();


        if (
            team1.length > size
        ) {

            team1 =
                team1.slice(
                    0,
                    size
                );

        }


        if (
            team2.length > size
        ) {

            team2 =
                team2.slice(
                    0,
                    size
                );

        }


        displayTeams();

    }
);


/*
    Changing the universe can make an
    existing character invalid.

    We leave existing teams alone so the
    user doesn't unexpectedly lose selections.
*/

document.getElementById(
    "universe"
).addEventListener(
    "change",
    displayTeams
);


document.getElementById(
    "versionMode"
).addEventListener(
    "change",
    displayTeams
);


/* =========================================================
   INITIAL DISPLAY
========================================================= */

displayTeams();

</script>

</body>
</html>
