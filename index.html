<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Character Battle</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --hud-blue: #66d9ff;
    --hud-blue-dark: #163c4d;
    --hud-cyan: #9df0ff;
    --hud-red: #ff6670;
    --hud-green: #67ffb1;
    --hud-bg: #050a0f;
    --hud-panel: rgba(7, 15, 21, .94);
    --hud-border: rgba(102, 217, 255, .35);
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 50% -10%, #123044 0%, #071017 35%, #020407 75%);
    color: white;
    overflow-x: hidden;
}

/* =========================================================
   ARC REACTOR / HUD BACKGROUND
   ========================================================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(rgba(102,217,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(102,217,255,.025) 1px, transparent 1px);
    background-size: 45px 45px;
    z-index: -2;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at center, transparent 35%, rgba(0,0,0,.65) 100%);
    z-index: -1;
}

.container {
    width: min(1250px, 94%);
    margin: auto;
    padding: 25px 0 60px;
}

/* =========================================================
   HEADER
   ========================================================= */

header {
    text-align: center;
    margin-bottom: 25px;
}

.arc-reactor {
    width: 105px;
    height: 105px;
    margin: 5px auto 15px;
    border-radius: 50%;
    position: relative;
    border: 2px solid var(--hud-blue);
    box-shadow:
        0 0 10px var(--hud-blue),
        0 0 35px rgba(102,217,255,.5),
        inset 0 0 25px rgba(102,217,255,.25);
    animation: reactorPulse 2.5s infinite ease-in-out;
}

.arc-reactor::before {
    content: "";
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 2px solid rgba(157,240,255,.7);
}

.arc-reactor::after {
    content: "";
    position: absolute;
    width: 34px;
    height: 34px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: var(--hud-cyan);
    box-shadow:
        0 0 10px var(--hud-cyan),
        0 0 30px var(--hud-blue),
        0 0 60px rgba(102,217,255,.7);
}

@keyframes reactorPulse {
    0%,100% {
        transform: scale(1);
        box-shadow:
            0 0 10px var(--hud-blue),
            0 0 35px rgba(102,217,255,.5);
    }

    50% {
        transform: scale(1.04);
        box-shadow:
            0 0 15px var(--hud-blue),
            0 0 55px rgba(102,217,255,.75);
    }
}

header h1 {
    font-size: clamp(32px, 5vw, 58px);
    margin: 0;
    letter-spacing: 4px;
    color: var(--hud-cyan);
    text-shadow:
        0 0 10px rgba(102,217,255,.65),
        0 0 30px rgba(102,217,255,.25);
}

header p {
    color: #86a8b7;
    letter-spacing: 1px;
}

/* =========================================================
   PANELS
   ========================================================= */

.panel {
    position: relative;
    background:
        linear-gradient(
            145deg,
            rgba(11,24,32,.96),
            rgba(4,9,13,.96)
        );
    border: 1px solid var(--hud-border);
    padding: 20px;
    margin-bottom: 20px;
    box-shadow:
        0 0 0 1px rgba(102,217,255,.04),
        0 12px 45px rgba(0,0,0,.55),
        inset 0 0 30px rgba(102,217,255,.025);
    clip-path: polygon(
        0 10px,
        10px 0,
        calc(100% - 10px) 0,
        100% 10px,
        100% calc(100% - 10px),
        calc(100% - 10px) 100%,
        10px 100%,
        0 calc(100% - 10px)
    );
}

.panel::before {
    content: "SYSTEM ONLINE";
    position: absolute;
    right: 18px;
    top: 5px;
    font-size: 8px;
    letter-spacing: 2px;
    color: rgba(103,255,177,.55);
}

/* =========================================================
   BUTTONS
   ========================================================= */

button {
    border: 1px solid var(--hud-border);
    padding: 13px 20px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
    font-size: 14px;
    letter-spacing: 1px;
    background: #0b1b24;
    color: var(--hud-cyan);
    clip-path: polygon(
        0 7px,
        7px 0,
        calc(100% - 7px) 0,
        100% 7px,
        100% calc(100% - 7px),
        calc(100% - 7px) 100%,
        7px 100%,
        0 calc(100% - 7px)
    );
}

button:hover {
    transform: translateY(-2px);
    background: #102d3a;
    box-shadow: 0 0 18px rgba(102,217,255,.3);
}

.primary {
    background: #123949;
    color: white;
    border-color: var(--hud-blue);
    box-shadow: 0 0 12px rgba(102,217,255,.15);
}

.secondary {
    background: #0a151c;
}

.danger {
    background: #40161b;
    border-color: var(--hud-red);
    color: #ff9ba0;
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

.status {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin: 20px 0;
    color: var(--hud-cyan);
    letter-spacing: 1px;
}

.selection-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px;
}

/* =========================================================
   CHARACTER CARDS
   ========================================================= */

.character-card {
    position: relative;
    background:
        linear-gradient(145deg, #10202a, #071017);
    border: 1px solid #285365;
    padding: 16px;
    cursor: pointer;
    min-height: 190px;
    transition: .2s;
    overflow: hidden;
}

.character-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 3px;
    height: 100%;
    background: var(--hud-blue);
    box-shadow: 0 0 12px var(--hud-blue);
}

.character-card:hover {
    transform: translateY(-4px);
    border-color: var(--hud-blue);
    box-shadow:
        0 0 20px rgba(102,217,255,.18),
        inset 0 0 20px rgba(102,217,255,.05);
}

.character-card h3 {
    margin: 0 0 7px;
    font-size: 19px;
    color: white;
}

.character-card .universe {
    color: var(--hud-blue);
    font-size: 11px;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.character-card .type {
    font-size: 11px;
    color: #b5cad4;
}

.character-card .abilities {
    margin-top: 10px;
    color: #7895a1;
    font-size: 11px;
    line-height: 1.5;
}

.character-card .combat-role {
    margin-top: 9px;
    color: var(--hud-green);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.character-card.picked {
    opacity: .16;
    pointer-events: none;
    transform: scale(.97);
}

/* =========================================================
   TEAMS
   ========================================================= */

.teams {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.team {
    min-height: 180px;
    padding: 18px;
    background: rgba(4,10,14,.8);
    border: 1px solid #294653;
}

.team1 {
    border-color: rgba(102,217,255,.35);
}

.team2 {
    border-color: rgba(255,102,112,.35);
}

.team h2 {
    margin-top: 0;
    letter-spacing: 2px;
}

.team1 h2 {
    color: var(--hud-blue);
}

.team2 h2 {
    color: var(--hud-red);
}

.team-member {
    background: #0b171e;
    border-left: 3px solid var(--hud-blue);
    padding: 10px 12px;
    margin: 7px 0;
}

.team2 .team-member {
    border-left-color: var(--hud-red);
}

.team-member strong {
    color: white;
}

.team-member small {
    color: #75919d;
}

/* =========================================================
   STORY
   ========================================================= */

.story-controls {
    text-align: center;
}

.story-controls h2 {
    letter-spacing: 3px;
    color: var(--hud-cyan);
}

.mode-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 15px;
}

.mode-buttons button.active {
    background: #123949;
    border-color: var(--hud-blue);
    box-shadow: 0 0 12px rgba(102,217,255,.25);
}

#battleMeta {
    color: #7895a1;
    text-align: center;
    margin-bottom: 15px;
}

.story-box {
    line-height: 1.8;
    font-size: 17px;
    background:
        linear-gradient(145deg, #071017, #03070a);
    border: 1px solid #294653;
    padding: 25px;
    min-height: 130px;
    white-space: pre-wrap;
    box-shadow: inset 0 0 25px rgba(102,217,255,.025);
}

/* =========================================================
   ONE AT A TIME
   ========================================================= */

.one-character {
    text-align: center;
    padding: 35px;
}

.one-character h2 {
    font-size: 40px;
    margin: 10px 0;
    color: var(--hud-cyan);
}

#singleUniverse {
    color: var(--hud-blue);
    margin-bottom: 15px;
}

#singleDescription {
    color: #91aab5;
    max-width: 750px;
    margin: auto;
    line-height: 1.6;
}

.stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-top: 20px;
}

.stat {
    background: #09151c;
    border: 1px solid #203b47;
    padding: 12px;
}

.stat strong {
    display: block;
    color: #718e99;
    font-size: 10px;
    text-transform: uppercase;
    margin-bottom: 5px;
}

.hidden {
    display: none !important;
}

@media (max-width: 700px) {
    .teams {
        grid-template-columns: 1fr;
    }

    .story-box {
        font-size: 15px;
    }

    .arc-reactor {
        width: 80px;
        height: 80px;
    }
}
</style>
</head>

/* =========================================================
   GAME STATE
========================================================= */

let generated = [];
let team1 = [];
let team2 = [];

let currentTeam = 1;

let storyMode = "quick";

let oneMode = false;


/* =========================================================
   RANDOM HELPERS
========================================================= */

function shuffle(array) {

    return [...array].sort(
        () => Math.random() - 0.5
    );

}


function randomItem(array) {

    if (!array || array.length === 0) {
        return "";
    }

    return array[
        Math.floor(Math.random() * array.length)
    ];

}


/* =========================================================
   GENERATE EXACTLY 10
========================================================= */

function generateTen() {

    team1 = [];
    team2 = [];

    currentTeam = 1;

    /*
       IMPORTANT:
       This always creates exactly 10 unique references.
    */

    generated = shuffle(characters).slice(0,10);

    renderSelection();

    renderTeams();

    document.getElementById("status").innerText =
        "TEAM 1 PICKS FIRST — SELECT A CHARACTER.";

    document.getElementById("battleMeta").innerText =
        "10 UNIQUE FIGHTERS GENERATED • ALTERNATING DRAFT ACTIVE";

    document.getElementById("storyBox").innerText =
        "Build both teams to begin the battle.";

}


/* =========================================================
   RENDER CHARACTER SELECTION
========================================================= */

function renderSelection() {

    const grid =
        document.getElementById("selectionGrid");

    grid.innerHTML = "";

    generated.forEach((character,index) => {

        const card =
            document.createElement("div");

        card.className =
            "character-card";

        const alreadyPicked =
            team1.includes(character) ||
            team2.includes(character);

        if (alreadyPicked) {

            card.classList.add("picked");

        }

        card.innerHTML = `

            <h3>${character.name}</h3>

            <div class="universe">
                ${character.universe} • ${character.type}
            </div>

            <div class="type">

                STR ${character.stats.strength}
                • SPD ${character.stats.speed}
                • DUR ${character.stats.durability}

            </div>

            <div class="abilities">

                ${character.abilities}

            </div>

            <div class="combat-role">

                ${getCombatRole(character)}

            </div>
        `;

        if (!alreadyPicked) {

            card.onclick =
                () => pickCharacter(index);

        }

        grid.appendChild(card);

    });

}


/* =========================================================
   COMBAT ROLE
========================================================= */

function getCombatRole(character) {

    if (
        character.stats.power >= 95 &&
        character.stats.durability >= 90
    ) {

        return "HIGH POWER COMBATANT";

    }

    if (
        character.stats.speed >= 90
    ) {

        return "HIGH MOBILITY";

    }

    if (
        character.stats.intelligence >= 90
    ) {

        return "TACTICAL / INTELLIGENCE";

    }

    if (
        character.abilities.toLowerCase().includes("magic") ||
        character.abilities.toLowerCase().includes("sorcery")
    ) {

        return "MYSTICAL COMBATANT";

    }

    return "VERSATILE COMBATANT";

}


/* =========================================================
   ALTERNATING DRAFT
========================================================= */

function pickCharacter(index) {

    const character =
        generated[index];

    if (!character) {
        return;
    }

    if (
        team1.includes(character) ||
        team2.includes(character)
    ) {

        return;

    }


    if (currentTeam === 1) {

        team1.push(character);

        currentTeam = 2;

    } else {

        team2.push(character);

        currentTeam = 1;

    }


    renderSelection();

    renderTeams();


    const remaining =
        generated.length -
        team1.length -
        team2.length;


    if (remaining === 0) {

        document.getElementById("status").innerText =
            "ALL 10 CHARACTERS HAVE BEEN PICKED.";

        document.getElementById("battleMeta").innerText =
            `TEAM 1: ${team1.length} • TEAM 2: ${team2.length} • DRAFT COMPLETE`;

    } else {

        document.getElementById("status").innerText =
            `TEAM ${currentTeam} PICKS — ${remaining} REMAINING`;

    }

}

            <strong>
                ${character.name}
            </strong>

            <br>

            <small>

            </small>

        `;

        t2.appendChild(div);

    });

}


/* =========================================================
   STORY MODE
========================================================= */

function setStoryMode(mode,button) {

    storyMode = mode;

    document
        .querySelectorAll(".mode-buttons button")
        .forEach(btn => {

            btn.classList.remove("active");

        });

    button.classList.add("active");

}


/* =========================================================
   START BATTLE
========================================================= */

function startBattle() {

    if (
        team1.length === 0 ||
        team2.length === 0
    ) {

        document.getElementById("storyBox").innerText =
            "Both teams need at least one fighter before the battle can begin.";

        return;

    }


    const story =
        createBattleStory(
            team1,
            team2,
            storyMode
        );


    document.getElementById("storyBox").innerText =
        story;


    document.getElementById("battleMeta").innerText =
        `${storyMode.toUpperCase()} MODE • ${team1.length} VS ${team2.length}`;

}


/* =========================================================
   BATTLE STORY ENGINE
========================================================= */

function createBattleStory(a,b,mode) {

    const strongestA =
        strongest(a);

    const strongestB =
        strongest(b);


    const fastA =
        fastest(a);

    const fastB =
        fastest(b);


    const smartA =
        smartest(a);

    const smartB =
        smartest(b);


    /*
       Check whether any direct matchup relationship
       exists between fighters.

       This is what allows your detailed matchup data
       to actually influence the story.
    */

    const matchupInfo =
        findImportantMatchup(a,b);


    const opening =
        openingParagraph(
            a,
            b
        );


    const exchange =
        exchangeParagraph(
            a,
            b,
            strongestA,
            strongestB,
            matchupInfo
        );


    const abilities =
        abilityParagraph(
            a,
            b,
            strongestA,
            strongestB,
            matchupInfo
        );


    const tactics =
        tacticalParagraph(
            smartA,
            smartB,
            a,
            b,
            matchupInfo
        );


    const turning =
        turningPointParagraph(
            a,
            b,
            strongestA,
            strongestB,
            matchupInfo
        );


    const ending =
        endingParagraph(
            a,
            b,
            strongestA,
            strongestB,
            matchupInfo
        );


    if (mode === "quick") {

        return fitWords(

            [
                opening,
                exchange,
                ending
            ].join(" "),

            50,
            100

        );

    }


    if (mode === "detailed") {

        return fitWords(

            [
                opening,
                exchange,
                abilities,
                tactics,
                ending
            ].join("\n\n"),

            150,
            300

        );

    }


    return fitWords(

        [
            opening,
            exchange,
            abilities,
            tactics,
            turning,
            ending
        ].join("\n\n"),

        300,
        450

    );

}


/* =========================================================
   MATCHUP DETECTION
========================================================= */

function findImportantMatchup(a,b) {

    for (const fighterA of a) {

        for (const fighterB of b) {

            const key =
                matchupKey(
                    fighterA,
                    fighterB
                );

            if (matchups[key]) {

                return {
                    fighterA,
                    fighterB,
                    data:matchups[key]
                };

            }

        }

    }

    return null;

}


/* =========================================================
   OPENING
========================================================= */

function openingParagraph(a,b) {

    const firstA =
        randomItem(a);

    const firstB =
        randomItem(b);


    const environments = [

        "a shattered industrial district surrounded by abandoned towers",

        "a massive city block scarred by previous battles",

        "a ruined battlefield beneath a dark sky",

        "an empty metropolis filled with abandoned structures",

        "a vast canyon surrounded by broken stone",

        "a deserted facility containing narrow corridors and open chambers",

        "a wide battlefield filled with wreckage and broken machinery"

    ];


    const environment =
        randomItem(environments);


    return `The battlefield was ${environment}. ${firstA.name} moved first, immediately adopting a fighting posture suited to the opponent rather than blindly charging. Across the battlefield, ${firstB.name} reacted in a way that reflected their own instincts, forcing both teams to reveal their opening positions.`;

}


/* =========================================================
   EXCHANGES
========================================================= */

function exchangeParagraph(
    a,
    b,
    strongestA,
    strongestB,
    matchupInfo
) {

    if (matchupInfo) {

        const x =
            matchupInfo.fighterA;

        const y =
            matchupInfo.fighterB;

        const data =
            matchupInfo.data;


        return `${x.name} immediately recognized the danger posed by ${y.name}. ${data.behaviorA} Meanwhile, ${data.behaviorB} Their abilities collided in a way that made a normal exchange impossible, forcing both fighters to change tactics after the first sequence.`;

    }


    const fighterA =
        randomItem(a);

    const fighterB =
        randomItem(b);


    return `${fighterA.name} attacked first, using ${fighterA.fightingStyle.toLowerCase()} rather than relying on raw statistics alone. ${fighterB.name} responded with ${fighterB.fightingStyle.toLowerCase()}, turning the opening exchange into a test of timing and positioning. Neither fighter could repeat the same approach after the first attack revealed what the other side could do.`;

}


/* =========================================================
   ABILITIES
========================================================= */

function abilityParagraph(
    a,
    b,
    strongestA,
    strongestB,
    matchupInfo
) {

    if (matchupInfo) {

        const data =
            matchupInfo.data;

        const x =
            matchupInfo.fighterA;

        const y =
            matchupInfo.fighterB;


        return `${x.name} began exploiting ${data.aCounters.join(", ").toLowerCase()}, while ${y.name} answered with ${data.bCounters.join(", ").toLowerCase()}. The exchange forced both fighters to adapt, because each successful attack changed what became possible on the next move.`;

    }


    const fighterA =
        strongestA;

    const fighterB =
        strongestB;


    return `${fighterA.name} began relying on ${randomItem(fighterA.counters).toLowerCase()}, forcing ${fighterB.name} to respond with ${randomItem(fighterB.counters).toLowerCase()}. Their abilities did not operate independently; each successful attack changed positioning, damage, and the options available during the next exchange.`;

}


/* =========================================================
   TACTICAL PARAGRAPH
========================================================= */

function tacticalParagraph(
    smartA,
    smartB,
    a,
    b,
    matchupInfo
) {

    const supportA =
        randomItem(a);

    const supportB =
        randomItem(b);


    if (matchupInfo) {

        const data =
            matchupInfo.data;


        return `The battle became increasingly tactical. ${smartA.name} recognized that ${supportA.name} could create an opening if Team 1 changed its formation, while ${smartB.name} attempted to prevent that setup. ${data.reversal} Both sides adjusted their behavior, with the fighters beginning to cooperate instead of acting as isolated one-on-one combatants.`;

    }


    return `${smartA.name} began reading the battlefield and changed Team 1's formation. ${supportA.name} created pressure from another angle, forcing ${smartB.name} to react before Team 2 could isolate a target. ${supportB.name} answered by disrupting the new formation, turning the battle into a constantly changing exchange of counters and positioning.`;

}


/* =========================================================
   TURNING POINT
========================================================= */

function turningPointParagraph(
    a,
    b,
    strongestA,
    strongestB,
    matchupInfo
) {

    const scoreA =
        teamPower(a);

    const scoreB =
        teamPower(b);


    if (matchupInfo) {

        const data =
            matchupInfo.data;


        if (
            data.advantage
                .toLowerCase()
                .includes(strongestA.name.toLowerCase())
        ) {

            return `${strongestA.name} finally created the opening predicted by the matchup analysis. The opposing fighter had been forced into a position where their normal counter was no longer reliable. Team 1 immediately capitalized, combining pressure with positioning instead of allowing the opponent time to recover.`;

        }


        return `${strongestB.name} finally created the opening predicted by the matchup analysis. Team 2 recognized the shift in momentum and coordinated around it, forcing Team 1 to defend while the earlier damage began affecting their ability to maintain pressure.`;

    }


    if (scoreA >= scoreB) {

        return `${strongestA.name} found the decisive opening after Team 1's earlier attacks had gradually forced Team 2 into a weaker position. Instead of simply attacking harder, Team 1 coordinated its abilities and converted the accumulated advantage into a decisive sequence.`;

    }


    return `${strongestB.name} found the decisive opening after Team 2's earlier attacks had gradually weakened Team 1's formation. The team immediately coordinated around that opening, converting accumulated damage and positioning into a decisive counterattack.`;

}


/* =========================================================
   ENDING
========================================================= */

function endingParagraph(
    a,
    b,
    strongestA,
    strongestB,
    matchupInfo
) {

    const scoreA =
        teamPower(a);

    const scoreB =
        teamPower(b);


    let winner;

    let finalFighter;


    if (scoreA >= scoreB) {

        winner = "Team 1";

        finalFighter =
            strongestA;

    } else {

        winner = "Team 2";

        finalFighter =
            strongestB;

    }


    /*
       If a matchup has a very strong advantage,
       give that advantage additional influence.
    */

    if (matchupInfo) {

        const data =
            matchupInfo.data;

        if (
            data.advantage
                .toLowerCase()
                .includes(matchupInfo.fighterA.name.toLowerCase())
        ) {

            if (team1.includes(matchupInfo.fighterA)) {

                winner = "Team 1";

                finalFighter =
                    matchupInfo.fighterA;

            }

        }

        if (
            data.advantage
                .toLowerCase()
                .includes(matchupInfo.fighterB.name.toLowerCase())
        ) {

            if (team2.includes(matchupInfo.fighterB)) {

                winner = "Team 2";

                finalFighter =
                    matchupInfo.fighterB;

            }

        }

    }


    return `The final exchange came down to timing, accumulated damage, and the abilities that remained available. ${finalFighter.name} found the decisive opening and committed to the attack while the rest of ${winner} maintained pressure. The opposing team could no longer recover its formation, and after the last exchange the battlefield finally went quiet. ${winner} stood victorious.`;

}


/* =========================================================
   CHARACTER ANALYSIS
========================================================= */

function powerScore(c) {

    return (

        c.stats.strength * 1.25 +

        c.stats.speed +

        c.stats.durability * 1.2 +

        c.stats.intelligence * .75 +

        c.stats.power * 1.35

    );

}


function strongest(team) {

    return [...team].sort(

        (a,b) =>
            powerScore(b) -
            powerScore(a)

    )[0];

}


function fastest(team) {

    return [...team].sort(

        (a,b) =>
            b.stats.speed -
            a.stats.speed

    )[0];

}


function smartest(team) {

    return [...team].sort(

        (a,b) =>
            b.stats.intelligence -
            a.stats.intelligence

    )[0];

}


/* =========================================================
   TEAM POWER
========================================================= */

function teamPower(team) {

    if (!team.length) {
        return 0;
    }


    let score = 0;


    team.forEach(character => {

        score +=
            powerScore(character);

    });


    const intelligence =
        team.reduce(
            (sum,c) =>
                sum + c.stats.intelligence,
            0
        ) / team.length;


    const power =
        team.reduce(
            (sum,c) =>
                sum + c.stats.power,
            0
        ) / team.length;


    /*
       Smaller synergy bonus than the original system.

       This prevents intelligence alone from deciding
       the entire battle.
    */

    score += intelligence * 3;

    score += power * 2;


    /*
       Team composition bonus.

       Different fighting styles produce more useful
       cooperation than simply having five powerful
       characters.
    */

    const ranged =
        team.filter(c =>
            /flight|energy|magic|lightning|arrows|firearms|telepathy|blast|project/i
                .test(
                    c.abilities +
                    c.fightingStyle
                )
        ).length;


    const tactical =
        team.filter(c =>
            c.stats.intelligence >= 85
        ).length;


    if (ranged >= 2) {

        score += 25;

    }


    if (tactical >= 2) {

        score += 20;

    }


    return score;

}


/* =========================================================
   WORD COUNT
========================================================= */

function fitWords(text,min,max) {

    let words =
        text.split(/\s+/);


    if (
        words.length >= min &&
        words.length <= max
    ) {

        return text;

    }


    if (words.length > max) {

        words =
            words.slice(0,max);


        let result =
            words.join(" ");


        if (
            !/[.!?]$/.test(result)
        ) {

            result += ".";

        }


        return result;

    }


    const additions = [

        "The battlefield shook beneath the continuing impact.",

        "Neither side was willing to surrender the advantage.",

        "Every fighter was forced to adapt as the situation changed.",

        "The pressure continued to build until the final exchange.",

        "Damage accumulated as the fighters struggled to maintain their original strategy.",

        "The battle became less predictable as both teams adapted to what they had already seen."

    ];


    let safety = 0;


    while (
        words.length < min &&
        safety < 20
    ) {

        const addition =
            randomItem(additions);


        words =
            words.concat(
                addition.split(/\s+/)
            );


        if (
            words.length > max
        ) {

            words =
                words.slice(0,max);

        }


        safety++;

    }


    let result =
        words.join(" ");


    if (
        !/[.!?]$/.test(result)
    ) {

        result += ".";

    }


    return result;

}

    document
        .getElementById("singleDescription")
        .innerText =
