<title>Superhero Battle Simulator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top, #202738, #0a0c11 55%, #050608);
    color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    text-align: center;
    padding: 38px 20px;
    background: rgba(8, 9, 13, .95);
    border-bottom: 1px solid #333;
}

header h1 {
    margin: 0;
    font-size: clamp(30px, 5vw, 52px);
    letter-spacing: 2px;
}

header p {
    color: #aaa;
}

.container {
    width: 94%;
    max-width: 1250px;
    margin: 25px auto;
}

.panel {
    background: #151820;
    border: 1px solid #30343e;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 25px;
}

.settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

.setting {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.setting label {
    color: #aaa;
    font-weight: bold;
}

select {
    background: #242934;
    color: white;
    border: 1px solid #444;
    padding: 12px;
    border-radius: 8px;
    font-size: 15px;
}

.teams {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.team {
    background: #151820;
    padding: 24px;
    border-radius: 16px;
    border: 2px solid #333;
}

.team.one {
    border-color: #245cff;
}

.team.two {
    border-color: #d83245;
}

.characters {
    min-height: 150px;
}

.character {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #242934;
    border-radius: 9px;
    padding: 12px;
    margin: 9px 0;
}

.character small {
    color: #999;
}

button {
    border: 0;
    border-radius: 9px;
    padding: 13px 19px;
    color: white;
    background: #3b4252;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    filter: brightness(1.2);
}

.add-one {
    background: #245cff;
}

.add-two {
    background: #d83245;
}

.start {
    display: block;
    margin: 30px auto;
    background: #e63946;
    font-size: 20px;
    padding: 17px 32px;
}

.clear {
    display: block;
    margin: 0 auto;
    background: #555;
}

#battle {
    background: #10131a;
    border: 1px solid #30343e;
    border-radius: 16px;
    padding: 30px;
    margin: 30px auto 60px;
}

.battle-header {
    text-align: center;
    margin-bottom: 35px;
}

.battle-header h2 {
    font-size: 34px;
}

.battle-header p {
    color: #999;
}

.round-title {
    margin-top: 38px;
    margin-bottom: 15px;
    padding: 13px 17px;
    border-left: 5px solid #e63946;
    background: #232936;
    border-radius: 7px;
    font-size: 21px;
    font-weight: bold;
}

.story {
    font-size: 17px;
    line-height: 1.85;
    color: #d9d9d9;
    margin: 16px 0;
}

.story strong {
    color: white;
}

.status {
    margin-top: 25px;
    padding: 18px;
    background: #181c25;
    border-radius: 10px;
}

.status-row {
    margin: 8px 0;
}

.health {
    height: 8px;
    background: #30343d;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 5px;
}

.health-fill {
    height: 100%;
    background: #49bd69;
}

.defeated {
    color: #777;
    text-decoration: line-through;
}

.winner {
    text-align: center;
    margin-top: 35px;
    padding: 25px;
    background: #202637;
    border-radius: 14px;
    font-size: 32px;
    font-weight: bold;
}

@media(max-width: 800px) {
    .teams {
        grid-template-columns: 1fr;
    }

    #battle {
        padding: 20px;
    }

    .story {
        font-size: 16px;
    }
}

                <option value="2">2v2</option>

        </div>

        <div class="setting">
            <label>Version</label>

                <option value="Amped">Amped</option>
                <option value="Mixed">Mixed</option>
            </select>
        </div>

        <div class="setting">
            <label>Battle Depth</label>
            <select id="depth">
                <option value="quick">Quick</option>
                <option value="standard" selected>Standard</option>
                <option value="detailed">Detailed</option>

            </select>
        </div>

    </div>

</div>


<div class="teams">

    </div>


    <div class="team two">

            🎲 Add Character
        </button>
    </div>

</div>


<button class="start" onclick="startBattle()">
    ⚔️ START BATTLE
</button>

<button class="clear" onclick="clearTeams()">
    Clear Teams
</button>


<div id="battle">

    </div>

/*
===========================================================
TEAM STORAGE
===========================================================
*/

let team1 = [];
let team2 = [];


/*
===========================================================
UTILITY
===========================================================
*/

function randomItem(array) {

    return array[
        Math.floor(Math.random() * array.length)
    ];

}


function clamp(value, min, max) {

    return Math.max(min, Math.min(max, value));

}


function getTeamSize() {

    return Number(
        document.getElementById("teamSize").value
    );

}


function getDepth() {

    return document.getElementById("depth").value;

}


/*
===========================================================
POOL
===========================================================
*/

function availableCharacters() {

    const universe =
        document.getElementById("universe").value;

    const used = [
        ...team1,
        ...team2
    ].map(x => x.name);

    return characters.filter(character => {

        const universeOK =
            universe === "Mixed" ||
            character.universe === universe;

        const unused =
            !used.includes(character.name);

        return universeOK && unused;

    });

}


/*
===========================================================
ADD CHARACTER
===========================================================
*/

function addCharacter(teamNumber) {

    const size = getTeamSize();

    const team =
        teamNumber === 1
            ? team1
            : team2;

    if (team.length >= size) {

        alert(
            `Team ${teamNumber} already has ${size} fighter${size > 1 ? "s" : ""}.`
        );

        return;
    }

    const pool = availableCharacters();

    if (!pool.length) {

        alert("No unused characters remain in this pool.");

        return;
    }

    const character = {
        ...randomItem(pool)
    };

    const versionMode =
        document.getElementById("version").value;

    if (versionMode === "Mixed") {

        character.version =
            Math.random() < .5
                ? "Standard"
                : "Amped";

    } else {

        character.version = versionMode;

    }

    team.push(character);

    displayTeams();

}


/*
===========================================================
DISPLAY
===========================================================
*/

function displayTeams() {

    const size = getTeamSize();

    document.getElementById("count1").textContent =
        `${team1.length} / ${size}`;

    document.getElementById("count2").textContent =
        `${team2.length} / ${size}`;

    renderTeam(team1, 1);
    renderTeam(team2, 2);

}


function renderTeam(team, number) {

    const element =
        document.getElementById(`team${number}`);

    element.innerHTML = "";

    team.forEach((fighter, index) => {

        const div =
            document.createElement("div");

        div.className = "character";

        div.innerHTML = `

            <div>
                <strong>${index + 1}. ${fighter.name}</strong>
                <br>
                <small>
                    ${fighter.universe} • ${fighter.version}
                </small>
            </div>

            <button onclick="removeCharacter(${number}, ${index})">
                ✕
            </button>

        `;

        element.appendChild(div);

    });

}


function removeCharacter(team, index) {

    if (team === 1) {

        team1.splice(index, 1);

    } else {

        team2.splice(index, 1);

    }

    displayTeams();

}


function clearTeams() {

    team1 = [];
    team2 = [];

    displayTeams();

    document.getElementById("battle").innerHTML = `

        <div class="battle-header">
            <h2>⚔️ Battle Center</h2>
            <p>Teams cleared.</p>
        </div>

    `;

}


/*
===========================================================
EFFECTIVE STATS

AMPED MODE increases performance without changing the
character's actual move list.
===========================================================
*/

function stat(fighter, name) {

    let value =
        fighter.stats[name] || 0;

    if (fighter.version === "Amped") {

        value *= 1.15;

    }

    return value;

}


/*
===========================================================
POWER
===========================================================
*/

function overallPower(fighter) {

    return (

        stat(fighter, "strength") * .20 +
        stat(fighter, "speed") * .15 +
        stat(fighter, "durability") * .20 +
        stat(fighter, "intelligence") * .15 +
        stat(fighter, "combat") * .20 +
        stat(fighter, "energy") * .05 +
        stat(fighter, "range") * .05

    );

}


/*
===========================================================
CREATE BATTLE FIGHTERS
===========================================================
*/

function prepareTeam(team) {

    return team.map(fighter => ({

        ...fighter,

        health: 100,

        active: true,

        momentum: 0,

        usedMoves: [],

        adaptation: 0,

        lastMove: null

    }));

}


/*
===========================================================
ACTIVE
===========================================================
*/

function active(team) {

    return team.filter(fighter => fighter.active);

}


/*
===========================================================
TARGET SELECTION
===========================================================
*/

function chooseTarget(enemyTeam) {

    const alive =
        active(enemyTeam);

    if (!alive.length) {
        return null;
    }

    /*
        Prioritize wounded fighters sometimes.
        Other times target the strongest threat.
    */

    const wounded =
        [...alive].sort(
            (a, b) =>
                a.health - b.health
        )[0];

    const strongest =
        [...alive].sort(
            (a, b) =>
                overallPower(b) -
                overallPower(a)
        )[0];

    const roll = Math.random();

    if (roll < .50) {
        return wounded;
    }

    if (roll < .80) {
        return strongest;
    }

    return randomItem(alive);

}


/*
===========================================================
MATCHUP INFORMATION
===========================================================
*/

function matchup(attacker, defender) {

    const exact =
        interactions[
            `${attacker.name}|${defender.name}`
        ];

    if (exact) {
        return exact;
    }

    return null;

}


/*
===========================================================
MOVE SELECTION
===========================================================
*/

function chooseMove(attacker, defender) {

    const moves =
        attacker.moves || [];

    if (!moves.length) {
        return null;
    }

    let available =
        moves.filter(
            move =>
                move.name !== attacker.lastMove
        );

    if (!available.length) {
        available = moves;
    }

    /*
        Choose moves according to the situation.
    */

    if (
        defender.health < 30 &&
        Math.random() < .55
    ) {

        const strong =
            available.filter(
                move =>
                    move.power >= 80
            );

        if (strong.length) {
            return randomItem(strong);
        }

    }

    if (
        attacker.health < 30 &&
        Math.random() < .35
    ) {

        const defensive =
            available.filter(
                move =>
                    move.type === "defense"
            );

        if (defensive.length) {
            return randomItem(defensive);
        }

    }

    const matchupData =
        matchup(
            attacker,
            defender
        );

    if (
        matchupData &&
        Math.random() < .55
    ) {

        const strategic =
            available.filter(
                move =>
                    move.type === "strategy" ||
                    move.type === "control"
            );

        if (strategic.length) {
            return randomItem(strategic);
        }

    }

    return randomItem(available);

}


/*
===========================================================
DAMAGE
===========================================================
*/

function calculateDamage(
    attacker,
    defender,
    move
) {

    let attackPower =
        move.power;

    attackPower +=
        stat(attacker, "combat") * .18;

    attackPower +=
        stat(attacker, "strength") * .12;

    attackPower +=
        stat(attacker, "energy") * .08;


    /*
        Ranged attacks benefit from range.
    */

    if (
        move.type === "ranged" ||
        move.type === "energy"
    ) {

        attackPower +=
            stat(attacker, "range") * .10;

    }


    /*
        Defense reduces incoming damage.
    */

    let defense =
        stat(defender, "durability") * .25;


    /*
        Speed can help avoid attacks.
    */

    const speedDifference =
        stat(attacker, "speed") -
        stat(defender, "speed");


    if (
        speedDifference > 20
    ) {

        attackPower += 8;

    }

    if (
        speedDifference < -20
    ) {

        attackPower -= 5;

    }


    /*
        Momentum
    */

    attackPower +=
        attacker.momentum * .25;


    /*
        Adaptation
    */

    attackPower +=
        attacker.adaptation;


    /*
        Amped
    */

    if (
        attacker.version === "Amped"
    ) {

        attackPower *= 1.15;

    }


    /*
        Random variance
    */

    const variance =
        .85 +
        Math.random() * .3;

    let damage =
        (attackPower - defense * .20)
        * .20
        * variance;


    /*
        Minimum meaningful damage.
    */

    damage =
        Math.max(
            4,
            Math.round(damage)
        );


    return damage;

}


/*
===========================================================
DEFENSE CHECK
===========================================================
*/

function avoided(
    attacker,
    defender,
    move
) {

    let chance = 0;

    chance +=
        stat(defender, "speed") * .0015;

    chance +=
        stat(defender, "combat") * .0008;

    if (
        move.type === "ranged" ||
        move.type === "energy"
    ) {

        chance -= .03;

    }

    if (
        stat(defender, "speed") >
        stat(attacker, "speed") + 20
    ) {

        chance += .10;

    }

    return Math.random() < clamp(
        chance,
        .03,
        .35
    );

}


/*
===========================================================
ATTACK NARRATIVE
===========================================================
*/

function attackExchange(
    attacker,
    defender
) {

    const move =
        chooseMove(
            attacker,
            defender
        );

    if (!move) {
        return "";
    }

    attacker.lastMove =
        move.name;

    attacker.usedMoves.push(
        move.name
    );

    const matchupData =
        matchup(
            attacker,
            defender
        );

    let text = "";


    /*
        Opening observation.
    */

    if (
        attacker.usedMoves.length === 1
    ) {

        text += `

            <p class="story">
                <strong>${attacker.name}</strong>
                studies
                <strong>${defender.name}</strong>
                for a brief moment, resisting the temptation
                to attack immediately. The first exchange matters;
                revealing the wrong ability too early could allow
                the opponent to build a counter around it.
            </p>

        `;

    }


    /*
        Matchup-specific strategy.
    */

    if (
        matchupData
    ) {

        text += `

            <p class="story">
                ${matchupData.text}
            </p>

        `;

    }


    /*
        Exact move.
    */

    text += `

        <p class="story">

            <strong>${attacker.name}</strong>
            commits to
            <strong>${move.name}</strong>.

            ${move.description.charAt(0).toUpperCase() +
            move.description.slice(1)}.

        </p>

    `;


    /*
        Defense / hit.
    */

    if (
        avoided(
            attacker,
            defender,
            move
        )
    ) {

        attacker.momentum += 2;

        text += `

            <p class="story">

                <strong>${defender.name}</strong>
                reacts before the attack can fully connect.

                Rather than attempting to absorb the impact,
                ${defender.name} changes position at the last
                possible instant. The attack misses its intended
                target, although the maneuver forces
                ${defender.name} into a less favorable position.

            </p>

        `;

        return text;

    }


    /*
        Damage.
    */

    const damage =
        calculateDamage(
            attacker,
            defender,
            move
        );


    defender.health =
        clamp(
            defender.health - damage,
            0,
            100
        );


    attacker.momentum +=
        4;


    defender.momentum +=
        1;


    /*
        Describe result.
    */

    text += `

        <p class="story">

            The attack connects.

            <strong>${defender.name}</strong>
            manages to withstand the worst of the impact,
            but the force of the exchange leaves a visible
            effect on their ability to continue fighting.

            Approximately
            <strong>${damage}%</strong>
            of their remaining fighting capacity is lost.

        </p>

    `;


    /*
        Knockout.
    */

    if (
        defender.health <= 0
    ) {

        defender.health = 0;

        defender.active = false;

        attacker.momentum += 15;

        text += `

            <p class="story">

                The damage finally proves decisive.

                <strong>${defender.name}</strong>
                can no longer continue the fight.

                The knockout does more than remove a fighter;
                it changes the tactical structure of the battle,
                leaving the surviving team with new targets
                and fewer threats to account for.

            </p>

        `;

    }


    /*
        Counter opportunity.
    */

    else if (
        Math.random() <
        (
            .12 +
            stat(defender, "combat") / 500
        )
    ) {

        text += counterAttack(
            defender,
            attacker
        );

    }


    return text;

}


/*
===========================================================
COUNTER ATTACK
===========================================================
*/

function counterAttack(
    defender,
    attacker
) {

    if (
        !defender.active ||
        !attacker.active
    ) {
        return "";
    }

    const move =
        chooseMove(
            defender,
            attacker
        );

    if (!move) {
        return "";
    }

    const counterDamage =
        Math.max(
            4,
            Math.round(
                move.power *
                .12 +
                stat(defender, "combat") *
                .06
            )
        );


    attacker.health =
        clamp(
            attacker.health -
            counterDamage,
            0,
            100
        );


    defender.momentum += 6;


    let text = `

        <p class="story">

            The exchange is not finished.

            <strong>${defender.name}</strong>
            recognizes the opening created by
            <strong>${attacker.name}'s</strong>
            commitment and immediately responds with
            <strong>${move.name}</strong>.

            ${move.description.charAt(0).toUpperCase() +
            move.description.slice(1)}.

            The counter catches
            <strong>${attacker.name}</strong>
            before they can completely reset their position,
            costing them approximately
            <strong>${counterDamage}%</strong>
            of their remaining strength.

        </p>

    `;


    if (
        attacker.health <= 0
    ) {

        attacker.health = 0;

        attacker.active = false;

        text += `

            <p class="story">

                The counterattack is enough.

                <strong>${attacker.name}</strong>
                is knocked out, and the momentum of the
                battle shifts dramatically.

            </p>

        `;

    }


    return text;

}


/*
===========================================================
TEAMWORK
===========================================================
*/

function teamInteraction(
    attackingTeam,
    defendingTeam
) {

    const attackers =
        active(attackingTeam);

    const defenders =
        active(defendingTeam);

    if (
        attackers.length < 2 ||
        defenders.length === 0
    ) {

        return "";

    }

    if (
        Math.random() > .48
    ) {

        return "";

    }


    const first =
        randomItem(attackers);

    const second =
        randomItem(
            attackers.filter(
                x => x !== first
            )
        );


    if (!second) {
        return "";
    }


    const target =
        chooseTarget(
            defenders
        );


    if (!target) {
        return "";
    }


    const move1 =
        chooseMove(
            first,
            target
        );

    const move2 =
        chooseMove(
            second,
            target
        );


    const damage =
        Math.max(
            5,
            Math.round(
                (
                    move1.power +
                    move2.power
                ) * .075
            )
        );


    target.health =
        clamp(
            target.health -
            damage,
            0,
            100
        );


    first.momentum += 5;

    second.momentum += 5;


    let text = `

        <p class="story">

            <strong>TEAM COORDINATION:</strong>

            <strong>${first.name}</strong>
            does not attack immediately.

            Instead, they create an opening for
            <strong>${second.name}</strong>.

            ${first.name}
            uses
            <strong>${move1.name}</strong>
            while
            ${second.name}
            follows with
            <strong>${move2.name}</strong>.

            The two attacks arrive from different angles,
            forcing
            <strong>${target.name}</strong>
            to divide their attention.

            The combination deals approximately
            <strong>${damage}%</strong>
            additional damage.

        </p>

    `;


    if (
        target.health <= 0
    ) {

        target.health = 0;

        target.active = false;

        text += `

            <p class="story">

                The coordinated assault is decisive.

                <strong>${target.name}</strong>
                is knocked out before they can recover
                their position.

            </p>

        `;

    }


    return text;

}


/*
===========================================================
ADAPTATION
===========================================================
*/

function adapt(team) {

    const fighters =
        active(team);

    if (!fighters.length) {
        return "";
    }

    const fighter =
        randomItem(fighters);

    fighter.adaptation += 2;

    return `

        <p class="story">

            <strong>${fighter.name}</strong>
            has now seen enough of the opposing strategy
            to begin adjusting.

            The fighter stops repeating the same approach
            and begins looking for a different route through
            the opponent's defenses.

            It is a small adjustment, but in a battle this
            close, small adjustments can become decisive.

        </p>

    `;

}


/*
===========================================================
STATUS
===========================================================
*/

function statusBlock(
    team1,
    team2
) {

    let html = `

        <div class="status">

            <strong>Battle Status</strong>

    `;


    [
        ["TEAM 1", team1],
        ["TEAM 2", team2]
    ].forEach(([name, team]) => {

        html += `<p><strong>${name}</strong></p>`;

        team.forEach(fighter => {

            html += `

                <div class="status-row">

                    <span class="${
                        fighter.active
                            ? ""
                            : "defeated"
                    }">

                        ${fighter.name}

                    </span>

                    — ${fighter.health}%

                    <div class="health">

                        <div
                            class="health-fill"
                            style="width:${fighter.health}%">
                        </div>

                    </div>

                </div>

            `;

        });

    });


    html += `</div>`;

    return html;

}


/*
===========================================================
BATTLEFIELD
===========================================================
*/

const battlefields = [

    {
        name: "Abandoned Downtown",
        text:
            "A ruined downtown district surrounds the fighters. Broken vehicles, damaged buildings and collapsed streets provide both cover and obstacles."
    },

    {
        name: "Industrial Complex",
        text:
            "The teams face one another inside an enormous industrial complex filled with metal structures, machinery and elevated platforms."
    },

    {
        name: "Ruined Arena",
        text:
            "A massive arena has been reduced to broken stone and twisted metal. The open center leaves little room for anyone to hide."
    },

    {
        name: "Open Battlefield",
        text:
            "There is almost no cover. Every movement is visible, forcing both teams to rely heavily on speed, power and tactical positioning."
    }

];


/*
===========================================================
ROUND COUNT
===========================================================
*/

function roundCount() {

    const depth = getDepth();

    if (depth === "quick") {
        return 3;
    }

    if (depth === "standard") {
        return 5;
    }

    if (depth === "detailed") {
        return 8;
    }

    return 12;

}


/*
===========================================================
OPENING
===========================================================
*/

function openingStory(
    team1,
    team2,
    battlefield
) {

    return `

        <div class="round-title">
            🏟️ THE BATTLEFIELD
        </div>

        <p class="story">

            <strong>${battlefield.name}</strong>.

            ${battlefield.text}

            Neither team moves immediately.

            Instead, the fighters take several seconds
            to study the people standing opposite them.

            The strongest combatants naturally draw the
            most attention, but experienced fighters know
            that the obvious threat is not always the most
            dangerous one.

            Every member of both teams is now looking for
            the first mistake.

        </p>

        <div class="round-title">
            ⚔️ THE OPENING EXCHANGE
        </div>

        <p class="story">

            The silence finally breaks.

            Both teams move almost simultaneously,
            and the carefully constructed formations
            begin to collapse into individual engagements.

            From this point forward, every decision matters:
            who is targeted, which ability is revealed,
            who protects a teammate, and who recognizes
            the opponent's strategy first.

        </p>

    `;

}


/*
===========================================================
MAIN BATTLE
===========================================================
*/

function startBattle() {

    const size =
        getTeamSize();


    if (
        team1.length !== size ||
        team2.length !== size
    ) {

        alert(
            `Both teams must contain exactly ${size} fighter${size > 1 ? "s" : ""}.`
        );

        return;

    }


    const fighters1 =
        prepareTeam(team1);

    const fighters2 =
        prepareTeam(team2);


    const battlefield =
        randomItem(
            battlefields
        );


    const rounds =
        roundCount();


    let html = `

        <div class="battle-header">

            <h2>
                ⚔️ BATTLE SIMULATION
            </h2>

            <p>

                ${size}v${size}
                •
                ${document.getElementById("universe").value}
                •
                ${document.getElementById("version").value}
                •
                ${getDepth()}

            </p>

        </div>

    `;


    html +=
        openingStory(
            fighters1,
            fighters2,
            battlefield
        );


    /*
        ROUND LOOP
    */

    for (
        let round = 1;
        round <= rounds;
        round++
    ) {

        if (
            active(fighters1).length === 0 ||
            active(fighters2).length === 0
        ) {

            break;

        }


        html += `

            <div class="round-title">
                🔥 ROUND ${round}
            </div>

        `;


        /*
            Number of exchanges increases
            as the battle becomes more intense.
        */

        const exchanges =
            round <= 2
                ? 3
                : round <= 5
                    ? 4
                    : 5;


        for (
            let exchange = 0;
            exchange < exchanges;
            exchange++
        ) {

            if (
                active(fighters1).length === 0 ||
                active(fighters2).length === 0
            ) {

                break;

            }


            const attackingTeam =
                exchange % 2 === 0
                    ? fighters1
                    : fighters2;


            const defendingTeam =
                exchange % 2 === 0
                    ? fighters2
                    : fighters1;


            const attacker =
                chooseTarget(
                    attackingTeam
                );


            const defender =
                chooseTarget(
                    defendingTeam
                );


            if (
                !attacker ||
                !defender
            ) {

                break;

            }


            html +=
                attackExchange(
                    attacker,
                    defender
                );


            /*
                Occasional coordinated attack.
            */

            if (
                exchange === 1 ||
                exchange === exchanges - 1
            ) {

                html +=
                    teamInteraction(
                        attackingTeam,
                        defendingTeam
                    );

            }

        }


        /*
            Adaptation occurs after major rounds.
        */

        if (
            round >= 2
        ) {

            if (
                Math.random() < .65
            ) {

                html +=
                    adapt(fighters1);

            }

            if (
                Math.random() < .65
            ) {

                html +=
                    adapt(fighters2);

            }

        }


        /*
            Battle status after each round.
        */

        html +=
            statusBlock(
                fighters1,
                fighters2
            );

    }


    /*
        FINAL RESULT
    */

    const alive1 =
        active(fighters1);

    const alive2 =
        active(fighters2);


    let winner;


    if (
        alive1.length === 0
    ) {

        winner = "TEAM 2";

    }

    else if (
        alive2.length === 0
    ) {

        winner = "TEAM 1";

    }

    else {

        const score1 =
            fighters1.reduce(
                (sum, fighter) =>
                    sum +
                    fighter.health +
                    overallPower(fighter) * .35,
                0
            );


        const score2 =
            fighters2.reduce(
                (sum, fighter) =>
                    sum +
                    fighter.health +
                    overallPower(fighter) * .35,
                0
            );


        winner =
            score1 >= score2
                ? "TEAM 1"
                : "TEAM 2";

    }


    const winningTeam =
        winner === "TEAM 1"
            ? fighters1
            : fighters2;


    html += `

        <div class="round-title">
            🏆 THE CONCLUSION
        </div>

        <p class="story">

            The battle finally reaches its breaking point.

            What began as two organized teams has become
            a collection of exhausted fighters struggling
            to remain standing.

            The surviving members of
            <strong>${winner}</strong>
            are the last combatants with enough strength
            and tactical control to continue.

            The opposing team has been pushed beyond the
            point where another coordinated response is
            realistically possible.

            The battlefield falls quiet.

            For several seconds, nobody moves.

            Then the reality of the result becomes clear.

        </p>

        <div class="winner">

            🏆 ${winner} WINS!

        </div>

        <div class="round-title">
            📊 FINAL STATUS
        </div>

    `;


    html +=
        statusBlock(
            fighters1,
            fighters2
        );


    document.getElementById(
        "battle"
    ).innerHTML =
        html;


    document.getElementById(
        "battle"
    ).scrollIntoView({
        behavior: "smooth"
    });

}
