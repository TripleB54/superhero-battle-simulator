<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STARK // BATTLE COMMAND</title>

<style>

/* =========================================================
   STARK HUD CORE
========================================================= */

:root{
    --cyan:#00eaff;
    --cyan2:#00a9c9;
    --gold:#ffc83d;
    --red:#ff4055;
    --green:#4dff9a;
    --dark:#02070b;
    --panel:#061119;
    --panel2:#091923;
    --line:#16485a;
    --text:#dffaff;
    --muted:#63818d;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    color:var(--text);
    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(0,210,255,.12),
            transparent 35%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(255,180,30,.06),
            transparent 30%
        ),
        #020609;
    font-family:
        "Arial Narrow",
        Arial,
        sans-serif;
    overflow-x:hidden;
}

/* HUD GRID */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.055;
    background-image:
        linear-gradient(rgba(0,234,255,.8) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,234,255,.8) 1px,transparent 1px);
    background-size:40px 40px;
    z-index:100;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,.015) 4px
        );
    z-index:101;
}

/* =========================================================
   TOP COMMAND BAR
========================================================= */

.topbar{
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 35px;

    background:
        linear-gradient(
            180deg,
            rgba(8,25,35,.98),
            rgba(2,9,13,.98)
        );

    border-bottom:1px solid var(--cyan2);

    box-shadow:
        0 0 30px rgba(0,220,255,.1),
        inset 0 -1px 0 rgba(0,234,255,.15);

    position:relative;
    z-index:5;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.arc-mini{
    width:34px;
    height:34px;
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            white 0 8%,
            var(--cyan) 9% 30%,
            #006d83 31% 48%,
            transparent 49%
        );

    box-shadow:
        0 0 12px var(--cyan),
        0 0 28px rgba(0,234,255,.45);
}

.brand-title{
    font-size:21px;
    letter-spacing:6px;
    font-weight:900;
}

.brand-title span{
    color:var(--cyan);
}

.system-status{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--green);
    font-size:10px;
    letter-spacing:3px;
}

.status-light{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 14px var(--green);
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    50%{
        opacity:.35;
    }
}

/* =========================================================
   MAIN
========================================================= */

.command-center{
    width:min(1500px,94%);
    margin:auto;
    padding:25px 0 60px;
}

/* =========================================================
   COMMAND HEADER
========================================================= */

.command-header{
    display:grid;
    grid-template-columns:1fr 260px 1fr;
    align-items:center;
    gap:20px;
    margin-bottom:20px;
}

.command-side{
    height:1px;
    background:
        linear-gradient(
            90deg,
            transparent,
            var(--cyan),
            transparent
        );
}

.command-title{
    text-align:center;
}

.command-title .small{
    font-size:9px;
    letter-spacing:5px;
    color:var(--muted);
}

.command-title h1{
    margin:5px 0 0;
    font-size:27px;
    letter-spacing:6px;
    color:white;
    text-shadow:0 0 20px rgba(0,234,255,.35);
}

/* =========================================================
   REACTOR
========================================================= */

.reactor-section{
    display:flex;
    justify-content:center;
    margin:5px 0 28px;
}

.reactor{
    width:190px;
    height:190px;
    position:relative;
    display:grid;
    place-items:center;
}

.reactor-ring{
    position:absolute;
    border-radius:50%;
    border:1px solid var(--cyan);
}

.r1{
    width:180px;
    height:180px;
    opacity:.35;
    animation:spin 15s linear infinite;
}

.r2{
    width:150px;
    height:150px;
    border-style:dashed;
    opacity:.6;
    animation:spinReverse 10s linear infinite;
}

.r3{
    width:115px;
    height:115px;
    opacity:.8;
}

.reactor-core{
    width:70px;
    height:70px;
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            white 0 7%,
            #7fffff 8% 22%,
            var(--cyan) 23% 45%,
            #00728d 46% 65%,
            #03242e 66%
        );

    box-shadow:
        0 0 15px var(--cyan),
        0 0 40px var(--cyan),
        0 0 80px rgba(0,234,255,.35);
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes spinReverse{
    to{
        transform:rotate(-360deg);
    }
}

.reactor-label{
    position:absolute;
    bottom:-25px;
    font-size:8px;
    letter-spacing:4px;
    color:var(--cyan);
}

/* =========================================================
   CONTROL DECK
========================================================= */

.control-deck{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:1px;

    background:var(--line);
    border:1px solid var(--line);

    box-shadow:
        0 0 35px rgba(0,0,0,.8);
}

.control{
    padding:15px;
    background:
        linear-gradient(
            135deg,
            #081821,
            #03090d
        );

    position:relative;
}

.control::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:25px;
    height:1px;
    background:var(--cyan);
}

.control label{
    display:block;
    font-size:8px;
    letter-spacing:3px;
    color:var(--muted);
    margin-bottom:9px;
}

select{
    width:100%;
    background:#02080c;
    border:1px solid #1a5365;
    color:var(--cyan);
    padding:10px;
    outline:none;
    font-weight:bold;
    letter-spacing:1px;
}

select:focus{
    border-color:var(--cyan);
    box-shadow:0 0 12px rgba(0,234,255,.15);
}

/* =========================================================
   COMMAND BUTTONS
========================================================= */

.command-buttons{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:10px;
    margin:12px 0;
}

button{
    position:relative;
    padding:14px 18px;
    color:white;
    background:#06131b;
    border:1px solid #1a596c;
    font-weight:bold;
    letter-spacing:2px;
    cursor:pointer;
    overflow:hidden;
    transition:.15s;
}

button::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:3px;
    background:var(--cyan);
}

button:hover{
    color:var(--cyan);
    border-color:var(--cyan);
    box-shadow:
        0 0 20px rgba(0,234,255,.15),
        inset 0 0 15px rgba(0,234,255,.05);
}

.primary{
    background:
        linear-gradient(
            90deg,
            #063949,
            #061821
        );
}

.gold{
    border-color:#796024;
}

.gold::before{
    background:var(--gold);
}

.danger{
    border-color:#6d2932;
}

.danger::before{
    background:var(--red);
}

/* =========================================================
   GENERIC HUD PANEL
========================================================= */

.hud-panel{
    position:relative;
    background:
        linear-gradient(
            135deg,
            rgba(7,22,31,.98),
            rgba(2,8,12,.98)
        );

    border:1px solid var(--line);

    box-shadow:
        0 15px 40px rgba(0,0,0,.55),
        inset 0 0 30px rgba(0,234,255,.025);

    padding:18px;
}

.hud-panel::before,
.hud-panel::after{
    content:"";
    position:absolute;
    width:20px;
    height:20px;
    pointer-events:none;
}

.hud-panel::before{
    top:-1px;
    left:-1px;
    border-top:2px solid var(--cyan);
    border-left:2px solid var(--cyan);
}

.hud-panel::after{
    bottom:-1px;
    right:-1px;
    border-bottom:2px solid var(--cyan);
    border-right:2px solid var(--cyan);
}

.panel-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:12px;
    margin-bottom:14px;
    border-bottom:1px solid #153b49;
}

.panel-heading h2{
    margin:0;
    font-size:11px;
    letter-spacing:4px;
}

.panel-code{
    color:var(--gold);
    font-size:9px;
    letter-spacing:2px;
}

/* =========================================================
   CHARACTER BOARD
========================================================= */

.pool-panel{
    margin-top:12px;
}

.pool{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.character-card{
    min-height:78px;
    position:relative;
    padding:12px;

    background:
        linear-gradient(
            135deg,
            rgba(12,29,39,.95),
            rgba(3,10,14,.98)
        );

    border:1px solid #183d4a;

    cursor:pointer;

    transition:
        transform .15s,
        border .15s,
        box-shadow .15s;

    overflow:hidden;
}

.character-card::after{
    content:"";
    position:absolute;
    right:-15px;
    top:-15px;
    width:45px;
    height:45px;
    border-radius:50%;
    background:var(--accent);
    opacity:.07;
    filter:blur(3px);
}

.character-card:hover{
    transform:translateY(-3px);
    border-color:var(--accent);
    box-shadow:
        0 0 20px color-mix(
            in srgb,
            var(--accent),
            transparent 75%
        );
}

.character-card.selected{
    opacity:.18;
    pointer-events:none;
}

.character-name{
    font-size:12px;
    font-weight:bold;
    color:white;
}

.character-info{
    margin-top:7px;
    color:var(--muted);
    font-size:8px;
    letter-spacing:1px;
}

.pick-label{
    position:absolute;
    top:7px;
    right:7px;
    font-size:7px;
    color:var(--gold);
}

/* =========================================================
   TEAMS
========================================================= */

.team-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:12px;
}

.team-panel{
    min-height:230px;
}

.alpha{
    border-color:#17647b;
}

.omega{
    border-color:#672b34;
}

.alpha .panel-heading{
    border-color:#15566a;
}

.omega .panel-heading{
    border-color:#5c2931;
}

.team-title{
    font-size:12px;
    letter-spacing:4px;
}

.alpha .team-title{
    color:var(--cyan);
}

.omega .team-title{
    color:var(--red);
}

.slots{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.slot{
    min-height:110px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#03090d;
    border:1px dashed #1c3944;
    text-align:center;
}

.slot.filled{
    border-style:solid;
    border-color:var(--accent);
    box-shadow:inset 0 0 20px color-mix(
        in srgb,
        var(--accent),
        transparent 90%
    );
}

.avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    display:grid;
    place-items:center;
    margin-bottom:8px;

    background:
        radial-gradient(
            circle,
            white 0 5%,
            var(--accent) 6% 60%,
            #071018 61%
        );

    box-shadow:0 0 15px var(--accent);
    font-size:9px;
    font-weight:bold;
}

.slot-name{
    font-size:9px;
    font-weight:bold;
}

/* =========================================================
   BATTLE COMMAND CENTER
========================================================= */

.battle-panel{
    margin-top:12px;
}

.battle-top{
    display:grid;
    grid-template-columns:1fr 170px 1fr;
    gap:15px;
    align-items:center;
    margin-bottom:18px;
}

.side-readout{
    padding:12px;
    background:#03090d;
    border:1px solid #163b48;
}

.readout-label{
    color:var(--muted);
    font-size:8px;
    letter-spacing:3px;
}

.readout-value{
    margin-top:5px;
    font-size:17px;
    font-weight:bold;
}

.alpha-value{
    color:var(--cyan);
}

.omega-value{
    color:var(--red);
}

.battle-reactor{
    width:95px;
    height:95px;
    margin:auto;
    border-radius:50%;
    display:grid;
    place-items:center;

    border:1px solid var(--cyan);

    background:
        radial-gradient(
            circle,
            white 0 5%,
            var(--cyan) 6% 20%,
            #005a70 21% 40%,
            transparent 41%
        );

    box-shadow:
        0 0 20px var(--cyan),
        0 0 50px rgba(0,234,255,.25);

    animation:battlePulse 2s infinite;
}

@keyframes battlePulse{
    50%{
        box-shadow:
            0 0 30px var(--cyan),
            0 0 70px rgba(0,234,255,.35);
    }
}

/* =========================================================
   HEALTH
========================================================= */

.health-panel{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}

.health-team{
    padding:12px;
    background:#03090d;
    border:1px solid #143542;
}

.health-title{
    font-size:9px;
    letter-spacing:3px;
    margin-bottom:10px;
}

.health-row{
    margin:8px 0;
}

.health-label{
    display:flex;
    justify-content:space-between;
    font-size:8px;
    color:#9db4be;
}

.health-bar{
    height:5px;
    margin-top:4px;
    background:#10212a;
    overflow:hidden;
}

.health-fill{
    height:100%;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
    transition:width .5s;
}

.health-fill.low{
    background:#ffb14e;
    box-shadow:0 0 8px #ffb14e;
}

.health-fill.dead{
    background:var(--red);
    box-shadow:0 0 8px var(--red);
}

/* =========================================================
   BATTLE FEED
========================================================= */

.battle-feed{
    height:620px;
    overflow-y:auto;
    padding-right:8px;
}

.battle-feed::-webkit-scrollbar{
    width:5px;
}

.battle-feed::-webkit-scrollbar-track{
    background:#02070a;
}

.battle-feed::-webkit-scrollbar-thumb{
    background:#15566a;
}

.round-card{
    margin:12px 0;
    padding:17px 18px;

    background:
        linear-gradient(
            90deg,
            rgba(8,27,36,.98),
            rgba(3,10,14,.98)
        );

    border-left:2px solid var(--cyan);

    color:#bdd1d8;

    line-height:1.75;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:14px;
}

.round-heading{
    color:var(--gold);
    font-family:Arial,sans-serif;
    font-size:9px;
    font-weight:bold;
    letter-spacing:3px;
    margin-bottom:10px;
}

.move{
    display:inline-block;
    padding:3px 7px;
    margin:3px 0;
    color:var(--cyan);
    font-family:Arial,sans-serif;
    font-weight:bold;
    letter-spacing:1px;
    border:1px solid #15576a;
    background:#061820;
}

.impact{
    color:white;
    font-weight:bold;
}
